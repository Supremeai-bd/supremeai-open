# SupremeAI Constitution Audit — Stable Rule Definitions
# This is the canonical list of all constitutional rules. Categories and IDs are immutable.
# Severity can change only with explicit governance approval.

meta:
  rule_000:
    title: "The Auditor Must Comply"
    description: "The Constitution Audit Engine itself must not violate architectural principles."
    severity: BLOCK
    category: meta

architecture:
  rule_001:
    title: "No Local-Machine Dependency"
    description: "Production code must not reference localhost, 127.0.0.1, or Windows-specific paths."
    severity: BLOCK
    fixable: true
    category: arch

  rule_002:
    title: "Reuse Before Create"
    description: "Existing capabilities must be composed before introducing new isolated modules."
    severity: WARN
    fixable: false
    category: arch

  rule_003:
    title: "Capability Before Module"
    description: "Module growth must follow capability reuse; building complete circles, not isolated features."
    severity: WARN
    fixable: false
    category: arch

  rule_004:
    title: "No Unnecessary Duplication"
    description: "Isolated code fragmentation and duplicate implementations are prohibited."
    severity: WARN
    fixable: false
    category: arch

security:
  rule_001:
    title: "Backend Authorization Is Final"
    description: "Authorization decisions must be enforced on the backend; client-side checks are insufficient."
    severity: WARN
    fixable: false
    category: sec

  rule_002:
    title: "No Secret Hardcoding"
    description: "Code must not contain hardcoded API keys, tokens, passwords, or private credentials."
    severity: BLOCK
    fixable: false
    category: sec

  rule_003:
    title: "No Unsafe Privilege Elevation"
    description: "Principle of least privilege must be enforced; no elevation without explicit authorization."
    severity: BLOCK
    fixable: false
    category: sec

configuration:
  rule_001:
    title: "Configuration/Policy Over Hardcoding"
    description: "Business logic and runtime decisions must be dynamic, not hardcoded."
    severity: WARN
    fixable: false
    category: cfg
  rule_002:
    title: "User Behavior Must Be Data-Driven"
    description: "Feature flags and policy decisions must be observable and configurable."
    severity: INFO
    fixable: false
    category: cfg

mcp_integration:
  rule_001:
    title: "MCP Is Infrastructure, Not Customer UX"
    description: "MCP complexity must be hidden from end users; only stable capabilities exposed."
    severity: WARN
    fixable: false
    category: mcp

  rule_002:
    title: "Unified Capability Contract"
    description: "Every capability must follow a consistent interface."
    severity: WARN
    fixable: false
    category: mcp

  rule_003:
    title: "Connection Must Be Environment-Agnostic"
    description: "Integrations must work identically across development, staging, production."
    severity: WARN
    fixable: false
    category: mcp

reliability:
  rule_001:
    title: "No Silent Failure"
    description: "Exception handlers must not silently swallow errors; they must log or re-raise."
    severity: BLOCK
    fixable: false
    category: rel

  rule_002:
    title: "Errors Must Be Observable"
    description: "Logging and telemetry are mandatory for production-critical paths."
    severity: WARN
    fixable: false
    category: rel

  rule_003:
    title: "New Features Must Be Testable"
    description: "New code must include test coverage; untestable features are not production-ready."
    severity: WARN
    fixable: false
    category: rel

cost:
  rule_001:
    title: "No Unapproved Paid Infrastructure"
    description: "Paid cloud services must be explicitly approved; free-tier limits protected."
    severity: BLOCK
    fixable: false
    category: cost

  rule_002:
    title: "Resource Usage Must Be Observable"
    description: "Infrastructure cost and resource consumption must be monitored."
    severity: INFO
    fixable: false
    category: cost

performance:
  rule_001:
    title: "Lightweight Dependencies"
    description: "Unnecessary heavy libraries are prohibited; impact on bundle size must be justified."
    severity: WARN
    fixable: false
    category: perf

  rule_002:
    title: "Bundle/Memory Limits"
    description: "Browser console errors and memory leaks must be prevented."
    severity: WARN
    fixable: false
    category: perf

customer_ux:
  rule_001:
    title: "Zero / Near-Zero Complexity"
    description: "User workflows must be single-click or near-single-click execution."
    severity: INFO
    fixable: false
    category: ux

  rule_002:
    title: "Progressive Disclosure"
    description: "Advanced options must be hidden by default; discovery is intentional."
    severity: INFO
    fixable: false
    category: ux

  rule_003:
    title: "Technical Infrastructure Hidden by Default"
    description: "MCP, APIs, integrations must be transparent to end users."
    severity: INFO
    fixable: false
    category: ux

# ============================================================================
# AGENTS.md v2 — Machine-Readable Governance Registry (Issue #2251, Phase 5)
# ============================================================================
# This section is the single source of truth for:
#   1. AGENTS.md generation  -> scripts/ci/generate_agents_md.py (CI drift-checked)
#   2. Automated System Gates -> .github/scripts/constitution/gates.py
#
# Edit rules HERE. Never edit generated AGENTS.md by hand.
# Rule IDs below the tree are immutable; severities change only with
# explicit governance approval (see header note above).

constitution:
  name: "SupremeAI — AGENTS.md v2 (Universal Operating Constitution & Agent Bootstrap)"
  rules_version: "2.2"
  model: "kite-and-spool"
  philosophy_quote: "যতই ঘুড়ি উড়াও রাতে, নাটাই তো আমার হাতে।"
  philosophy_line: "Agent-কে ঘুড়ির মতো স্বাধীনভাবে উড়তে দাও; কিন্তু নাটাই সবসময় SupremeAI Admin / Control Plane-এর হাতে থাকবে।"

living_protocols:
  slot_isolation:
    title: "1. Dynamic Slot & Branch-as-Lease"
    rule: "১ এজেন্ট = ১ স্লট (acquire_role_slot.py)। দূরবর্তী বা লোকাল ব্রাঞ্চের প্রথম ফাঁকা স্লট (gap) বরাদ্দ হবে (১–৯ ব্যস্ত থাকলে ১০; মাঝের কোনো স্লট খালি হলে সেই গ্যাপ স্লট)। ব্রাঞ্চ নাম: `<lane>-<N>-<issue#>-<slug>`। PR মার্জ বা ক্লোজ হলে ব্রাঞ্চ স্বয়ংক্রিয়ভাবে মুছে যাবে (ব্রাঞ্চ নেই মানে স্লটের কাজ সম্পন্ন ও স্লট মুক্ত)। অন্যের স্লট বা ব্রাঞ্চে হাত দেওয়া বা push করা সম্পূর্ণ নিষিদ্ধ।"
  atomic_claim:
    title: "2. Atomic Claim Lock & File Declaration"
    rule: "গ্রুপ সিকোয়েন্সের (GSPQ) প্রথম আনক্লেইমড ইস্যুটি ক্লেইম করো (`atomic_claim.sh`)। ক্লেইম কমেন্টে 'Touching files: file1, file2' ঘোষণা করো। নো ক্লেইম, নো কোড।"
  verify_first:
    title: "3. Verify First (3-Tier Verification)"
    rule: "অনুমানে ফাইল ডিলিট বা এডিট নিষিদ্ধ। পরিবর্তনের আগে ও পরে ৩ স্তর যাচাই আবশ্যক: (১) Reflection check (grep), (২) Boot smoke test (python -c 'import main'), (৩) Pytest। টেস্ট ম্যানিপুলেশন (delete/skip/fake assertion) কঠোরভাবে নিষিদ্ধ।"
  atomic_blast:
    title: "4. Atomic Blast Radius"
    rule: "১ Issue = ১ Branch = ১ PR (সর্বোচ্চ ১–২ ফাইল)। ক্লেইম করা স্কোপের বাইরে ড্রাইভ-বাই রিফ্যাক্টরিং নিষিদ্ধ।"
  has_pr_mandate:
    title: "5. Mandatory 'has-pr' Label"
    rule: "PR খোলার সাথে সাথেই gh issue edit <id> --add-label 'has-pr' চালাতে হবে। এটি ডুপ্লিকেট PR তৈরি হওয়া রুট থেকে বন্ধ করে।"
  dual_state_loop:
    title: "6. The Dual-State Loop (Solver → Peer Reviewer)"
    rule: "কখনো অলস বসে থাকা যাবে না। অ্যাক্টিভ গ্রুপে আনক্লেইমড ইস্যু থাকলে সলভার মোড (State A); সব কাজ ক্লেইমড থাকলে ওপেন PR-এর টেস্ট ও পিয়ার রিভিউ মোড (State B)। **State B:** `gh pr list --state open` দিয়ে open PR দেখো → 4-Pillar Rubric মেনে পরীক্ষা করো → `gh pr review <PR#> --comment -b '<findings>'`।"
  sequential_hold:
    title: "7. Sequential Hold (GSPQ Break Protection)"
    rule: "PR তৈরির পর: `gh issue view <prev-seq-issue#> --json state -q .state` দিয়ে predecessor seq merge নিশ্চিত করো। `OPEN` ফেরত পেলে → `gh pr edit <PR#> --add-label 'queue:hold'` + comment কারণ। Predecessor merged হলে label সরিয়ে queue unlock করো।"
  control_tower_heartbeat:
    title: "8. Control Plane Handshake & Heartbeat (নাটাই প্রোটোকল)"
    rule: "নাটাই ছাড়া ঘুড়ি ওড়া নিষিদ্ধ। সেশনে কাজ শুরুর আগে এজেন্ট Control Tower-এ (mcp.json) সংযুক্ত হয়ে হার্টবিট পাঠাবে (`python scripts/agents/mcp_tower_client.py heartbeat --slot agent-<N> --name <id>` বা MCP `agent_heartbeat` টুল)। হার্টবিট না থাকলে কন্ট্রোল প্লেন জানবে না কে জীবিত আর কে ক্র্যাশড, স্লট লিজ ড্রপ হবে এবং কেন্দ্রীয় কিল-সুইচ কাজ করবে না।"

bootstrap:
  - step: "git fetch origin --prune && cat AGENTS.md"
    note: "সেশন শুরুতে সর্বদা main sync ও AGENTS.md পড়ো — rules পরিবর্তন হয়েছে কিনা দেখো"
  - step: "python scripts/agents/acquire_role_slot.py --role <lane>"
    note: "অটো-ডিসকভারি: পরবর্তী প্রায়োরিটি ইস্যু (P0 → group seq) নিজে খুঁজে স্লট ও ব্রাঞ্চ তৈরি করে। নির্দিষ্ট ইস্যুর জন্য: --issue <id>"
  - step: "./scripts/ci/atomic_claim.sh <issue#> <agent>"
    note: "ইস্যু ক্লেইম ও 'Touching files:' ঘোষণা করো (GH_TOKEN অটো-fallback: gh auth login)"
  - step: "python scripts/agents/mcp_tower_client.py heartbeat --slot agent-<N> --name <id>"
    note: "নাটাই হ্যান্ডশেক: Control Tower-এ হার্টবিট পাঠিয়ে নিজেকে 'state=online' রেজিস্টার করো"
  - step: "3-Tier Verification (Reflection → Boot Smoke → Pytest)"
    note: "কোনো টেস্ট ভাঙা বা ডিলিট করা নিষিদ্ধ"
  - step: "gh pr create ... && gh issue edit <issue#> --add-label 'has-pr'"
    note: "[Coder/CI/Platform only — Planner PR নিষিদ্ধ] PR খুলে অবিলম্বে has-pr লেবেল দাও"
  - step: "Sequential hold check: gh issue view <prev-seq-issue> --json state"
    note: "পূর্ববর্তী seq মার্জ না হলে → gh pr edit <PR#> --add-label queue:hold + comment কারণ"

# Automated System Gates — system enforcement (Rule 22, #2251).
# wired=true  → an active CI job BLOCKS on violation today.
# wired=false → registered contract; enforcement lands in a follow-up issue.
gates:
  lease_gate:
    title: "Lease Gate"
    blocks_when: "PR head branch লেখকের leased slot-এর বাইরে (bot slot-mismatch), বা mesh lease মেয়াদ শেষ"
    wired: true
    workflow: "system-gates.yml"
  verification_gate:
    title: "Verification Gate"
    blocks_when: "PR description-এ Test Evidence সেকশন নেই (টেস্ট লগ/কমান্ড আউটপুট ছাড়া PR BLOCK)"
    wired: true
    workflow: "system-gates.yml"
  scope_gate:
    title: "Scope Gate"
    blocks_when: "claim-এ declare করা 'Touching files:'-এর বাইরের ফাইল PR-এ বদলালে BLOCK"
    wired: true
    workflow: "system-gates.yml"
  collision_gate:
    title: "Collision Gate"
    blocks_when: "অন্য open PR-এর ফাইলের সাথে direct overlap হলে BLOCK"
    wired: true
    workflow: "pr-gate.yml (check-collisions, strict mode #2002)"
  self_merge_gate:
    title: "Self-Merge Gate"
    blocks_when: "নিজের PR নিজে approve/merge করলে BLOCK"
    wired: false
    enforced_by: "branch protection + pr-helper review (follow-up issue)"
  test_guard_gate:
    title: "Test Guard"
    blocks_when: "test delete/skip/threshold-নামানো হলে BLOCK"
    wired: false
    enforced_by: "constitution audit engine extension (follow-up issue)"
  post_merge_watch:
    title: "Post-Merge Watch"
    blocks_when: "merge-এর ১৫ মিনিটের মধ্যে main লাল হলে auto-revert"
    wired: false
    enforced_by: "merge-train land job (follow-up issue)"

review_protocol:
  rubric:
    - pillar: "1. System Stability"
      check: "সিস্টেম বা আর্কিটেকচারে কোনো ব্রেকিং পরিবর্তন বা অঘোষিত সাইড-ইফেক্ট আছে কি না?"
    - pillar: "2. Real Benefit"
      check: "বাস্তব উন্নতি হয়েছে কি না? (LOC হ্রাস / ডেড-কোড ছাঁটাই / বাগ ফিক্স / নির্ভরযোগ্যতা বৃদ্ধি)"
    - pillar: "3. Zero Regression"
      check: "সব টেস্ট সফল কি না? কোনো টেস্ট ডিলিট, স্কিপ বা ফেইক অ্যাসারশন করা হয়নি তো?"
    - pillar: "4. Scope Narrowness"
      check: "ঘোষিত ফাইলের বাইরে ড্রাইভ-বাই রিফ্যাক্টরিং বা অনাকাঙ্ক্ষিত কোড ঢুকেছে কি না?"

# The 3 hard rules that remain agent-facing (everything else is system's burden).
hard_rules:
  honesty: "সততা ও নির্ভরযোগ্যতা: কোড ও টেস্ট ১০০% খাঁটি হতে হবে; টেস্ট ম্যানিপুলেশন (delete/skip/fake assertion) সর্বোচ্চ অপরাধ।"
  atomicity: "পরমাণু স্কোপ: এক PR এক উদ্দেশ্য (১ Issue = ১ Branch = ১ PR, সর্বোচ্চ ১-২ ফাইল)।"
  continuity: "অবিরাম সক্রিয়তা: সলভার বা পিয়ার রিভিউয়ার মোডে কাজ করো, কখনো অলস বসে থাকবে না।"

freedoms:
  - "সমাধানের বাস্তবসম্মত অ্যাপ্রোচ ও ডিজাইন প্যাটার্ন নিজে বেছে নাও।"
  - "সক্রিয় গ্রুপ সিকোয়েন্সের পরবর্তী উন্মুক্ত ইস্যুটি গ্রহণ করো।"
  - "কোনো ব্লকার পেলে তাৎক্ষণিক ব্লকার ইস্যু তৈরি করে পরবর্তী আনক্লেইমড কাজে এগিয়ে যাও।"

# Scope Gate policy (parsed by gates.py — do not rename keys).
scope_policy:
  declaration_marker: "Touching files:"
  undeclared_files: block        # block | warn
  missing_declaration: block     # claim ছাড়া code = Rule 2 লঙ্ঘন
  advisory_authors: [OWNER, MEMBER, COLLABORATOR]   # human maintainers get warn-only
  # Mechanical regen artifacts every PR may carry without declaration:
  allowlist:
    - "docs/generated/**"
    - "backend/openapi.json"
    - "**/package-lock.json"
    - "**/bun.lock"
    - "**/bun.lockb"
    - "**/uv.lock"
    - "**/*.sarif"
    - "ci-reports/**"

# Verification Gate policy.
verification_policy:
  min_evidence_chars: 40
  section_names: ["Test Evidence", "Tests", "পরীক্ষা", "টেস্ট এভিডেন্স"]
  output_markers:
    ["passed", "PASSED", "ok.", "OK (", " All tests passed", "✓", "✔", "pytest", "vitest", "unittest", "bun test"]

# Lease Gate policy.
lease_policy:
  bot_author_regex: '^supremeai-([a-z0-9]+)-([0-9]+)-bot(\[bot\])?$'
  bot_branch_regex: '^([a-z0-9]+)-([0-9]+)([-_.].+)?$'
  exempt_authors: ["dependabot[bot]", "github-actions[bot]", "renovate[bot]"]
  docs_branch_prefix: "docs/"
  mesh_advisory_env: "SUPREME_MESH_URL"

# Governance archive (Phase 5 — prose rule systems absorbed into this registry).
archive:
  batch: "docs/archive/agent-rule-systems-2026-09"
  absorbed:
    - path: ".clinerules"
      reason: "Legacy IDE prompt system — speckit workflow copies duplicate .specify/; master_prompt prose superseded by this registry"
    - path: ".lingma"
      reason: "Legacy IDE rule dir — single agents.md duplicate of AGENTS.md"
    - path: ".agents/rules"
      reason: "Legacy agent rule prose — superseded by gates above + AGENTS.md v2"
