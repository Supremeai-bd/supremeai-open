[tool.poetry]
name = "supremeai-backend"
version = "2.0.0"
description = "SupremeAI 2.0 Backend - Autonomous AI Agent Platform"
authors = ["SupremeAI Team <dev@supremeai.dev>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
# বাংলা মন্তব্য (AUDIT-014): "ecdsa" প্যাকেজে known CVE ছিল (Minerva timing side-channel)
# কিন্তু এটি আগেই python-jose -> ecdsa এর transitive dependency ছিল,
# যা আমরা PyJWT-এ মাইগ্রেট করেছি (pyjwt[crypto] -> cryptography)।
# এখন আর ecdsa প্যাকেজ নেই — ঝুঁকি মুক্ত।
fastapi = "^0.136.0"
# বাংলা মন্তব্য (DEP-AUDIT): `fastapi[all]` → `fastapi` (bare)। `[all]` extras-এর
# শুধু httpx সত্যিই কোডে ব্যবহৃত হয় (httpx এখানে explicit রাখা হলো); itsdangerous,
# jinja2, uvicorn[standard] duplicates আসলে অপ্রয়োজনীয়। python-multipart ও
# email-validator আগেই explicit declared। core image-এ মৃত transitive deps আর নেই।
httpx = "^0.28.1"
# বাংলা মন্তব্য (M08 P-C, issue #453): DDGS web-search provider-এর প্যাকেজ-সত্য —
# core/search.py আগে graceful-None fallback দিত (প্যাকেজ অনুপস্থিতি নিশ্চিত ছিল —
# lock/image-তে ছিলই না), ফলে provider-1 পথ মৃত ছিল। এখন স্পষ্ট-ঘোষিত ও
# শূন্য-খরচ (DuckDuckGo, কোনো API key নেই)।
ddgs = "^9.16.0"
uvicorn = {extras = ["standard"], version = "^0.51.0"}
starlette-context = "^0.3"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.14.2"  # CVE fix floor (AUDIT-014, GHSA-4xgf-cpjx-pc3j)
loguru = "^0.7.3"
psutil = "^6.1.0"
prometheus-client = "^0.26.0"
redis = {extras = ["hiredis"], version = "^5.2.0"}
python-multipart = "^0.0.32"
pyjwt = {extras = ["crypto"], version = "^2.10.1"}
python-dotenv = "^1.2.2"  # CVE fix floor (AUDIT-014)
# FIX(F-prod-yaml): agents/syncguard/syncguard_agent.py does `import yaml` but
# pyyaml was never declared — it only resolved transitively via litellm/mcp
# extras. If that chain drops PyYAML, api.routes.syncguard silently unmounts
# at startup (optional router) and the syncguard API surface 404s in prod.
pyyaml = "^6.0"
uuid6 = "^2025.0.1"
boto3 = "^1.41.5"
defusedxml = "^0.7.1"
beautifulsoup4 = "^4.15.0"
docker = "^7.1.0"
posthog = "^7.29.0"
mcp = "^1.28.1"
stripe = "^15.3.1"
neo4j = "^6.2.0"
aiohttp = "^3.14.3"  # CVE fix floor (AUDIT-014, CVE-2026-69244)
pygithub = "^2.5.0"
supabase = "^2.11.0"
firebase-admin = "^6.5.0"
qdrant-client = "^1.12.1"

pillow = "^12.3.0"  # CVE fix floor (AUDIT-014)
# বাংলা মন্তব্য (M0-A / AUDIT F1): openpyxl প্রোডাকশন কোডে সরাসরি ব্যবহৃত
# (tools/localization/bengali_ocr_converter.py, tools/localization/local_ocr_extractor.py)
# কিন্তু pyproject-এ ঘোষিত ছিল না — ফলে fresh install-এ tools OCR suite 8/8 fail করত।
openpyxl = "^3.1.5"
cryptography = "^50.0.0"  # CVE fix floor (AUDIT-014, CVE-2026-69247, CVE-2026-69249)
pybreaker = "^1.4.1"
cachetools = ">=5.0.0"  # Required for per-user TTLCache in rate_limit.py, free_tier_tracker.py, token_budget.py
email-validator = "^2.2.0"
asyncpg = "^0.30.0"
aiosqlite = "^0.20.0"
google-cloud-firestore = "^2.19.0"
google-cloud-storage = "^2.18.2"
google-auth = "^2.36.0"
# CI FIX (P1-1): Removed google-auth-httplib2 — it was declared but NEVER
# imported anywhere in the codebase. It pulls in httplib2 which has known
# CVEs. The codebase uses google.oauth2.service_account (from google-auth)
# directly, not httplib2's transport.
# google-auth-httplib2 = "^0.2.1"  # REMOVED — dead dependency
pyasn1 = "^0.6.4"  # transitive via google-auth; explicit floor for CVE fix (AUDIT-014)
openai = ">=1.54.0"
anthropic = "^0.120.0"
# বাংলা মন্তব্য: litellm ১.৮৪+ ভার্সন থেকে প্রতিটা release-এ python upper-bound cap
# যোগ হয়েছে (<3.14, <3.15 ইত্যাদি, ভার্সনভেদে ভিন্ন), যেখানে এই প্রজেক্টের
# python = "^3.11" মানে ">=3.11,<4.0" — একটা খোলা upper bound যেটা litellm-এর
# কোনো single version কখনোই পুরোপুরি cover করতে পারবে না (poetry lock তাই
# SolverProblemError দেয়)। CI বাস্তবে শুধু Python 3.11-এ চলে (workflows-এর
# PYTHON_VERSION: '3.11'), তাই global python constraint না বদলে শুধু litellm-এর
# জন্য একটা bounded python marker যোগ করা হলো — poetry নিজেই এই সমাধান suggest
# করেছিল ("set the python property")।
litellm = {version = ">=1.84.0,<2.0.0", python = ">=3.11,<3.14"}  # CVE fix floor (AUDIT-014)
sse-starlette = "^2.1.3"

opentelemetry-sdk = "^1.44.0"
opentelemetry-api = "^1.44.0"
opentelemetry-instrumentation-fastapi = "^0.65b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.44.0"
# বাংলা মন্তব্য (FINAL-TEST FIX): main.py ও core/app_builder.py এ `import sentry_sdk`
# করে (settings.sentry_dsn সেট থাকলে), কিন্তু sentry-sdk কখনো ডিরেক্ট ডিপেন্ডেন্সি
# হিসেবে ঘোষণা করা হয়নি — ফলে production-এ error tracking নিঃশব্দে অফ ছিল
# (ImportError গুটিয়ে ফেলা হচ্ছিল)। এখন explicit ডিপেন্ডেন্সি।
sentry-sdk = {extras = ["fastapi"], version = "^2.21.0"}

# বাংলা মন্তব্য: torch/sentence-transformers আগে মূল [tool.poetry.dependencies]-এ ছিল,
# ফলে CI-এর backend-core জব `poetry install --with dev` চালালেই torch-এর সাথে
# nvidia-nccl-cu12 *এবং* cu13 দুটো ভিন্ন CUDA স্ট্যাক ডাউনলোড হয়ে যেত -- CPU-only
# GitHub-hosted রানারে সম্পূর্ণ অপ্রয়োজনীয়, এবং এটাই ডিস্ক ফুরিয়ে দিয়ে
# `poetry install`/audit-sandbox ফেইল করাচ্ছিল (Zero-Operating-Cost নীতির বিপরীত)।
# grep দিয়ে যাচাই করা হয়েছে: torch-নির্ভর evolution/* মডিউলগুলো কোথাও import করা হয় না
# (dead/scaffold code, memory-note অনুযায়ী), আর sentence-transformers-এর ৪টা caller
# (experience_db.py, memory_service.py, knowledge_extractor.py, error_remediation.py)
# আগে থেকেই try/except ImportError দিয়ে গ্রেসফুলি ফলব্যাক করে -- তাই এই গ্রুপ বাদ
# দিলে backend-core-এর কোনো টেস্ট ভাঙে না।
# পরবর্তী ধাপ (এই sandbox-এ download.pytorch.org অ্যাক্সেস না থাকায় এখানে verify করা
# যায়নি বলে এখনই যোগ করা হয়নি): কেউ সত্যিকার এই গ্রুপ ইনস্টল করলে যেন GPU wheel না
# নামে, তার জন্য torch-কে explicit `https://download.pytorch.org/whl/cpu` source-এ
# পিন করে `poetry lock` রিজেনারেট করা।
pydantic-ai = "^2.31.0"
langfuse = "^4.14.4"
packaging = "^26.3"
bcrypt = "^5.0.0"
# বাংলা মন্তব্য (DEP-AUDIT): playwright core [tool.poetry.dependencies] থেকে
# সরিয়ে আলাদা optional `browser` group-এ রাখা হলো। Production Dockerfile
# `poetry install --only main` চালায়, তাই Chromium + playwright এখন আর always-on
# API image-এ নেই। Dev/CI-তে আগের মতোই playwright থাকবে (`--with dev --with browser`)।
infisical-python = "2.3.5"
click = ">=8.3.3" # CVE-2026-7246 (PYSEC-2026-2132)
h2 = ">=4.4.1" # CVE-2026-71554 (PYSEC-2026-3628)
[tool.poetry.group.browser]
optional = true

[tool.poetry.group.browser.dependencies]
playwright = "^1.62.0"

# Issue #543 (BE-11): psycopg2-binary was a core dependency but is unused on
# the FastAPI/worker runtime path (runtime driver is asyncpg, core/db.py).
# Only backend/tools/mcp/mcp_supabase.py, mcp_neon.py and
# scripts/migrate_files_to_db.py hard-import it; runtime-adjacent callers
# (core/persistence/pooled_pg.py, database/supabase_client.py) use safe
# imports with graceful fallback. Moved to this optional group so the prod
# image (`poetry install --only main`) no longer ships ~5MB + libpq.
# Install where needed with: poetry install --with mcp-tools
[tool.poetry.group.mcp-tools]
optional = true

[tool.poetry.group.mcp-tools.dependencies]
psycopg2-binary = "^2.9.9"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
torch = "^2.5.0"
sentence-transformers = "^3.3.0"
# Heavy ML dependencies moved here to keep core image size small
numpy = ">=1.26.4"
opencv-python-headless = "^4.10.0"
pandas = "^2.2.3"
plotly = "^5.24.1"
scipy = "^1.14.1"

[tool.poetry.group.dev.dependencies]
# বাংলা মন্তব্য: pre-commit ও CI শুধুমাত্র ruff (linter + formatter) এবং mypy চালায় --
# black/isort এখানে ছিল কিন্তু কোথাও invoke হতো না (dead dev dependency), সরানো হলো।
ruff = "0.16.4"
mypy = "^1.11"
pytest = "^8.0"
pytest-asyncio = ">=0.23,<1.5"
pytest-cov = ">=5,<8"
pytest-mock = "^3.14.0"
pytest-timeout = "^2.3.0"
pytest-xdist = "^3.6.1"
respx = "^0.21.1"
# বাংলা মন্তব্য (M0-A / AUDIT F2): tests/models/test_ai_memory_schema_contract.py
# sqlglot ব্যবহার করে (SQL পার্স/ভ্যালিডেশন), কিন্তু dev-dependency হিসেবে ঘোষণা
# ছিল না — ফলে tests/models collection error হতো।
sqlglot = "^27.0.0"
pytest-md = "^0.2.0"
typeguard = "^4.2"
pytest-html = "^4.1.1"
# Issue #895: /export slash command tests (test_slash_commands_full.py
# TestExportCommand::test_pdf_export, test_docx_export) require real PDF/DOCX
# binaries — reportlab generates a proper PDF (starts with %PDF magic), and
# python-docx generates a real .docx (PK zip container). Both were implicit
# dev dependencies (used by api/routes/slash_commands.py and chat_export.py)
# but not declared — CI failed with "PDF export requires reportlab".
reportlab = "^4.4"
python-docx = "^1.1"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
# বাংলা: আগে শুধু core/ এর coverage মাপা হতো — api/, tools/, ws/, workers/ ব্লাইন্ড স্পট
# ছিল। এখন সব প্রডাকশন প্যাকেজ একসাথে মাপা হয় যাতে রিপোর্ট সত্যিকারের কভারেজ দেখায়।
# CI এর সাথে consistent। পুরো backend/ স্ক্যান করলে pytest ধীর হয়, তাই শুধু
# প্রডাকশন প্যাকেজগুলো source হিসেবে রাখা হলো।
source = ["core", "api", "tools", "ws", "workers"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    ".venv/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/__init__.py",
    "tools/cli.py",
    "core/worker_main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 80

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
# বাংলা মন্তব্য: লোকাল রানে coverage threshold-এর কারণে টেস্ট "পাস" সত্ত্বেও ফেইল করার ঝুঁকি
# এড়াতে --cov-fail-under সরানো হলো; CI নিজেই threshold এনফোর্স করে (supreme-core-ci.yml)।
addopts = "-ra -v --tb=short --strict-markers --strict-config --import-mode=importlib --cov=core --cov-report=term-missing --cov-report=html --cov-report=xml"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "critical: fast, merge-blocking tests for core production paths",
    "important: important backend regression tests for normal PR validation",
    "overall: full backend test-suite classification marker",
    "hitl: marks tests that require human in the loop",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "chaos: marks tests requiring chaos engine",
    "requires_network: marks tests requiring network",
    "requires_redis: marks tests requiring redis",
    "e2e: marks tests as end-to-end tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests"
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"
# CI SPEED FIX: 312 test files were taking 30+ minutes. Key optimizations:
# 1. Per-test timeout (30s) — kills hanging tests instead of blocking forever
# 2. Timeout method=thread — works with both sync and async tests
timeout = 30
timeout_method = "thread"
# বাংলা মন্তব্য: conftest.py-র deprecated custom `event_loop` fixture সরানোর
# পর pytest-asyncio (0.23.8 pinned) নিজেই প্রতি-টেস্ট loop স্কোপ নিয়ন্ত্রণ করে;
# `asyncio_default_fixture_loop_scope` অপশনটা এই ভার্সনে সাপোর্টেড না (0.24+ এ
# আসে), তাই যোগ করা হয়নি — ফাংশন-স্কোপ ডিফল্টই এখানে ঠিক আছে, কারণ db_engine
# session fixture সরাসরি asyncio.run() ব্যবহার করে, কোনো test loop-এর উপর
# নির্ভর করে না।


[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = [
    "pydantic.mypy"
]




[tool.vulture]
ignore_names = ["test_*", "*Test*", "mock_*", "fixture_*"]
ignore_decorators = ["@app.*", "@router.*", "@pytest.fixture"]
min_confidence = 90
paths = ["core", "api", "services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top (intentional sys.path setup in many modules)
    "B008",   # Function call in default arg (FastAPI Depends()/Query() idiom)
    "B904",   # raise-from-err inside except (large surface, tracked separately)
    "N803",   # Argument name casing (external API/schema compatibility)
    "N806",   # Variable name casing (external API/schema compatibility)
    "N815",   # Mixed-case class attribute (Pydantic/JSON schema compatibility)
    "N818",   # Exception name should end in Error (legacy naming, tracked separately)
    "SIM102", # Nested if (style suggestion, not a bug)
    "SIM105", # contextlib.suppress suggestion (style, not a bug)
    "SIM108", # Ternary suggestion (style, not a bug)
    "SIM117", # Nested with statements (style, not a bug)
    "SIM112", # Uppercase env var suggestion (style, not a bug)
    "SIM116", # If-elif chain to dict suggestion (style, not a bug)
    "E741",   # Ambiguous variable name (style, not a bug)
    "B017",   # assertRaises(Exception) in tests (acceptable in this suite)
    "B007",   # Unused loop variable (style, not a bug)
    "N802",   # Function name casing (external API/schema compatibility)
    "N811", "N812", "N813", "N817",  # Import aliasing casing (external API idioms, e.g. ET/jwt-style)
    "F811",   # Redefinition (a few intentional re-exports/overloads)
    "F401",   # Unused import (mostly try/except optional-dependency availability checks)
    "W291", "W293",  # Trailing whitespace (cosmetic, formatter handles new code)
    "SIM103", "SIM109", "SIM110", "SIM222", "SIM401",  # Style/readability suggestions, not bugs
    "B028",   # Missing stacklevel in warnings.warn (low-impact, tracked separately)
]

[tool.ruff.lint.per-file-ignores]
# Ignore isort (I001) for Alembic migrations due to Windows vs Linux sys.path resolution discrepancy causing CI flip-flops
"alembic_migrations/**/*.py" = ["I001"]
