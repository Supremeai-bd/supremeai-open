# Bengali LoRA Fine-Tuning Recipe for SupremeAI 2.0
# Target Model: Qwen/Qwen2.5-7B-Instruct / Llama-3.1-8B-Instruct
# Optimized for zero-cost free tier GPU nodes (Kaggle / Colab T4 / HF Spaces)

model_name_or_path: "Qwen/Qwen2.5-7B-Instruct"
dataset_name: "bengali-ai/bengali_instruction_tuning_v1"
dataset_config_name: "default"
output_dir: "./adapters/bengali_lora_v1"

# LoRA Configuration (PEFT)
lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# Quantization (bitsandbytes 4-bit NF4)
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

# Training Parameters
training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 3
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  fp16: false
  bf16: true
  optim: "paged_adamw_8bit"
  max_grad_norm: 0.3
