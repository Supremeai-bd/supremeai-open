# ============================================================================
# Service Topology Registry — Declarative Deploy SSOT (#4246 Phase 1)
# ============================================================================
# ফাউন্ডার নির্দেশনা (#4246): "আমি MCP tower বা core tower চিনি না। সিস্টেম
# এমন হতে হবে যেন ভবিষ্যতে আরও ১০০টি টাওয়ার বা সার্ভিস যুক্ত হলেও সিস্টেম
# নিজেই জানবে তার কী করা উচিত।"
#
# এই রেজিস্ট্রিই এখন deploy-target detection-এর একমাত্র উৎস (SSOT) —
# scripts/ci/detect_deploy_targets.py কোনো if/elif হার্ডকোড ছাড়া এখান থেকে
# glob-ম্যাচ করে প্রতি-সার্ভিস সিদ্ধান্ত নেয়। নতুন সার্ভিস/টাওয়ার যোগ করতে
# Python কোডে এক লাইনও বদলাতে হয় না — এখানে ব্লক যোগ করলেই হলো।
#
# চুক্তি (tests/test_service_topology_contract.py + test_detect_deploy_targets_2901.py):
#   - watch_paths: fnmatch গ্লোব (path-aware নয় — `**` স্ল্যাশ-পার করে), যেকোনো
#     মিল = সেই সার্ভিস deploy করা হবে (এক পাথ একাধিক সার্ভিস ট্রিগার করতে পারে)
#   - exclude_paths: প্রথমে বাদ — mcp-control-plane cloudflare-কে ট্রিগার করে না
#   - platform: render|cloudflare|vercel|firebase|none (deploy-train স্টেশন-নামের
#     সাথে সংগতি — contract-test যাচাই করে)
#   - manual_only: true = কখনো পাথ-ডিটেকশন থেকে ট্রিগার হয় না (scraper — backend-
#     গাছেই কোড, পাথ-বিয়োজন অসম্ভব; #2901 সিদ্ধান্ত অপরিবর্তিত)
#   - deploy_key: GITHUB_OUTPUT কী (deploy-<key>) — স্ক্রিপ্টের SERVICE_KEYS-এর
#     সাথে অক্ষরে-অক্ষরে মিলবে (contract-test প্রমাণ করে)
#   - unknown_policy: অজানা পাথ = conservative core+worker (fail-open — স্টেল
#     প্রোডের ঝুঁকি অপচয়ের চেয়ে বড়; #2901 মতবাদ অপরিবর্তিত)
# ============================================================================
unknown_policy: conservative-backend

noise:
  # নয়েজ-পাথ কোনো সার্ভিস ট্রিগার করে না (#2901 মতবাদ অপরিবর্তিত)
  exact: [LICENSE, CHANGELOG.md, CODEOWNERS]
  prefixes: [docs/, tests/, qa/, scripts/, .github/, data/, reports/, knowledge/, archives/, config/]
  suffixes: [".md"]

services:
  core:
    platform: render
    deploy_key: core
    watch_paths:
      - "backend/**"

  worker:
    platform: render
    deploy_key: worker
    watch_paths:
      - "backend/**"

  scraper:
    platform: render
    deploy_key: scraper
    manual_only: true          # #2901: কেবল স্পষ্ট/manual সিদ্ধান্তে
    watch_paths: []

  mcp:
    platform: render
    deploy_key: mcp
    watch_paths:
      - "backend/mcp_adapters/**"
      - "mcp.json"
      - "infrastructure/mcp-control-plane/**"   # #4246 live bug fix: আসল টাওয়ারের ঘর এখানেই

  cloudflare:
    platform: cloudflare
    deploy_key: cloudflare
    watch_paths:
      - "infrastructure/**"
    exclude_paths:
      - "infrastructure/mcp-control-plane/**"   # mcp-টাওয়ার পাথ cloudflare-কে আর ট্রিগার করবে না (#4246)

  frontend:
    platform: vercel
    deploy_key: frontend
    watch_paths:
      - "frontend/**"
      - "client/**"
      - "apps/**"

  firebase:
    platform: firebase
    deploy_key: firebase
    # বাংলা (#4269): পুরনো watch_paths অবাস্তব রুট-লেভেল পাথ ছিল (firestore.rules/
    # storage.rules রুটে নেই) — rules-পরিবর্তনে deploy-firebase কখনো ট্রিগারই হতো
    # না (নীরব স্টেল)। SSOT এখন firebase/ ডিরেক্টরিতে স্থানান্তরিত (config/ টপোলজি-
    # noise-prefix — detector watch-match এড়িয়ে যায়)।
    watch_paths:
      - "firebase/**"
      - "firebase.template.json"
      - ".firebaserc"
