name: "pyerrorfix — Auto-Fix Python Errors"
description: "Reusable, zero-dependency Python error detector & auto-fixer. Covers core Python, imports, files, asyncio, database/ORM, web/API, concurrency, typing, security, resources, deprecation & logging errors. Drops into any repo — works on untrusted user code."
author: "SupremeAI"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  path:
    description: "File or directory to scan. Default: repository root."
    required: false
    default: "."
  fix:
    description: "Apply auto-fixers in place (writes to disk)."
    required: false
    default: "true"
  format:
    description: "Output format: console | json | sarif | markdown."
    required: false
    default: "sarif"
  config:
    description: "Path to .pyerrorfix.json/.yaml config file."
    required: false
    default: ""
  fail-on-error:
    description: "Fail the workflow step when errors (not warnings) are found."
    required: false
    default: "true"
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.11"

outputs:
  report-path:
    description: "Path to the generated SARIF report (if format=sarif)."
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pyerrorfix
      shell: bash
      run: |
        pip install --quiet \
          "git+https://github.com/SaifulHaqueNiloy/supremeai.git@main#subdirectory=pyerrorfix" \
          || pip install --quiet pyerrorfix || true
        # Fallback: run from the repo-local copy (zero-dependency)
        python -c "import pyerrorfix" 2>/dev/null || {
          echo "pyerrorfix not on PyPI yet — using the bundled copy in ./pyerrorfix"
          test -f ./pyerrorfix/pyerrorfix/cli.py || {
            echo "::error::pyerrorfix package not found. Either publish it or vendor it into ./pyerrorfix"
            exit 1
          }
        }

    - name: Run pyerrorfix
      id: run
      shell: bash
      run: |
        set -euo pipefail
        ARGS=""
        if [ -n "${{ inputs.config }}" ]; then ARGS="$ARGS --config ${{ inputs.config }}"; fi
        if [ "${{ inputs.format }}" = "sarif" ]; then
          python -m pyerrorfix analyze "${{ inputs.path }}" --format sarif $ARGS > pyerrorfix-results.sarif || true
          echo "report-path=$(pwd)/pyerrorfix-results.sarif" >> "$GITHUB_OUTPUT"
          # also print a human-readable summary to the log
          python -m pyerrorfix analyze "${{ inputs.path }}" --format console $ARGS || true
        else
          python -m pyerrorfix analyze "${{ inputs.path }}" --format ${{ inputs.format }} $ARGS || true
        fi

    - name: Upload SARIF to GitHub code scanning
      if: ${{ inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: pyerrorfix-results.sarif
        category: pyerrorfix

    - name: Fail on errors
      if: ${{ inputs.fail-on-error == 'true' }}
      shell: bash
      run: |
        # Re-run silently to capture the exit code (1 = errors present)
        python -m pyerrorfix analyze "${{ inputs.path }}" --format json $ARGS > /tmp/pyerrorfix-result.json 2>/dev/null || true
        ERRORS=$(python -c "import json,sys; print(json.load(open('/tmp/pyerrorfix-result.json'))['summary']['errors'])" 2>/dev/null || echo 0)
        if [ "$ERRORS" -gt 0 ]; then
          echo "::error::pyerrorfix found $ERRORS error-level issue(s). See the SARIF report in the Security tab."
          exit 1
        fi
        echo "pyerrorfix: no error-level issues."
