# Canonical production schema contract.
#
# This file is the single source of truth for "what must exist in the real
# production database". It is checked by scripts/ci/check_database_schema.py
# against the live database (read-only) on every push to main and nightly.
#
# Levels:
#   required: true   -> CI job FAILS if missing (breaks the app if absent)
#   required: false  -> CI job WARNS only (known drift / legacy / not yet
#                        reconciled, tracked but not blocking)
#
# When you add/rename a column in an Alembic migration, update this file in
# the SAME PR. This is what keeps docs / code / DB / CI in sync going
# forward (see the 2026-08-30 production audit for what happens when they
# aren't: https://github.com/SaifulHaqueNiloy/supremeai -> commit 627bec68db).

tables:
  api_keys:
    required: true
    columns:
      id: {required: true}
      user_id: {required: true}
      name: {required: true}
      key_hash: {required: true}
      key_masked: {required: true}
      key_prefix: {required: true}
      scopes: {required: true}          # fixed 2026-08-30, was missing
      rate_limit_rps: {required: true}
      revoked: {required: true}
      expires_at: {required: true}
      created_at: {required: true}
      updated_at: {required: true}

  conversation_context:
    required: true
    columns:
      id: {required: true}
      session_id: {required: true}
      user_id: {required: true}
      messages: {required: true}
      summary: {required: true}
      created_at: {required: true}
      updated_at: {required: true}
    indexes:
      uq_conversation_context_session_id:
        required: true
        note: "UNIQUE(session_id) - code uses ON CONFLICT(session_id); fixed 2026-08-30"

  task_history:
    required: true
    columns:
      id: {required: true}
      result: {required: true}
      success: {required: true}
      created_at: {required: true}
      task_type: {required: true}   # fixed 2026-08-30, code writes here
      prompt: {required: true}      # fixed 2026-08-30, code writes here
      provider: {required: true}    # fixed 2026-08-30, code writes here
      cost: {required: true}        # fixed 2026-08-30, code writes here
      latency_ms: {required: true}  # fixed 2026-08-30, code writes here
      task: {required: false, note: "DEPRECATED legacy column, kept for historical data"}
      approach: {required: false, note: "DEPRECATED legacy column, kept for historical data"}

  verification_queue:
    required: true
    columns:
      id: {required: true}
      email_target: {required: true}
      otp_code: {required: true}
      verification_link: {required: true}
      processed: {required: true}
      received_at: {required: true}

  task_checkpoints:
    required: true
    columns:
      task_id: {required: true}
      step_index: {required: true}
      state: {required: true}
      created_at: {required: true}
      resumed: {required: true}
      step_log: {required: true}

  patch_telemetry:
    required: true
    columns:
      id: {required: true}
      error_id: {required: true}
      patch_id: {required: true}
      file_path: {required: true}
      status: {required: true}
      similarity_score: {required: true}
      created_at: {required: true}

  system_alerts:
    required: true
    columns:
      id: {required: true}
      level: {required: true}
      message: {required: true}
      resolved: {required: true}
      created_at: {required: true}

  ci_reports:
    required: true
    columns:
      id: {required: true}
      run_id: {required: true}
      status: {required: true}
      commit_sha: {required: true}
      branch: {required: true}
      created_at: {required: true}

  conversations:
    required: true
    columns:
      id: {required: true}
      user_id: {required: true}
      title: {required: true}
      created_at: {required: true}
      updated_at: {required: true}
      # Known drift vs. the original 001_initial_schema.sql design. Not yet
      # reconciled: current app code path does not depend on these columns
      # existing, so this is a WARNING (design divergence to review), not a
      # blocking error. Flip to required:true once a migration adds them
      # (or remove this block once we confirm the app no longer needs them).
      agent_id: {required: false, note: "present in original schema, absent in prod"}
      summary: {required: false, note: "present in original schema, absent in prod"}
      config: {required: false, note: "present in original schema, absent in prod"}
      status: {required: false, note: "present in original schema, absent in prod"}
      message_count: {required: false, note: "present in original schema, absent in prod"}
      token_count: {required: false, note: "present in original schema, absent in prod"}
      last_message_at: {required: false, note: "present in original schema, absent in prod"}

  messages:
    required: true
    columns:
      id: {required: true}
      conversation_id: {required: true}
      role: {required: true}
      content: {required: true}
      created_at: {required: true}
      token_count: {required: false, note: "present in original schema, absent in prod"}
      prompt_tokens: {required: false, note: "present in original schema, absent in prod"}
      completion_tokens: {required: false, note: "present in original schema, absent in prod"}
      metadata: {required: false, note: "present in original schema, absent in prod"}
      parent_message_id: {required: false, note: "present in original schema, absent in prod"}
      sequence_number: {required: false, note: "present in original schema, absent in prod"}

  render_account_states:
    required: false
    note: "added 2026-09-06 via 2026_09_06_120000_add_render_account_state"
    columns:
      id: {required: true}
      account_key: {required: true}
      role: {required: true}
      plan: {required: true}
      status: {required: true}
      reason: {required: false}
      usage_minutes: {required: false}
      usage_period_start: {required: false}
      recheck_at: {required: false}
      last_checked_at: {required: false}
      last_error: {required: false}
      retry_count: {required: true}
      metadata: {required: false}
      created_at: {required: true}
      updated_at: {required: true}

  render_preflight_events:
    required: false
    note: "added 2026-09-06 via 2026_09_06_120000_add_render_account_state"
    columns:
      id: {required: true}
      account_key: {required: true}
      status: {required: true}
      reason: {required: false}
      usage_minutes: {required: false}
      observed_at: {required: true}
      metadata: {required: false}

  # Tables referenced by the *original* 001_initial_schema.sql but not
  # present in the live, evolved production architecture. Tracked as
  # informational only (required: false at the table level) so CI doesn't
  # scream about an architecture that was intentionally superseded by
  # ai_memory / dynamic_agents / execution_logs etc. Remove this section
  # once 001_initial_schema.sql is formally retired/archived.
  users:
    required: false
    note: "superseded by current auth/user architecture; verify before deleting"
  agents:
    required: false
    note: "superseded by dynamic_agents"
  memory_vectors:
    required: false
    note: "superseded by ai_memory"
  tool_executions:
    required: false
    note: "superseded by execution_logs"
  hitl_approvals:
    required: false
    note: "not present in production; confirm still needed"
