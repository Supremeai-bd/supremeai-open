# ============================================================
# SupremeAI - OpenTelemetry Collector Configuration
# Production Observability Stack
# ============================================================

receivers:
  # ----------------------------------------------------------
  # OTLP Receiver for traces, metrics, and logs
  # ----------------------------------------------------------
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_message_size: 4194304  # 4MB
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

  # FIX(otel): the backend Prometheus scrape lives in the prometheus server
  # (job 'supremeai-backend' -> /api/admin/metrics with a bearer token).
  # The old receiver job here scraped backend:8000/metrics — a port and a
  # path that do not exist — producing permanent scrape errors and, worse,
  # it would double-scrape the backend even if fixed. Hostmetrics + OTLP
  # are the collector's real jobs.
  #
  # ----------------------------------------------------------
  # Host Metrics Receiver
  # ----------------------------------------------------------
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      load: {}
      network: {}

processors:
  # ----------------------------------------------------------
  # Batch processor for efficient data transmission
  # ----------------------------------------------------------
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # ----------------------------------------------------------
  # Memory limiter to prevent OOM
  # ----------------------------------------------------------
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  # ----------------------------------------------------------
  # Resource detection and enrichment
  # ----------------------------------------------------------
  resource:
    attributes:
      - key: service.name
        value: supremeai-backend
        action: upsert
      - key: service.version
        value: "1.0.0"
        action: upsert
      - key: deployment.environment
        value: production
        action: upsert

  # ----------------------------------------------------------
  # PII redaction — delete sensitive attributes from spans.
  # FIX(pii-inverted): the old filter/pii used `== nil` conditions, which
  # in the filter processor means "DROP spans matching this" — i.e. it
  # dropped exactly the CLEAN spans and let spans carrying the
  # authorization header or raw SQL pass straight through. We now delete
  # the sensitive attributes (keeping the spans observable) instead.
  # ----------------------------------------------------------
  attributes/pii:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete

exporters:
  # ----------------------------------------------------------
  # Prometheus Exporter for metrics
  # ----------------------------------------------------------
  prometheus:
    endpoint: "0.0.0.0:8888"
    namespace: supremeai

  # ----------------------------------------------------------
  # Jaeger Exporter for distributed tracing
  # INF-11 fix (issue #534): the target is the `jaeger` service added to
  # the observability profile in docker-compose.production.yml
  # (jaegertracing/all-in-one, COLLECTOR_OTLP_ENABLED=true). Previously no
  # jaeger service existed in the stack, so every trace batch was forwarded
  # to a DNS-unresolvable endpoint and zero traces reached any backend.
  # ----------------------------------------------------------
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # ----------------------------------------------------------
  # Debug Exporter (for development/debugging)
  # INF-11 fix (issue #534): renamed from `logging` — the logging exporter
  # was removed in otel-collector v0.86 and this stack runs 0.161.0, where
  # defining `logging:` fails config validation and crash-loops the
  # collector (taking the whole traces/metrics pipeline down with it).
  # ----------------------------------------------------------
  debug:
    verbosity: normal

extensions:
  # ----------------------------------------------------------
  # Health Check Extension
  # ----------------------------------------------------------
  health_check:
    endpoint: 0.0.0.0:13133

  # ----------------------------------------------------------
  # Pprof Extension for profiling
  # ----------------------------------------------------------
  pprof:
    endpoint: 0.0.0.0:1777

  # ----------------------------------------------------------
  # ZPages Extension for live debugging
  # ----------------------------------------------------------
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    # ----------------------------------------------------------
    # Traces Pipeline
    # ----------------------------------------------------------
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/pii, batch]
      exporters: [otlp/jaeger]

    # ----------------------------------------------------------
    # Metrics Pipeline
    # ----------------------------------------------------------
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

    # ----------------------------------------------------------
    # Logs Pipeline (if needed in future)
    # ----------------------------------------------------------
    # logs:
    #   receivers: [otlp]
    #   processors: [batch, memory_limiter]
    #   exporters: [debug]
