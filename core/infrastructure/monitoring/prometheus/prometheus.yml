# ============================================================
# SupremeAI - Prometheus Configuration
# Production-Ready Monitoring Setup
# ============================================================
# FIX(2026-09) — monitoring rewiring:
#   * backend scrape now targets the REAL Prometheus exposition
#     endpoint (GET /api/admin/metrics). The old path (/metrics)
#     does not exist on the backend, so zero metrics were ever
#     collected. The endpoint is admin-gated, so the scrape uses
#     a bearer token from a mounted secret file — see
#     secrets/README.md for provisioning.
#   * removed jobs scraping /api/v1/{agents,hitl,memory,llm}/metrics —
#     none of those routes exist in the backend; they only produced
#     permanent scrape errors.
#   * removed the invalid metric_relabel_configs (labeldrop with
#     source_labels/labels keys) that made prometheus fail config
#     validation and prevented startup entirely.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'supremeai-monitor'
    environment: 'production'

# Rule files for alerting rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations for all services
scrape_configs:
  # ----------------------------------------------------------
  # SupremeAI FastAPI Backend
  # Real Prometheus exposition: GET /api/admin/metrics
  # ----------------------------------------------------------
  - job_name: 'supremeai-backend'
    scrape_interval: 10s
    metrics_path: '/api/admin/metrics'
    scheme: http
    # The endpoint is mounted with get_current_user_token (admin-gated).
    # Provision a service/admin JWT into the mounted token file — the file
    # is read per scrape, so rotating it needs no prometheus restart.
    authorization:
      type: Bearer
      credentials_file: '/etc/prometheus/secrets/backend_metrics_token'
    static_configs:
      - targets: ['supremeai-backend:8080']
        labels:
          service: 'supremeai-backend'
          environment: 'production'
          team: 'ai-platform'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'supremeai-backend'
    # NOTE on cardinality: record_request() labels samples with the raw
    # request path ('endpoint'). The previous labeldrop block was invalid
    # config (crashed prometheus) and dropping 'endpoint' would blind the
    # dashboards. If cardinality becomes a problem, normalize paths to
    # route templates in api/routes/metrics.py:record_request() instead.

  # ----------------------------------------------------------
  # PostgreSQL Database Metrics (postgres_exporter)
  # Exporter added to the observability profile in
  # docker-compose.production.yml.
  # ----------------------------------------------------------
  - job_name: 'postgresql'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          environment: 'production'
    metric_relabel_configs:
      # Keep only essential database metrics
      - source_labels: [__name__]
        regex: 'pg_.*'
        action: keep

  # ----------------------------------------------------------
  # Redis Metrics (redis_exporter)
  # ----------------------------------------------------------
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          environment: 'production'

  # ----------------------------------------------------------
  # Node Exporter - System Metrics
  # ----------------------------------------------------------
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system-metrics'
          environment: 'production'

  # ----------------------------------------------------------
  # Docker Container Metrics (cAdvisor)
  # ----------------------------------------------------------
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'docker-containers'
          environment: 'production'

  # ----------------------------------------------------------
  # OpenTelemetry Collector (self-metrics)
  # ----------------------------------------------------------
  - job_name: 'opentelemetry-collector'
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'
          environment: 'production'
