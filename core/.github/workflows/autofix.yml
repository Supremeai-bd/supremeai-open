name: pyerrorfix — Auto-Fix Pipeline

# Drop-in replacement for the existing auto_fix.yml that only ran isort/black/ruff.
# This workflow runs the reusable pyerrorfix engine over the whole backend on
# every PR and nightly, auto-fixes safe issues, uploads SARIF to the Security
# tab, and opens a PR with the fixes.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    # Nightly at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  security-events: write   # required to upload SARIF

jobs:
  pyerrorfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run pyerrorfix (detect + auto-fix + SARIF)
        working-directory: ${{ github.workspace }}
        run: |
          # The pyerrorfix package is zero-dependency — just run it from source.
          python -m pyerrorfix analyze backend \
            --fix \
            --format sarif \
            > pyerrorfix-results.sarif || true

          # Human-readable summary in the job log
          python -m pyerrorfix analyze backend --format console --quiet || true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pyerrorfix-results.sarif
          category: pyerrorfix

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyerrorfix-report
          path: pyerrorfix-results.sarif

      - name: Open PR with auto-fixes
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(pyerrorfix): auto-fix Python errors [skip ci]"
          title: "🤖 pyerrorfix: auto-fix Python errors"
          branch: "chore/pyerrorfix-${{ github.run_id }}"
          base: ${{ github.head_ref || github.ref_name }}
          labels: "maintenance, automated, pyerrorfix"
          body: |
            ## 🤖 pyerrorfix auto-fix

            This PR was generated by the `pyerrorfix` reusable engine. It applied
            safe, idempotent fixes for the following rule categories:

            - `missing-await` — inserted `await` before coroutine calls
            - `broad-except` — bare `except:` → `except Exception:`
            - `fstring-in-logging` — eager f-string → lazy %-style logging
            - `unused-import` — removed unused imports
            - `pydantic-validation-gap` — `.dict()` → `.model_dump()` (Pydantic v2)

            All other detected issues (non-fixable) are visible in the **Security**
            tab under the `pyerrorfix` SARIF category.

            > Re-running this PR is safe — the fixers are idempotent.
