# ============================================================
# SupremeAI - Production Docker Compose Configuration
# Multi-service orchestration for production deployment
# ============================================================
#
# FRESH-HOST BOOTSTRAP (FIX(F-3)):
#   This file loads `env_file: .env.production` (backend + postgres) and
#   `env_file: .env.grafana` (grafana, observability profile). Neither file is
#   committed — create them from the committed templates first:
#     cp .env.production.example .env.production   # fill in real values
#     cp .env.grafana.example .env.grafana         # only for observability
#   Then deploy with the env file so compose-level interpolation resolves:
#     VERSION=<pinned tag> docker compose --env-file .env.production \
#       -f docker-compose.production.yml up -d


services:
  # ----------------------------------------------------------
  # SUPREMAI BACKEND (FastAPI)
  # ----------------------------------------------------------
  supremeai-backend:
    build:
      # AUD/0.5 fix: this file previously referenced context ../../ with a root
      # "Dockerfile" target=production — neither exists, so the build could
      # never succeed. The canonical backend image lives at backend/Dockerfile
      # (multi-stage, runtime stage = what production runs).
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    # R-04 pinning rule: mutable `latest` is not reproducible and cannot be
    # rolled back to a known-good image. Unlike the dev compose (local builds
    # with a `dev` lineage tag), this file RUNS prebuilt images — so VERSION is
    # REQUIRED here, in the same fail-fast style as the exporter services below
    # (e.g. ${POSTGRES_PASSWORD:?...}). Deploy with an explicit pinned tag:
    #   VERSION=<release tag or image digest> docker compose -f docker-compose.production.yml up -d
    # (issue #708 item 6b)
    image: supremeai/backend:${VERSION:?set VERSION to a pinned tag (R-04)}
    container_name: supremeai-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # AI memory retention (issue #1825): policy doc mandates true in prod
      - ENABLE_AI_MEMORY_RETENTION=true
      - AI_MEMORY_RETENTION_INTERVAL_SECONDS=86400
      # Set OTEL_EXPORTER_OTLP_ENDPOINT only when the observability profile is enabled.
      # The collector is profile-scoped and is intentionally absent from the base stack.
      - ENV=production
      - PORT=8080
    ports:
      # #708 item 6a: publish on loopback only. Frontend nginx reaches the
      # backend over supremeai-network via the `backend` alias (see networks
      # below) — inter-container traffic never uses this mapping, and host-side
      # checks (curl/health probes on the same host) keep working. Only
      # off-host access is cut. Matches the loopback posture of every other
      # published port in this file (postgres/redis/prometheus/grafana/otel/
      # jaeger — same pattern as the #575 otel-collector 8888/13133 fix).
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; use python (same as backend/Dockerfile HEALTHCHECK).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      supremeai-network:
        # FE-02 fix (issue #501): frontend/nginx.conf proxies to
        # http://backend:8080. The service is named supremeai-backend, so
        # DNS for "backend" failed inside the production network -> every
        # /api, /admin-api, /auth and /ws request returned 502. The dev
        # compose already attaches the same alias; mirror it here.
        aliases:
          - backend
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "prometheus.job=supremeai-backend"
      - "prometheus.port=8080"
      - "prometheus.path=/metrics"

  # ----------------------------------------------------------
  # POSTGRESQL DATABASE (with pgvector)
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supremeai-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_statement=ddl"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ----------------------------------------------------------
  # REDIS (Cache & Session Store)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: supremeai-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --save 300 100
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # PROMETHEUS (Metrics Collection)
  # ----------------------------------------------------------
  prometheus:
    # R-11 fix (issue #577): 2023-vintage images bumped to current stable tags
    # (compat verified: same CLI flags/config schema; postgres-exporter still
    # honors DATA_SOURCE_NAME; otel config only uses components that still exist).
    # cadvisor pinned to v0.55.1 = newest tag actually PUBLISHED as a container
    # image (github latest v0.60.x ships no image on gcr.io/quay.io).
    image: prom/prometheus:v3.14.0
    container_name: supremeai-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml:ro
      # R-12 fix (issue #540): this token file is gitignored (never commit) and
      # ABSENT from a fresh clone — compose aborts when the bind source does not
      # exist. Provision it BEFORE `--profile observability up`: cp from
      # backend_metrics_token.example or fetch BACKEND_METRICS_TOKEN from the
      # Infisical prod vault — see secrets/README.md for both flows.
      - ./infrastructure/monitoring/prometheus/secrets/backend_metrics_token:/etc/prometheus/secrets/backend_metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=20GB'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - supremeai-backend
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # GRAFANA (Visualization Dashboards)
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.2
    container_name: supremeai-grafana
    profiles: ["observability"]
    restart: unless-stopped
    env_file:
      - .env.grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # INF-15 fix (issue #561): dashboards were mounted but no provisioning
      # config shipped, so Grafana never loaded them (the mounted JSON is
      # invisible without a file provider) and had no Prometheus datasource
      # ("datasource not found" even for manually-imported dashboards).
      # Mount the provisioning tree (datasources/prometheus.yml +
      # dashboards/provider.yaml) so dashboards + datasource come up
      # automatically after every `docker compose down -v`.
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Host 3000 is the app/frontend default port — binding Grafana there caused
      # a clash on any host also serving the web app. Loopback-only 3300 keeps the
      # same hardened posture as prometheus/postgres/redis; container port is
      # unchanged, so Grafana-internal links (provisioned dashboards/datasources)
      # are unaffected.
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # OPENTELEMETRY COLLECTOR (Observability)
  # ----------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: supremeai-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./infrastructure/monitoring/opentelemetry/otel-collector-config.yaml:/etc/otelcol-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
      - "127.0.0.1:8888:8888"   # Prometheus exporter metrics
      - "127.0.0.1:13133:13133" # Health check extension
    depends_on:
      - prometheus
      # INF-11 fix (issue #534): the traces pipeline exports to otlp/jaeger
      # (endpoint jaeger:4317) — start Jaeger before the collector so the
      # exporter resolves its target on first batch.
      - jaeger
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # JAEGER (Trace Backend — for otel-collector otlp/jaeger exporter)
  # ----------------------------------------------------------
  # INF-11 fix (issue #534): the collector's traces pipeline exported every
  # batch to jaeger:4317 while no jaeger service existed anywhere in the
  # stack — DNS-unresolvable target, continuous exporter errors, zero traces
  # reaching any backend. Added the issue's suggested all-in-one backend to
  # the same observability profile the collector runs in.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: supremeai-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      # Accept OTLP gRPC on the container-native 4317 (matches the
      # otel-collector exporter endpoint jaeger:4317); OTLP HTTP on 4318.
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI (loopback-only, same posture as prometheus/grafana)
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"


  # ----------------------------------------------------------
  # POSTGRES EXPORTER (Database Metrics — for prometheus job 'postgresql')
  # ----------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: supremeai-postgres-exporter
    profiles: ["observability"]
    restart: unless-stopped
    # Compose interpolates from the environment/.env; align credentials
    # with .env.production used by the postgres service.
    environment:
      # R-08 fix (issue #565): the previous value fell back to the insecure
      # defaults supremeai:postgres when POSTGRES_* wasn't exported into the
      # compose shell — real prod creds differ, so the exporter connected as
      # the wrong user and DB monitoring died silently. Defaults are dropped:
      # compose now fails fast with a clear message instead (same fail-fast
      # style as the db service in docker-compose.yml). Deploy with the
      # production env file so the variables resolve, e.g.
      #   docker compose --env-file .env.production -f docker-compose.production.yml up
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # REDIS EXPORTER (Cache Metrics — for prometheus job 'redis')
  # ----------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    container_name: supremeai-redis-exporter
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      # R-07 fix (issue #564): redis runs with --requirepass ${REDIS_PASSWORD}
      # (see the redis service), but this exporter connected without
      # credentials — an AUTH-required redis refuses every scrape, so the
      # 'redis' Prometheus job collected nothing and Redis dashboards/alerts
      # were silently blind. Pass the password via the exporter's native
      # REDIS_PASSWORD env var (oliver006/redis_exporter). Fail fast if unset
      # instead of silently scraping an unauthenticatable redis (the compose
      # interpolation reads shell env / .env, like the redis command above).
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    depends_on:
      - redis
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # NODE EXPORTER (Host Metrics — for prometheus job 'node-exporter')
  # ----------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: supremeai-node-exporter
    profiles: ["observability"]
    restart: unless-stopped
    # MONITORING REQUIREMENT — RISK ACCEPTED (issue #708 item 6c): `pid: host`
    # plus the read-only /proc, /sys and /:rootfs mounts below are the
    # documented node-exporter deployment; host-level CPU/memory/disk/network
    # metrics can only be read from the host namespaces. All mounts are :ro,
    # the service is observability-profile-scoped, has NO published ports
    # (scraped by prometheus over the compose network) and collects no app
    # data — do not "harden" these away without replacing the node-exporter
    # Prometheus job.
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # CADVISOR (Container Metrics — for prometheus job 'cadvisor')
  # ----------------------------------------------------------
  cadvisor:
    # Image pinned to v0.55.1 per #577 (newest tag actually published as a
    # container image — verified there; unchanged here).
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: supremeai-cadvisor
    profiles: ["observability"]
    restart: unless-stopped
    # MONITORING REQUIREMENTS — RISKS ACCEPTED (issue #708 item 6c): cadvisor
    # needs privileged mode + /dev/kmsg and the host paths below to collect
    # per-container cgroup/CPU/memory/network/disk stats; the read-only mounts
    # are cadvisor's documented deployment, all mounts are :ro, the service is
    # observability-profile-scoped and has NO published ports (scraped by
    # prometheus over the compose network) — do not "harden" these away
    # without replacing the cadvisor Prometheus job.
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"


# ----------------------------------------------------------
# NETWORKS
# ----------------------------------------------------------
networks:
  supremeai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ----------------------------------------------------------
# VOLUMES (Persistent Data)
# ----------------------------------------------------------
volumes:
  # R-02 fix (issue #536): postgres_data previously bind-mounted a hardcoded
  # host path (driver_opts: {type: none, o: bind, device: /data/postgresql}).
  # /data/postgresql does not exist on fresh/non-GCP hosts, so named-volume
  # creation failed and postgres never started. A plain local named volume
  # (like redis_data below) is portable across deploy targets; Docker manages
  # the on-disk location.
  postgres_data:
    driver: local
  
  redis_data:
    driver: local
  
  prometheus_data:
    driver: local
  
  grafana_data:
    driver: local
