openapi: 3.1.0
info:
  title: SupremeAI Crawl Policy & Telemetry API
  version: 1.0.0
  description: Operator-facing endpoints for managing web crawler policies, trust levels, and querying crawl history.
paths:
  /api/v1/admin/crawler/policies:
    get:
      summary: List all crawl policies for current tenant
      responses:
        "200":
          description: List of policies
    post:
      summary: Create or update a crawl policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, max_depth, max_results]
              properties:
                name:
                  type: string
                is_active:
                  type: boolean
                max_depth:
                  type: integer
                  minimum: 1
                  maximum: 5
                max_results:
                  type: integer
                  minimum: 1
                  maximum: 50
                default_rate_limit_per_min:
                  type: integer
                domain_rules:
                  type: array
                  items:
                    type: object
                    required: [domain, trust_level]
                    properties:
                      domain:
                        type: string
                      trust_level:
                        type: string
                        enum: [trusted, standard, suspicious, blocked]
                      rate_limit_per_min:
                        type: integer
                      render_js:
                        type: boolean
      responses:
        "201":
          description: Created policy
        "400":
          description: Validation error

  /api/v1/admin/crawler/history:
    get:
      summary: Query crawl history for research tasks
      parameters:
        - name: task_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Crawl history records with dedup stats and extractive summaries

  /api/v1/admin/crawler/events:
    get:
      summary: Query crawl telemetry events
      parameters:
        - name: task_id
          in: query
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of matching crawl events
