# SupremeAI Mock Federation Stack (Local Integration Testing)
version: "3.8"

services:
  # 1. MCP Control Tower Mock
  mcp-tower:
    image: node:20-alpine
    container_name: supremeai-mock-mcp-tower
    working_dir: /app
    command: ["sh", "-c", "echo 'MCP Tower Mock Running' && sleep 3600"]
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "echo", "ok"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. Unified API Gateway Mock
  api-gateway:
    image: python:3.11-slim
    container_name: supremeai-mock-gateway
    command: ["python", "-m", "http.server", "8080"]
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Cockpit Studio Mock
  studio:
    image: nginx:alpine
    container_name: supremeai-mock-studio
    ports:
      - "5173:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Ephemeral State Store
  redis-state:
    image: redis:7-alpine
    container_name: supremeai-mock-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
