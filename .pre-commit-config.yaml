# WO #1361 — block commits that log plaintext secrets (OTP/tokens/passwords)
repos:
  - repo: local
    hooks:
      - id: no-secret-logs
        name: scan for secret values interpolated in log/print calls
        entry: python3 scripts/ci/scan_secret_logs.py
        language: system
        pass_filenames: false
        files: '\.py$'
      - id: fast-python-syntax
        name: fast python syntax check (shift-left)
        entry: python3 -m py_compile
        language: system
        types: [python]
        pass_filenames: true
