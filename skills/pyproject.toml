[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supremeai-skills"
version = "0.1.0"
description = "Dynamic Capability Registry, skill packaging, and execution sandbox for the SupremeAI federation."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["supremeai", "skills", "registry", "sandbox", "skills.sh"]

[project.scripts]
supremeai-skill = "registry.package_manager:main"

[tool.setuptools]
packages = ["registry", "sandbox"]
