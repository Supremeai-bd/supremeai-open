name: ci
# Unified Gateway CI — Secret-Scan (13-pattern), Config Sanity, Ruff Lint & Pytest
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: "🧪 Verification & Contract Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: 13-pattern secret scan (fail-closed)
        run: |
          set -euo pipefail
          HIT=0
          check() {
            if grep -rInE "$1" --exclude-dir=.git . 2>/dev/null \
               | grep -v 'env-templates/' \
               | grep -v 'gitleaks:allow' \
               | grep -vE ':[0-9]+:\s*(#|//|\*)' \
               | grep -v 'z.string().describe' \
               | { if [ -n "${3:-}" ]; then grep -vE "$3"; else cat; fi; }; then
              echo "::error::secret-pattern hit: $2"; HIT=1
            fi
          }
          check 'sk-[A-Za-z0-9]{20,}'                       'OpenAI-style sk- key'
          check 'gh[pousr]_[A-Za-z0-9]{36,}'                'GitHub token'
          check 'AKIA[0-9A-Z]{16}'                          'AWS access key'
          check 'AIza[0-9A-Za-z_-]{35}'                     'Google API key'
          check 'xox[bpars]-[A-Za-z0-9-]{10,}'              'Slack token'
          check 'eyJ[A-Za-z0-9_-]{10,}\.eyJ'                'JWT literal'
          check 'CLIENT_SECRET\s*=\s*["'"'"'][^"'"'"']{8,}' 'client secret literal'
          check '(password|passwd|secret)\s*=\s*["'"'"'][^"'"'"'$_{]{6,}["'"'"']' 'password literal'
          check 'srv-[A-Za-z0-9]{6,}'                       'Render service ID'
          check 'https://[a-z0-9-]+\.(onrender\.com|vercel\.app)' 'deploy URL literal' 'https://(supremeai-api|supremeai-studio|supremeai-mcp-tower|tower)[a-z0-9-]*\.(onrender\.com|vercel\.app)'
          check '\b[0-9a-f]{32}\b'                          '32-hex (KV/account ID)'
          check '\b10\.(0|1|2|3|4)\.[0-9]+\.[0-9]+/2[48]\b' 'private subnet CIDR'
          check '\b[0-9a-f]{48}\b'                          '48-hex token'
          if [ "$HIT" -eq 1 ]; then
            echo "Security violation: secret detected in repository"
            exit 1
          fi
          echo "✅ 13-pattern scan clean"

      - name: Config schema sanity
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import os
          if os.path.exists("config/routing_policy.schema.json") and os.path.exists("config/routing_policy.example.json"):
              json.load(open("config/routing_policy.schema.json"))
              json.load(open("config/routing_policy.example.json"))
              print("✅ config JSON valid")
          else:
              print("⏩ config files not present, skipping schema sanity.")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pydantic fastapi httpx uvicorn
          if [ -f service/requirements.txt ]; then pip install -r service/requirements.txt || true; fi
          if [ -f gateway/requirements.txt ]; then pip install -r gateway/requirements.txt || true; fi

      - name: Lint with ruff
        run: |
          ruff check . --select=E9,F63,F7,F82

      - name: Run pytest
        run: |
          if [ -d gateway/tests ]; then pytest gateway/tests/ -v || true; fi
          if [ -d tests ]; then pytest tests/ -v || true; fi

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.OPEN_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai-open/dispatches \
            -d "{\"event_type\": \"federation_ci_failed\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"workflow_name\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"html_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit_sha\": \"${{ github.sha }}\"}}" || true
