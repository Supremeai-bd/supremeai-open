name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pydantic fastapi httpx uvicorn
          if [ -f service/requirements.txt ]; then pip install -r service/requirements.txt; fi
          if [ -f gateway/requirements.txt ]; then pip install -r gateway/requirements.txt; fi

      - name: Lint with ruff
        run: |
          ruff check . --select=E9,F63,F7,F82

      - name: Run pytest
        run: |
          if [ -d gateway/tests ]; then pytest gateway/tests/ -v; fi
          if [ -d tests ]; then pytest tests/ -v; fi

      - name: Secret scan (fail-closed)
        run: |
          set -euo pipefail
          HIT=0
          check() {
            if grep -rInE "$1" --exclude-dir=.git . 2>/dev/null | grep -v 'gitleaks:allow'; then
              echo "::error::secret-pattern hit: $2"; HIT=1
            fi
          }
          check 'sk-[A-Za-z0-9]{20,}' 'OpenAI-style sk- key'
          check 'gh[pousr]_[A-Za-z0-9]{36,}' 'GitHub token'
          check 'AKIA[0-9A-Z]{16}' 'AWS access key'
          check 'AIza[0-9A-Za-z_-]{35}' 'Google API key'
          if [ "$HIT" -eq 1 ]; then
            echo "Security violation: secret detected in repository"
            exit 1
          fi
          echo "Secret scan clean"


