- id: C-10
  area: auth
  role: customer
  name: Logout returns user to login
  description: >
    Triggering logout from the global header ends the session and navigates
    the customer to /login; protected routes then bounce to login again.
  route: /workspace
  severity: P1
  automated: true
  action:
    - navigate: /workspace
    - click: '[data-testid="account-menu-btn"]'
    - click: '[data-testid="logout-btn"]'
  assert:
    - url_matches: ^/login$
  manual_note: "Resolved (M0-G): GlobalHeader exposes account-menu-btn/logout-btn data-testids; spec opens the profile menu before clicking logout."
