# SupremeAI QA checklist — Security isolation (S-01..S-10)
# Schema: docs/plans/features/qa_engine_auto_checking_implementation_plan.md (Part 1)
# Grounded in:
#   - frontend/src/components/core/AuthGuards.tsx (ProtectedRoute -> /login)
#   - frontend/src/routes/workspaceFeatureRoutes.tsx (/share/:shareId intentionally public)
#   - backend/api/routes/admin_v1.py (require_admin_token on /api/v1/admin/*)
#   - Task 6 zero-hardcode reconciliation (config_validation.py CORS fail-closed)
- id: S-01
  area: isolation
  role: security
  name: Anonymous user cannot open protected routes
  description: >
    Hitting /projects (and any ProtectedRoute) without a session redirects to
    /login — protected content never renders for anonymous visitors.
  route: /projects
  severity: P0
  automated: true
  action:
    - navigate: /projects
  assert:
    - url_matches: ^/login$
  manual_note: null

- id: S-02
  area: isolation
  role: security
  name: User A cannot access User B project
  description: >
    Two isolated browser contexts: User A creates a private project; User B
    opens its URL directly and gets 403/404 (never 200 with A's data).
  route: /projects
  severity: P0
  automated: true
  action:
    - login_context: user-a
    - create_project: UserA-Private-Project
    - login_context: user-b
    - navigate: /projects/<user-a-project-id>
  assert:
    - status_in: '403,404'
    - text_hidden: UserA-Private-Project
  manual_note: Requires QA_USER_A_EMAIL/QA_USER_A_PASSWORD and QA_USER_B_EMAIL/QA_USER_B_PASSWORD accounts plus a stable project-id URL scheme — fixture work in the next pass.

- id: S-03
  area: stepup
  role: security
  name: Admin step-up cannot be bypassed by deep link
  description: >
    A Firebase-authenticated admin account that has NOT completed the
    OTP/TOTP step-up cannot pull console data by navigating directly to
    /admin — the challenge gate stays up.
  route: /admin
  severity: P0
  automated: true
  action:
    - login_context: admin-without-stepup
    - navigate: /admin
    - fill: '[data-testid="admin-email-input"] =<qa-admin-email>'
    - fill: '[data-testid="admin-password-input"] =<qa-admin-password>'
    - click: '[data-testid="admin-login-submit"]'
  assert:
    - selector_visible: '[data-testid="otp-input"]'
    - no_network_request: /api/v1/admin/stats
  manual_note: "Resolved (M0-G): spec builds the admin-without-stepup context live (main login, no admin JWT — security project has no storage state) and asserts the AdminGate → OTP challenge with no console data leak. Env prerequisites: QA_ADMIN_EMAIL/QA_ADMIN_PASSWORD + live backend answering otp_required."

- id: S-04
  area: cors
  role: security
  name: CORS does not reflect arbitrary origins
  description: >
    An OPTIONS preflight carrying a hostile Origin (https://evil.example)
    is never answered with access-control-allow-origin: https://evil.example
    (config_validation.py is fail-closed after the Task-6 zero-hardcode fix).
  route: /
  severity: P1
  automated: true
  action:
    - preflight_request: https://evil.example
  assert:
    - not_header_equals: access-control-allow-origin=https://evil.example
  manual_note: null

- id: S-05
  area: api
  role: security
  name: Protected API rejects unauthenticated calls
  description: >
    GET /api/v1/projects without a token returns 401/403 — user data
    endpoints are never readable anonymously through the deployed origin.
  route: /projects
  severity: P1
  automated: true
  action:
    - request_get: /api/v1/projects
  assert:
    - status_in: '401,403'
  manual_note: null

- id: S-06
  area: isolation
  role: security
  name: Share links expose only the shared conversation
  description: >
    /share/:shareId is public by design (workspaceFeatureRoutes.tsx), but it
    must render only the conversation the share token points to — another
    user's conversation id must not resolve to foreign content.
  route: /share/:shareId
  severity: P1
  automated: true
  action:
    - login_context: user-a
    - create_share: conversation-a
    - navigate: /share/<conversation-a-share-id>
  assert:
    - text_visible: shared-conversation-marker
    - text_hidden: conversation-b-content-marker
  manual_note: Requires share-creation fixtures for two users; unverified until Part 9 selector + account work lands.

- id: S-07
  area: headers
  role: security
  name: Auth tokens never appear in URLs
  description: >
    Across public navigation (/, /login, /register) no access_token/token/
    id_token query parameter is ever present in the address bar.
  route: /login
  severity: P2
  automated: true
  action:
    - navigate: /
    - navigate: /login
    - navigate: /register
  assert:
    - not_url_contains: token=
  manual_note: null

- id: S-08
  area: secrets
  role: security
  name: API keys are masked after creation
  description: >
    On /settings/api-keys a freshly created key is shown once and then
    masked in list views (no full plaintext key in the DOM after reload).
  route: /settings/api-keys
  severity: P2
  automated: true
  action:
    - navigate: /settings/api-keys
    - fill: '[data-testid="new-key-name"] =qa-mask-check-<run-id>'
    - click: '[data-testid="create-key-btn"]'
    - reload: page
  assert:
    - not_text_visible: sk-live
  manual_note: "Resolved (M0-G): key-creation testids (new-key-name/create-key-btn) exist; spec captures the one-time banner plaintext and asserts it never survives reload (masked list only). Prerequisites: customer storage state (scratch QA account) + live /api/api-keys backend; destructive only to the dedicated QA account."

- id: S-09
  area: headers
  role: security
  name: Security headers baseline present on app responses
  description: >
    App responses carry the deployment security baseline (X-Frame-Options or
    frame-ancestors CSP, X-Content-Type-Options). Hard assertions activate
    once the staging baseline is captured.
  route: /
  severity: P1
  automated: true
  action:
    - request_get: /
  assert:
    - header_present: x-content-type-options
    - header_present: x-frame-options|content-security-policy
  manual_note: Header baseline for Firebase Hosting/Render not yet captured — flip from fixme to hard assert after the first staging capture (08-production-preflight evidence).

- id: S-10
  area: recovery
  role: security
  name: Rollback and backup-restore evidence exists
  description: >
    Rollback drill and backup-restore drill evidence is current for the
    release being signed off (mirrors core.yaml QA-008 release gate).
  route: /
  severity: P3
  automated: false
  action:
    - review: rollback-drill-evidence
    - review: backup-restore-drill-evidence
  assert:
    - human_signoff_recorded: "true"
  manual_note: Operational drill — requires a deployed environment and operator sign-off; not browser-automatable.
