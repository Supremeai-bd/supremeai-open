# SupremeAI API v1 — স্থিতিশীল বাইরের চুক্তি (plan §৮, §১৭, §২১)
# বাংলা মন্তব্য: OpenAI-compatible ইচ্ছাকৃত — বিদ্যমান টুলিং (Cursor/Aider/agents) শূন্য-পরিবর্তনে চলবে।
# Provider কে handle করলো — consumer জানবে না (§২২)।
openapi: 3.1.0
info:
  title: SupremeAI API
  version: 1.0.0
  description: >
    Unified provider gateway. One SUPREMEAI_API_KEY, provider-agnostic responses.
    Provider credentials never leave the server side (plan §11).
servers:
  - url: /
security:
  - SupremeAIKey: []
paths:
  /v1/chat/completions:
    post:
      summary: Chat completion (OpenAI-compatible)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Completion result (OpenAI-compatible shape)
          headers:
            X-RateLimit-Limit:
              schema: { type: integer }
              description: Per-key request allowance in the current window (key-plane রিপোর্ট করলে; absent = unknown, বানানো নয়)
            X-RateLimit-Remaining:
              schema: { type: integer }
              description: Remaining allowance in the current window
            X-RateLimit-Reset:
              schema: { type: integer }
              description: Unix seconds when the window resets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "401":
          description: Invalid or missing SupremeAI key (retry নয় — key যাচাই)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Key lacks required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Quota/rate limit exceeded (config-driven) — Retry-After সম্মান করুন
          headers:
            Retry-After:
              schema: { type: integer, description: "Seconds until the per-key window resets (মেশিন-যাচাইযোগ্য Retry-After চুক্তি, CONSUMERS.md §৩)" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: All providers in fallback chain failed (কিছুক্ষণ পরে retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Keyplane/infrastructure unavailable (retry-যোগ্য)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/models:
    get:
      summary: Enabled models (from routing_policy config, not provider internals)
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        object: { type: string, const: model }
                        owned_by: { type: string, const: supremeai }
  /healthz:
    get:
      summary: Gateway health (no auth)
      security: []
      responses:
        "200": { description: healthy }
components:
  securitySchemes:
    SupremeAIKey:
      type: apiKey
      in: header
      name: X-SupremeAI-Key
      description: >
        SUPREMEAI_API_KEY — gateway access credential. NOT a provider credential copy.
  schemas:
    Error:
      type: object
      required: [error]
      description: >-
        সমস্ত 4xx/5xx ত্রুটির একক আকার (OpenAI-style নেস্টেড error অবজেক্ট) —
        CONSUMERS.md §৩-এর সৎ-চুক্তির মেশিন-পাঠযোগ্য রূপ।
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              description: Human-readable reason (কোনো key/provider ভ্যালু কখনো নয়)
            type:
              type: string
              description: Machine class — invalid_api_key | insufficient_scope | rate_limit_exceeded | provider_chain_exhausted | keyplane_unavailable
            code:
              type: string
              nullable: true
              description: Optional detail code (অনুপস্থিত হলে null নয়, ফিল্ডই বাদ — সততা-মতবাদ)
    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          default: auto
          description: "auto = router রায় (routing_policy.json অনুযায়ী)"
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant] }
              content: { type: string }
        temperature: { type: number, default: 0.7 }
        max_tokens: { type: integer, nullable: true }
        stream:
          type: boolean
          default: false
          description: >-
            সততা-নোট: streaming ঘোষিত কিন্তু সব ডেপ্লয়মেন্টে বাস্তবায়িত নয় — stream:true দিলে
            সার্ভার 400 (Error আকারে) দিতে পারে। SSE নিশ্চিত না হওয়া পর্যন্ত client stream:true
            ধরে চলবে না (examples/gateway_client.py বর্তমানে non-streaming)।
    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer }
        model: { type: string, description: "যে মডেল সত্যিই সামলালো (গোপনীয়তা: provider-name দৃশ্যমান হতে পারে, key কখনো নয়)" }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                type: object
                properties:
                  role: { type: string }
                  content: { type: string }
              finish_reason: { type: string }
        usage:
          type: object
          description: provider-রিপোর্টেড usage — না পেলে বানানো নয়, ক্ষেত্রটি বাদ (সততা-মতবাদ)
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
