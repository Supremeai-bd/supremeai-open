# SupremeAI API v1 — স্থিতিশীল বাইরের চুক্তি (plan §৮, §১৭, §২১)
# বাংলা মন্তব্য: OpenAI-compatible ইচ্ছাকৃত — বিদ্যমান টুলিং (Cursor/Aider/agents) শূন্য-পরিবর্তনে চলবে।
# Provider কে handle করলো — consumer জানবে না (§২২)।
openapi: 3.1.0
info:
  title: SupremeAI API
  version: 1.0.0
  description: >
    Unified provider gateway. One SUPREMEAI_API_KEY, provider-agnostic responses.
    Provider credentials never leave the server side (plan §11).
servers:
  - url: /
security:
  - SupremeAIKey: []
paths:
  /v1/chat/completions:
    post:
      summary: Chat completion (OpenAI-compatible)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Completion result (OpenAI-compatible shape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "401": { description: Invalid or missing SupremeAI key }
        "403": { description: Key lacks required scope }
        "429": { description: Quota/rate limit exceeded (config-driven) }
        "502": { description: All providers in fallback chain failed }
        "503":
          description: >
            Keyplane/infrastructure unavailable (retry-able). Contract parity:
            docs/CONSUMERS.md §3 and the reference client treat 503 as the
            retry-able class — the spec previously omitted it, so generated
            SDKs lost the retry semantics.
  /v1/models:
    get:
      summary: Enabled models (from routing_policy config, not provider internals)
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        object: { type: string, const: model }
                        owned_by: { type: string, const: supremeai }
        "401": { description: Invalid or missing SupremeAI key }
        "429": { description: Quota/rate limit exceeded (config-driven) }
  /healthz:
    get:
      summary: Gateway health (no auth)
      security: []
      responses:
        "200": { description: healthy }
components:
  securitySchemes:
    SupremeAIKey:
      type: apiKey
      in: header
      name: X-SupremeAI-Key
      description: >
        SUPREMEAI_API_KEY — gateway access credential. NOT a provider credential copy.
  schemas:
    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          default: auto
          description: "auto = router রায় (routing_policy.json অনুযায়ী)"
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant] }
              content: { type: string }
        temperature: { type: number, default: 0.7 }
        # OAS 3.1: `nullable` was removed — the 3.1-valid form is a type array.
        max_tokens: { type: [integer, "null"] }
        stream: { type: boolean, default: false }
    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer }
        model: { type: string, description: "যে মডেল সত্যিই সামলালো (গোপনীয়তা: provider-name দৃশ্যমান হতে পারে, key কখনো নয়)" }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                type: object
                properties:
                  role: { type: string }
                  content: { type: string }
              finish_reason: { type: string }
        usage:
          type: object
          description: provider-রিপোর্টেড usage — না পেলে বানানো নয়, ক্ষেত্রটি বাদ (সততা-মতবাদ)
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
