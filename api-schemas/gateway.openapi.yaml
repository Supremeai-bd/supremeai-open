openapi: 3.1.0
info:
  title: SupremeAI Unified Gateway Shield
  version: 1.0.0
  description: |
    Rule 18 (AUTONOMOUS_TRANSIT_PIPELINE.md): the single external entry
    point for all third-party AI providers, exposing an OpenAI-compatible
    surface. Rule 19: provider credentials live ONLY in the server-side
    vault (Infisical/Render) — no provider key material appears anywhere
    in this contract. Rule 21: downstream callers authenticate exclusively
    with the one-key SSOT (SUPREMEAI_API_KEY) via Bearer token or the
    X-SupremeAI-Key header. Rule 22: tenant quota (RPS/RPM) and usage
    attribution are governed through the gateway key-plane.
servers:
  - url: https://supremeai-api.onrender.com
security:
  - bearerAuth: []
  - supremeKeyHeader: []
paths:
  /v1/models:
    get:
      summary: List models exposed by the gateway
      operationId: listModels
      security:
        - bearerAuth: []
        - supremeKeyHeader: []
      responses:
        "200":
          description: Model catalog
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat completion (provider resolved server-side)
      operationId: createChatCompletion
      security:
        - bearerAuth: []
        - supremeKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Completion result (provider and failover hop recorded
            in the X-SupremeAI-Served-By response header, never in the key plane)
          headers:
            X-SupremeAI-Served-By:
              description: Provider chain hop that served the request (Rule 20)
              schema:
                $ref: "#/components/schemas/ProviderName"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "503":
          description: Entire failover chain exhausted (Rule 20)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: SUPREMEAI_API_KEY as Bearer token (Rule 21 SSOT)
    supremeKeyHeader:
      type: apiKey
      in: header
      name: X-SupremeAI-Key
      description: SUPREMEAI_API_KEY via header (Rule 21 SSOT alternative)
  responses:
    Unauthorized:
      description: Missing or invalid SUPREMEAI_API_KEY credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QuotaExceeded:
      description: Tenant RPS/RPM quota exceeded (Rule 22)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ProviderName:
      type: string
      enum: [groq, gemini, openrouter, anthropic, fallback]
      description: Routing metadata only — carries zero credential material (Rule 19)
    ModelRef:
      type: object
      required: [id, object]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [model]
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Logical model name; provider binding is resolved
            server-side behind the shield (Rules 18-20)
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        stream:
          type: boolean
          default: false
    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
    ChatCompletionResponse:
      type: object
      required: [id, object, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        choices:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message:
                $ref: "#/components/schemas/Message"
        usage:
          type: object
          description: Usage attribution feeds Rule 22 tenant telemetry
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }
