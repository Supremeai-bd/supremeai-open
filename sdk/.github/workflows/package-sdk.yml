name: Package & Release SupremeAI SDK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'python/**'
      - 'typescript/**'
      - 'tests/**'
      - '.github/workflows/package-sdk.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'typescript/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish packages to PyPI and npm registry'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Create GitHub Release with package assets'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  python-sdk:
    name: "🐍 Python SDK (Build, Test & Publish)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest

      - name: Run Python Client Tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/
          elif [ -d "sdk/tests" ]; then
            pytest sdk/tests/
          fi

      - name: Build Python Distribution Package (sdist + wheel)
        run: |
          python -m build python/

      - name: Validate Package Metadata & Syntax
        run: |
          twine check python/dist/*

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supremeai-python-sdk
          path: python/dist/
          if-no-files-found: error

      - name: Publish to PyPI
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true') && env.TWINE_PASSWORD != ''
        run: |
          twine upload --skip-existing python/dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  typescript-sdk:
    name: "🟦 TypeScript SDK (Typecheck, Pack & Publish)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install TypeScript Compiler
        run: |
          npm install -g typescript

      - name: Typecheck TypeScript Client
        working-directory: typescript
        run: |
          npm run typecheck

      - name: Run TypeScript Client Tests
        working-directory: typescript
        run: |
          npm test

      - name: Pack Distribution Tarball
        working-directory: typescript
        run: |
          npm pack

      - name: Upload TypeScript Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supremeai-typescript-sdk
          path: typescript/*.tgz
          if-no-files-found: error

      - name: Publish to npm Registry
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true') && env.NODE_AUTH_TOKEN != ''
        working-directory: typescript
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: "🚀 Publish GitHub Release"
    needs: [python-sdk, typescript-sdk]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            supremeai-python-sdk/*
            supremeai-typescript-sdk/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
