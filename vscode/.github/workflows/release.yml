name: release
# Unified VS Code Extension & Client Hub Release Pipeline
# Detects changes across the 3 clients (Extension, Desktop, Mobile) and releases only the updated targets.

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'desktop/**'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      release_extension:
        description: 'Force release VS Code Extension (.vsix)'
        required: false
        type: boolean
        default: false
      release_desktop:
        description: 'Force release Desktop Client (.exe)'
        required: false
        type: boolean
        default: false
      release_mobile:
        description: 'Force release Mobile Client (.apk)'
        required: false
        type: boolean
        default: false

concurrency:
  group: vscode-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    name: "🔍 Detect Client Changes"
    runs-on: ubuntu-24.04
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            extension:
              - 'extension/**'
              - 'package.json'
              - 'package-lock.json'
            desktop:
              - 'desktop/**'
              - 'package.json'
              - 'package-lock.json'
            mobile:
              - 'mobile/**'
              - 'package.json'
              - 'package-lock.json'

  package-extension:
    name: "📦 Package & Release Extension (.vsix)"
    needs: detect-changes
    if: needs.detect-changes.outputs.extension == 'true' || github.event.inputs.release_extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile --workspace=extension

      - name: Run Extension Tests
        run: npm test --workspace=extension

      - name: Package VSIX Extension
        run: npx --yes @vscode/vsce package --no-git-tag-version --out supremeai-vscode.vsix
        working-directory: extension

      - name: Determine Version
        id: version
        run: |
          VER=$(node -p "require('./extension/package.json').version")
          echo "version=v$VER" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: extension/supremeai-vscode.vsix
          tag_name: ${{ steps.version.outputs.version }}
          name: "SupremeAI IDE Bridge ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: "🖥️ Build & Release Desktop Client (Windows .exe)"
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true' || github.event.inputs.release_desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop Web App
        run: npm run build --workspace=desktop

      - name: Build Tauri Binary
        run: npx tauri build --config src-tauri/tauri.conf.json --no-bundle
        working-directory: desktop

      - name: Determine Desktop Version
        id: version
        shell: bash
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          echo "version=desktop-v$VER" >> "$GITHUB_OUTPUT"

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v6
        with:
          name: supremeai-desktop-windows-x64
          path: desktop/src-tauri/target/release/*.exe
          if-no-files-found: error

      - name: Publish Desktop GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: desktop/src-tauri/target/release/*.exe
          tag_name: ${{ steps.version.outputs.version }}
          name: "SupremeAI Desktop ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mobile:
    name: "📱 Build & Release Mobile Client (Android .apk)"
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true' || github.event.inputs.release_mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build Mobile Web App
        run: npm run build --workspace=mobile

      - name: Sync Capacitor Android
        working-directory: mobile
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Determine Mobile Version
        id: version
        run: |
          VER=$(node -p "require('./mobile/package.json').version")
          echo "version=mobile-v$VER" >> "$GITHUB_OUTPUT"

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v6
        with:
          name: supremeai-mobile-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Mobile GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/android/app/build/outputs/apk/debug/*.apk
          tag_name: ${{ steps.version.outputs.version }}
          name: "SupremeAI Mobile ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
