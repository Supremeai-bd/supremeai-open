name: Federation CI Watchdog (Scheduled Poll)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: federation-ci-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Poll federation repos for CI failures
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.OPEN_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ci/federation_ci_watchdog.py --poll --max-age-hours 1
