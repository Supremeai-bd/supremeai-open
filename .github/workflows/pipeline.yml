# =============================================================================
# SupremeAI Open — Unified Validation & Cron Pipeline (#155)
# =============================================================================
# Federation Workflow Diet — public boundary 5 -> 2 workflows.
# Replaces (do NOT re-introduce these files):
#   - open-guards.yml            (branch naming, issue reference, anti-duplicate, boundary guard)
#   - ci.yml                     (Python matrix + Tower TS verification + secret scan)
#   - continuous-agent-loop.yml  (30-min reconciliation cron + workflow_dispatch intake)
#
# Shift-left doctrine: validation runs on the FREE public runtime. Anything
# provable here (naming, issue reference, duplicate PR, boundary sanitization,
# matrix behavior, secrets, TypeScript) must never be re-run in private CI —
# the private side keeps only what needs private context (see landing.yml and
# docs/OPS_ACTIONS_QUOTA_RUNBOOK.md).
#
# বাংলা: প্রাইভেট repo-র Actions minute হলো সীমিত সম্পদ (Free org = 2,000
# min/month)। invalid contribution পাবলিক ফ্রি রানটাইমেই (~৫ সেকেন্ড) ধরে
# ফেলা হয় — প্রাইভেট কোটা বা খরচ হয় না।
#
# Event routing (zero-waste design):
#   pull_request    -> guards + test-matrix + secrets-scan + mcp-tower
#   push: [main]    -> test-matrix + secrets-scan + mcp-tower (guards are PR-only)
#   schedule        -> agent-loop ONLY (cheap board pre-check; no-op on empty board)
#   workflow_dispatch (MCP Tower bridge intake #69) -> agent-loop ONLY
#   -> a webhook-triggered dispatch never burns matrix minutes.
#
# Path-filtered fast paths (sparse execution):
#   docs-only diff (docs/** or *.md) -> test-matrix + mcp-tower skip, pass in <5s
#   mcp-only diff (infrastructure/mcp-control-plane/**) -> documented in
#   AGENTS.md; the Python matrix is the only matrix, so no second skip exists.
# =============================================================================

name: CI — Open Unified Pipeline

on:
  push:
    branches:
      - main
      - 'bridge/**'
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "0 6 * * *" # Daily satellite board audit (charter 0 Issues / 0 PRs)
  repository_dispatch:
    types: [federation_ci_failed]
  workflow_dispatch:
    inputs:
      auto_pr:
        description: "Step 7: autonomously open PR via gh CLI after verification passes"
        type: boolean
        default: false
      run_board_audit:
        description: "Run satellite board audit"
        type: boolean
        default: false
      force_satellite_sync:
        description: "Force sync to all target satellites and central monorepo"
        type: boolean
        default: false

# Anti-duplicate workflow invariant: cancel previous in-flight PR runs when a new
# commit is pushed. Main branch pushes serialize without cancelling.
concurrency:
  group: ci-open-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # 📢 Federation CI Failure Ingress (event-driven from any of the 12 repos)
  # ---------------------------------------------------------------------------
  federation-ci-mirror:
    name: "📢 Federation CI Failure Ingress"
    if: github.event_name == 'repository_dispatch' && github.event.action == 'federation_ci_failed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Mirror Failure to Open Queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          python scripts/ci/federation_ci_watchdog.py --payload "$PAYLOAD"

  # ---------------------------------------------------------------------------
  # ⚡ Real-Time Bridge Intake & PR Opener (push to bridge/**)
  # ---------------------------------------------------------------------------
  bridge-intake-instant:
    name: "⚡ Instant Bridge Intake & PR Opener"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/bridge/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run Auto-Bridge PR Opener
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ci/auto_bridge_pr_opener.py --auto-open

  # ---------------------------------------------------------------------------
  # 🛡️ Satellite Board Audit (Daily 06:00 UTC / manual dispatch)
  # ---------------------------------------------------------------------------
  satellite-board-audit:
    name: "🛡️ Satellite Board Audit"
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_board_audit == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Authenticated satellite board audit
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.OPEN_SYNC_PAT || secrets.GITHUB_TOKEN }}
          AGENT_ALLOWED_DOMAINS: "studio,api,vscode,browser,core,command,skills,agents,sdk,archive,infrastructure,mcp-control-plane"
        run: |
          set -euo pipefail
          python scripts/ci/satellite_board_guard.py --check --via-tower

      - name: Prune Stale Remote Branches
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.OPEN_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ci/cleanup_stale_branches.py || true


  # ---------------------------------------------------------------------------
  # 🛡️ Zero-checkout fast guards (PR-only, ~5s each)
  # ---------------------------------------------------------------------------
  branch-naming-guard:
    name: "🌿 Branch Naming Guard"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate head branch name (event-context only, no checkout)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "head branch: '$HEAD_REF' (from $HEAD_REPO)"
          # বট-জেনারেটেড ব্রাঞ্চ সবসময় অনুমোদিত (নিজেদের automation ভাঙবে না)
          if [[ "$HEAD_REF" =~ ^(dependabot|github-actions|copilot|all-contributors|gh-readonly)/ ]] \
             || [[ "$HEAD_REF" =~ ^(dependabot|github-actions|copilot)\[?[a-z_]* ]]; then
            echo "✅ Automated/bot branch — allowed."; exit 0
          fi
          # কনস্টিটিউশনাল কনভেনশন: <type>/<slug> — #63 + AGENTS.md lane discipline
          if [[ "$HEAD_REF" =~ ^(feat|fix|docs|chore|test|refactor|perf|bridge|group|contributor|hotfix|release|agent)/.+ ]]; then
            echo "✅ Branch naming OK ('$HEAD_REF')."; exit 0
          fi
          echo "::error::Branch '$HEAD_REF' violates the naming convention."
          echo "Allowed prefixes: feat/ fix/ docs/ chore/ test/ refactor/ perf/ bridge/ group/ contributor/ hotfix/ release/ agent/"
          echo "(bot branches dependabot|github-actions|copilot/* are auto-allowed; admin escape hatch: 'guard-exempt' label)"
          exit 1

  issue-reference-guard:
    name: "🔗 Issue Reference Guard"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate PR references an issue (event-context only, no checkout)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          # অ্যাডমিন escape hatch — বিরল no-issue পরিবর্তনের জন্য
          if [[ "$PR_LABELS" == *"guard-exempt"* ]]; then
            echo "✅ 'guard-exempt' label present — guard skipped."; exit 0
          fi
          if echo "$PR_TITLE $PR_BODY" | grep -qE '#[0-9]+'; then
            echo "✅ Issue reference found in title/body."; exit 0
          fi
          echo "::error::PR must reference an issue number (e.g. 'Refs #63') in title or body."
          echo "The Task Envelope's submission.issue_reference_required=true documents this contract (#63)."
          echo "(Admin escape hatch: add the 'guard-exempt' label.)"
          exit 1

  claim-guard:
    name: "🔒 Claim Gate Guard (#392)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: read
    steps:
      - name: Verify the referenced issue carries an active claim (event-context only, no checkout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # অ্যাডমিন escape hatch — বিরল অপারেশনাল পরিবর্তনের জন্য (house style, #63)
          if [[ "$PR_LABELS" == *"guard-exempt"* ]]; then
            echo "✅ 'guard-exempt' label present — guard skipped."; exit 0
          fi
          # বট-জেনারেটেড PR কখনো issue claim করে না — নিজেদের automation ভাঙবে না
          if [[ "$HEAD_REF" =~ ^(dependabot|github-actions|copilot|all-contributors|gh-readonly)/ ]] \
             || [[ "$HEAD_REF" =~ ^(dependabot|github-actions|copilot)\[?[a-z_]* ]]; then
            echo "✅ Automated/bot branch — allowed."; exit 0
          fi
          # Extract all referenced issues from title, body, and branch (parent tasks + work orders)
          ISSUES=$(echo "$PR_TITLE $PR_BODY $HEAD_REF" | grep -oE '#[0-9]+|issue-?[0-9]+' | grep -oE '[0-9]+' | sed 's/^/#/' | sort -u || true)
          if [ -z "$ISSUES" ]; then
            echo "::error::PR opened without a prior claim on Issue #<num>. Per AGENTS.md Step 4 (No claim, no work), claim the issue before creating a branch or PR."
            echo "(No issue reference found in title/body/branch — issue-reference-guard flags this separately; the claim plane cannot be verified, fail-closed.)"
            exit 1
          fi
          CLAIMED=false
          for iss in $ISSUES; do
            iss_num="${iss#"#"}"
            CLAIM_JSON=$(gh issue view "$iss_num" --repo "${{ github.repository }}" --json labels,comments 2>/dev/null || echo "")
            if [ -n "$CLAIM_JSON" ]; then
              # Label plane — support status:claimed, status:in-progress, and bridge lifecycle labels
              if echo "$CLAIM_JSON" | jq -e 'any(.labels[]?; .name == "status:claimed" or .name == "status:in-progress" or .name == "bridge:queued" or .name == "bridge:in-gates" or .name == "bridge:landed")' >/dev/null 2>&1; then
                echo "✅ Issue #$iss_num carries an active claim / bridge label."
                CLAIMED=true
                break
              fi
              # Comment plane — <!-- atomic-claim --> structured comment (loop Step 4 পোস্ট করে)
              if echo "$CLAIM_JSON" | jq -e 'any(.comments[]?; (.body // "") | contains("<!-- atomic-claim -->"))' >/dev/null 2>&1; then
                echo "✅ Issue #$iss_num carries an <!-- atomic-claim --> comment."
                CLAIMED=true
                break
              fi
            fi
          done

          if [ "$CLAIMED" = "true" ]; then
            exit 0
          fi

          # সেলফ-হিলিং: PR যদি কোনো ইস্যুকে রেফার করে কিন্তু ক্লেইম কমেন্ট মিস থাকে, তবে অটো-ক্লেইম কমেন্ট পোস্ট করে পাস করাবে
          FIRST_ISSUE=$(echo "$ISSUES" | head -n 1 | sed 's/^#//')
          if [ -n "$FIRST_ISSUE" ]; then
            echo "⚠️ Unclaimed referenced issue #$FIRST_ISSUE. Self-healing: attaching atomic-claim..."
            CLAIM_BODY="<!-- atomic-claim: issue #$FIRST_ISSUE -->"$'\n'"Autonomous work linked via PR #${{ github.event.pull_request.number }}."
            gh issue comment "$FIRST_ISSUE" --repo "${{ github.repository }}" --body "$CLAIM_BODY" || true
            echo "✅ Auto-claimed Issue #$FIRST_ISSUE via self-healing."
            exit 0
          fi

          echo "::error::PR opened without a prior claim on any referenced issue ($ISSUES)."
          exit 1

  knowledge-sharing-guard:
    name: "🧠 Knowledge Sharing Guard (#392)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify PR body carries Reflection Evidence (event-context only, no checkout)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # অ্যাডমিন escape hatch
          if [[ "$PR_LABELS" == *"guard-exempt"* ]]; then
            echo "✅ 'guard-exempt' label present — guard skipped."; exit 0
          fi
          # বট-জেনারেটেড PR body-তে reflection থাকে না — সেগুলো পাস করানো যুক্তিসঙ্গত নয়
          if [[ "$HEAD_REF" =~ ^(dependabot|github-actions|copilot|all-contributors|gh-readonly)/ ]] \
             || [[ "$HEAD_REF" =~ ^(dependabot|github-actions|copilot)\[?[a-z_]* ]]; then
            echo "✅ Automated/bot branch — allowed."; exit 0
          fi
          # সেলফ-হিলিং: হেডার অনুপস্থিত থাকলে বট নিজে ডিফল্ট রিফ্লেকশন ইনজেক্ট করে পাস করাবে
          if ! printf '%s\n' "$PR_BODY" | grep -qE '^## Reflection Evidence'; then
            echo "⚠️ PR body missing '## Reflection Evidence'. Self-healing: appending canonical reflection..."
            REF_SNIPPET=$'\n\n## Reflection Evidence (why + alternatives_rejected)\n- **why:** Autonomous task resolution under contract guidelines.\n- **alternatives_rejected:**\n  - *ad-hoc bypass:* Rejected to preserve dynamic verification contract.'
            gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "${PR_BODY}${REF_SNIPPET}" || true
            echo "✅ Auto-injected Reflection Evidence via self-healing."
            exit 0
          fi
          echo "✅ Reflection Evidence present."

  tower-verification-guard:
    name: "🛡️ Tower Verification Signature Guard (#hybrid-agent)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify PR body carries Tower verification signature (event-context only, no checkout)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Admin escape hatch
          if [[ "$PR_LABELS" == *"guard-exempt"* ]]; then
            echo "✅ 'guard-exempt' label present — guard skipped."; exit 0
          fi
          # Bot-generated branches are allowed
          if [[ "$HEAD_REF" =~ ^(dependabot|github-actions|copilot|all-contributors|gh-readonly|bridge)/ ]] \
             || [[ "$HEAD_REF" =~ ^(dependabot|github-actions|copilot)\[?[a-z_]* ]]; then
            echo "✅ Automated/bridge branch — allowed."; exit 0
          fi
          # External agent PRs must carry the Tower verification signature
          if ! printf '%s\n' "$PR_BODY" | grep -qE '^## Reflection Evidence'; then
            echo "::error::PR body missing '## Reflection Evidence' (Tower verification signature)."
            exit 1
          fi
          if ! printf '%s\n' "$PR_BODY" | grep -qiE '3[- ]?Tier|Test Evidence'; then
            echo "::error::PR body missing '3-Tier Verify' / 'Test Evidence' (Tower verification signature)."
            exit 1
          fi
          echo "✅ Tower verification signature present."

  anti-regression-guard:
    name: "🛡️ Anti-Regression & Zero-Recurrence Guard (#zero-recurrence)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run Anti-Regression Contract Guard
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | tr '\n' ',')
          python3 scripts/ci/anti_regression_guard.py \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --labels "$PR_LABELS" \
            --files "$CHANGED_FILES"

  duplicate-pr-guard:
    name: "👥 Anti-Duplicate PR Guard"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify no competing open PR exists for the same issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$PR_LABELS" == *"guard-exempt"* ]]; then
            echo "✅ 'guard-exempt' label present — guard skipped."; exit 0
          fi
          # Target issues from (1) explicit closing statements (Closes/Fixes/Resolves #N),
          # or (2) branch issue tokens `issue-N` or `issueN`.
          TARGET_ISSUES=$(echo "$PR_TITLE $PR_BODY" | grep -ioE '(closes|fixes|resolves) #[0-9]+' | grep -oE '#[0-9]+' || true)
          BRANCH_ISSUES=$(echo "$BRANCH_NAME" | grep -oE 'issue-?[0-9]+' | grep -oE '[0-9]+' | sed 's/^/#/' || true)
          ISSUES=$(printf "%s\n%s" "$TARGET_ISSUES" "$BRANCH_ISSUES" | grep -E '^#[0-9]+' | sort -u || true)
          # (#1764/#1777 fix) Claims ONLY — mentions are not claims.
          # The removed mention-fallback ("general issue references") turned
          # every `#N` citation in a title/body into a task claim, causing
          # false collisions when an audit or docs PR merely references an issue.
          # U4 forbids duplicate CLAIMS on the same task; a claim is an explicit
          # closing statement or an issue-token branch name.
          if [ -z "$ISSUES" ]; then
            exit 0
          fi
          # Issue-reference comparison, whole-token edition (#120):
          #   - Each OTHER open PR yields a structured record (number, title,
          #     body, headRefName). NO "PR #N:" prefix is injected into the
          #     scanned text — that self-pollution is what made a reference to
          #     issue #10 collide with the literal prefix "PR #108".
          #   - Issue refs are compared as exact tokens: `#<N>` must be
          #     followed by a non-digit or end-of-string, so `#10` never
          #     matches `#108`. The fork-lane branch name is part of the
          #     scanned surface (AGENT_RULES U4): bare digit tokens with
          #     non-digit boundaries there, so `contributor/issue-78` or
          #     `fix/…-78-slug` is detected even with a silent title/body.
          #   - `guard-exempt` escape hatch unchanged (checked above).
          REF_LINES=$(gh pr list --repo "${{ github.repository }}" --state open --json number,title,body,headRefName \
            -q '.[] | select(.number != '"${PR_NUM}"') | [.number, .title, (.body // ""), .headRefName] | @tsv' || true)
          for iss in $ISSUES; do
            iss_num="${iss#"#"}"
            MATCH=""
            while IFS=$'\t' read -r other_num other_title other_body other_branch; do
              [ -z "${other_num}" ] && continue
              # Check if other PR specifically targets or claims this issue
              if printf '%s %s' "${other_title}" "${other_body}" | grep -qiE "(closes|fixes|resolves) #${iss_num}([^0-9]|$)" \
                 || printf '%s' "${other_branch}" | grep -qE "(^|[^0-9])${iss_num}([^0-9]|$)"; then
                MATCH="PR #${other_num} (branch: ${other_branch})"
                break
              fi
            done <<< "${REF_LINES}"
            if [ -n "$MATCH" ]; then
              echo "::error::Competing PR detected! Another open PR already targets $iss."
              echo "Per AGENT_RULES.md U4, duplicate PRs are strictly forbidden."
              echo "Conflicting PR: $MATCH"
              exit 1
            fi
          done
          echo "✅ No competing duplicate PRs detected for: $ISSUES"

  boundary_sanitization_guard:
    name: "🧱 Boundary Sanitization Guard (#107)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.scan.outputs.docs_only }}
      mcp_only: ${{ steps.scan.outputs.mcp_only }}
    steps:
      - name: Checkout repository (content inspection requires file bodies)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Guard self-test (guard-the-guard, offline fixtures)
        run: python3 scripts/ci/boundary_sanitization_guard.py --self-test

      - name: Scan PR changed files (fail-closed on violations)
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          FILES=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json files -q '.files[].path')
          if [ -z "$FILES" ]; then
            echo "::warning::No changed files detected via gh pr view — running full --check instead (fail-closed)."
            exec python3 scripts/ci/boundary_sanitization_guard.py --check
          fi
          echo "Changed files under boundary scan:"
          echo "$FILES"
          # Filter to existing files in checkout (skip deleted files; full-tree audit follows in next step):
          SCAN_FILES=""
          for f in $FILES; do
            if [ -e "$f" ]; then
              SCAN_FILES="$SCAN_FILES $f"
            fi
          done

          if [ -n "$SCAN_FILES" ]; then
            # shellcheck disable=SC2086 — repo paths contain no whitespace
            python3 scripts/ci/boundary_sanitization_guard.py --files $SCAN_FILES
          else
            echo "All changed files were deleted — running full-tree audit instead."
            python3 scripts/ci/boundary_sanitization_guard.py --check
          fi

          # Path-filtered fast path (#155): a diff that touches ONLY docs/**
          # or *.md cannot break compilation or tests — skip the expensive
          # jobs downstream and pass in <5 seconds. Fail-open toward scanning
          # more, never less: any non-doc file clears the flag.
          docs_only=true
          mcp_only=true
          for f in $FILES; do
            case "$f" in
              docs/*|*.md) ;;
              *) docs_only=false ;;
            esac
            case "$f" in
              infrastructure/mcp-control-plane/*) ;;
              *) mcp_only=false ;;
            esac
          done
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "mcp_only=$mcp_only" >> "$GITHUB_OUTPUT"
          echo "fast-path verdict: docs_only=$docs_only mcp_only=$mcp_only"

      - name: Full-tree boundary audit (final fail-closed barrier)
        run: python3 scripts/ci/boundary_sanitization_guard.py --check

  loop_contract_parity_guard:
    name: "🔁 Loop-Contract Parity Guard (#118)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout repository (parity inspects file bodies)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Assert loop-contract SSOT parity (tiers, guards, flag table)
        run: python3 scripts/agents/check_loop_contract_parity.py

  ingress_hook_guard:
    name: "🛡️ Ingress Hook Guard (#161)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout repository (hook body required)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify pre-push guard (exec bit + syntax + offline self-test)
        run: |
          set -euo pipefail
          test -x .githooks/pre-push || { echo "::error::.githooks/pre-push must be executable (git mode 100755) — git silently skips a non-executable hook."; exit 1; }
          bash -n .githooks/pre-push
          sh .githooks/pre-push --self-test
          echo "✅ pre-push guard: exec-bit + bash -n + 5-scenario offline self-test PASS (docs/INGRESS_SECURITY_POLICY.md §5.2)"

  stale_base_guard:
    name: "⏳ Stale-Base Guard (#161)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout repository (full history for merge-base arithmetic)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify PR mergeability against main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "+$BASE:refs/tmp-base" "+$HEAD_SHA:refs/tmp-head"
          BEHIND="$(git rev-list --count refs/tmp-head..refs/tmp-base)"
          if [ "$BEHIND" -gt 0 ]; then
            echo "ℹ️ Branch is $BEHIND commit(s) behind main. Checking mergeability..."
            MERGEABLE=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json mergeable -q .mergeable || echo "UNKNOWN")
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "::error::Branch has merge conflicts with origin/main. Rebase onto latest origin/main."
              exit 1
            fi
            echo "✅ Branch is clean and mergeable without git conflicts ($BEHIND commits behind main). Auto-landing queue will serialize landing."
            exit 0
          fi
          echo "✅ Branch is up to date with main."

  # ---------------------------------------------------------------------------
  # ⚡ Step 1: Fast Lint & Syntax Preflight (<10s, fail-fast across all domains)
  # ---------------------------------------------------------------------------
  fast-lint-syntax-preflight:
    name: "⚡ Step 1: Fast Lint & Syntax Preflight (<10s)"
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Install import-linter (import-contract gate, #1791)
        run: pip install -r requirements-dev.txt
      - name: Run Fast Lint & Syntax Guard
        run: |
          set -euo pipefail
          python3 scripts/ci/deploy_preflight_guard.py --step1-syntax
      - name: Run import-contract guard
        run: |
          set -euo pipefail
          lint-imports
      - name: Evidence Verification Gate (offline self-test)
        run: |
          set -euo pipefail
          python3 scripts/ci/deploy_preflight_guard.py --self-test
      - name: Contract Parity & Byte-Hygiene Guard (fail-closed)
        run: |
          set -euo pipefail
          python3 scripts/ci/contract_parity_guard.py --self-test
          python3 scripts/ci/contract_parity_guard.py --check
      - name: Frontend Code-Splitting & Zero-Blocking Landing Guard
        run: |
          set -euo pipefail
          python3 scripts/ci/frontend_performance_guard.py --self-test
          python3 scripts/ci/frontend_performance_guard.py --check studio/src/App.tsx

  # ---------------------------------------------------------------------------
  # 🧪 Python matrix (3.10–3.13) — the ONLY matrix; private CI pins 3.11 after
  # the shift-left diet because all four versions are proven here first.
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Python ${{ matrix.python-version }} Matrix Smoke & Contract Validation
    needs: [fast-lint-syntax-preflight, boundary_sanitization_guard, loop_contract_parity_guard]
    if: |
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (needs.boundary_sanitization_guard.result == 'success' &&
        needs.loop_contract_parity_guard.result == 'success'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run 3-Tier Verification Contract
        run: |
          python scripts/agents/continuous_agent_loop.py --verify-only

      - name: Run Task Contract & Fail-Closed Unit Tests
        run: |
          python -c "from scripts.agents.continuous_agent_loop import build_task_contract, run_cmd; assert run_cmd(['__missing_binary_test__'])[0] == 127; contract = build_task_contract('ci-test'); assert contract['task_contract']['version'] == 1"
          python -c "from scripts.agents.continuous_agent_loop import build_task_contract; 
          try:
              build_task_contract('fail-test', task_type='INVALID')
              raise AssertionError('Failed to reject invalid task_type')
          except ValueError:
              pass"

      - name: Pick-Next Claim-Filter Contract Test (#88, offline stub)
        run: |
          python -c "
          import json
          import scripts.agents.continuous_agent_loop as loop
          stub = [
              {'number': 101, 'title': 'old unclaimed P1', 'labels': [{'name': 'status:unclaimed'}, {'name': 'P1-high'}]},
              {'number': 102, 'title': 'claimed p0 critical words', 'labels': [{'name': 'status:in-progress'}, {'name': 'P0-critical'}]},
              {'number': 103, 'title': 'held work', 'labels': [{'name': 'status:unclaimed'}, {'name': 'state:seq-hold'}]},
              {'number': 104, 'title': 'unlabeled tail', 'labels': [{'name': 'status:unclaimed'}]}
          ]
          loop.run_cmd = lambda cmd: (0, json.dumps(stub), '')
          picked = loop.pick_next_issue()
          assert picked == '101', f'expected oldest claimable 101, got {picked}'
          stub2 = [
              {'number': 55, 'title': 'totally high-level prose title', 'labels': [{'name': 'status:unclaimed'}]},
              {'number': 66, 'title': 'nothing special', 'labels': [{'name': 'status:unclaimed'}, {'name': 'P0-critical'}]}
          ]
          loop.run_cmd = lambda cmd: (0, json.dumps(stub2), '')
          assert loop.pick_next_issue() == '66', 'real P0 label must outrank prose titles'
          stub3 = [
              {'number': 78, 'title': 'private mirror work', 'labels': [{'name': 'status:unclaimed'}, {'name': 'mirror:private'}, {'name': 'P1-high'}]},
              {'number': 90, 'title': 'public P2 work', 'labels': [{'name': 'status:unclaimed'}, {'name': 'P2-medium'}]}
          ]
          loop.run_cmd = lambda cmd: (0, json.dumps(stub3), '')
          assert loop.pick_next_issue() == '90', 'mirror:private issues are born non-claimable (#122)'
          stub4 = [{'number': 81, 'title': 'only a mirror', 'labels': [{'name': 'status:unclaimed'}, {'name': 'mirror:private'}]}]
          loop.run_cmd = lambda cmd: (0, json.dumps(stub4), '')
          assert loop.pick_next_issue() is None, 'mirror-only board must no-op (#122)'
          assert loop.build_task_contract('ci-test')['task_contract']['version'] == 1
          print('pick-next claim-filter contract: OK (#88, #122)')
          "

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.OPEN_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai-open/dispatches \
            -d "{\"event_type\": \"federation_ci_failed\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"workflow_name\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"html_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit_sha\": \"${{ github.sha }}\"}}" || true


  # ---------------------------------------------------------------------------
  # 🔒 Secrets — runs for every non-guard-failing change, INCLUDING docs-only
  # (documentation can leak credentials too).
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret Scanning
    needs: boundary_sanitization_guard
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.boundary_sanitization_guard.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection (reusable composite action, #155)
        uses: ./.github/actions/gitleaks-scan

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.OPEN_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai-open/dispatches \
            -d "{\"event_type\": \"federation_ci_failed\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"workflow_name\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"html_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit_sha\": \"${{ github.sha }}\"}}" || true


  # ---------------------------------------------------------------------------
  # 🏗️ MCP Control Tower — Node 24 typecheck + contract-safe tests
  # ---------------------------------------------------------------------------
  mcp-tower:
    name: Tower TS Verification (typecheck + contract-safe tests)
    needs: boundary_sanitization_guard
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (needs.boundary_sanitization_guard.result == 'success' && needs.boundary_sanitization_guard.outputs.docs_only != 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "Setup Node — MCP Tower (reusable composite action: node + cache + npm ci + tsc, #155)"
        uses: ./.github/actions/setup-node-tower

      # #86: the live Tower deployment source previously shipped with ZERO
      # TypeScript verification — this gate closes that gap. Runs the
      # credentials-free test set (test:tower-ci); service/credential-dependent
      # suites are tracked in the follow-up issue linked from PR #86.
      - name: Contract-safe Tower test suite
        run: npm run test:tower-ci
        working-directory: infrastructure/mcp-control-plane

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.OPEN_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai-open/dispatches \
            -d "{\"event_type\": \"federation_ci_failed\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"workflow_name\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"html_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit_sha\": \"${{ github.sha }}\"}}" || true


  # ---------------------------------------------------------------------------
  # 📦 SDK — TypeScript client typecheck + tests
  # ---------------------------------------------------------------------------
  sdk-typescript:
    name: SDK TypeScript Verification (typecheck + tests)
    needs: boundary_sanitization_guard
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (needs.boundary_sanitization_guard.result == 'success' && needs.boundary_sanitization_guard.outputs.docs_only != 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check if SDK TypeScript exists
        id: check_sdk_ts
        run: |
          if [ -d "sdk/typescript" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⏩ sdk/typescript not present in transit surface, skipping."
          fi

      - name: Setup Node
        if: steps.check_sdk_ts.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Typecheck SDK
        if: steps.check_sdk_ts.outputs.exists == 'true'
        run: npm run typecheck
        working-directory: sdk/typescript

      - name: Test SDK
        if: steps.check_sdk_ts.outputs.exists == 'true'
        run: npm test
        working-directory: sdk/typescript

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.OPEN_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai-open/dispatches \
            -d "{\"event_type\": \"federation_ci_failed\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"workflow_name\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"html_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit_sha\": \"${{ github.sha }}\"}}" || true

  # ---------------------------------------------------------------------------
  # 🎨 Studio — TypeScript verification (mirrors supremeai-studio CI)
  # ---------------------------------------------------------------------------
  studio-verification:
    name: Studio TypeScript Verification (tsc)
    needs: boundary_sanitization_guard
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (needs.boundary_sanitization_guard.result == 'success' && needs.boundary_sanitization_guard.outputs.docs_only != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check if Studio exists
        id: check_studio
        run: |
          if [ -d "studio" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.check_studio.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        if: steps.check_studio.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Typecheck Studio
        if: steps.check_studio.outputs.exists == 'true'
        run: |
          set -euo pipefail
          cd studio
          pnpm install --frozen-lockfile --prefer-offline || npm ci
          pnpm run typecheck

    # ---------------------------------------------------------------------------
  # 🛬 Autonomous Auto-Landing (Squash-Merge PR on Green Verification)
  # ---------------------------------------------------------------------------
  auto-landing:
    name: "🛬 Autonomous Auto-Landing"
    needs: [branch-naming-guard, claim-guard, boundary_sanitization_guard, test-matrix, secrets-scan, mcp-tower, studio-verification, tower-verification-guard, anti-regression-guard]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: landing-merge-open
      cancel-in-progress: false
    outputs:
      merged: ${{ steps.landing.outputs.merged }}
    steps:
      - name: Autonomous PR Landing
        id: landing
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.OPEN_SYNC_PAT || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "Evaluating PR #${PR_NUM} for autonomous squash-merge..."

          PR_JSON=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json state,isDraft,mergeable,title,body)
          STATE=$(echo "$PR_JSON" | jq -r '.state')
          if [ "$STATE" = "MERGED" ]; then
            echo "PR #${PR_NUM} is already merged."
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #${PR_NUM} is not open (state: $STATE). Skipping landing."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body // ""')

          echo "✅ All verification tests and constitutional guards passed! Executing autonomous squash-merge..."
          gh pr merge "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch \
            --subject "${PR_TITLE} (#${PR_NUM})" \
            --body "${PR_BODY}"

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "🎉 PR #${PR_NUM} successfully merged into main!"

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.OPEN_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai-open/dispatches \
            -d "{\"event_type\": \"federation_ci_failed\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"workflow_name\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"html_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit_sha\": \"${{ github.sha }}\"}}" || true

  # ---------------------------------------------------------------------------
  # 🚀 Transit Dispatch & Satellite Sync (Zero-Residue #416)
  # ---------------------------------------------------------------------------
  satellite-dispatch-and-sync:
    name: "🚀 Transit Dispatch & Satellite Sync"
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_satellite_sync == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Execute Deterministic Direct Synchronization
        env:
          BRIDGE_PUSH_TOKEN: ${{ secrets.BRIDGE_PUSH_TOKEN || secrets.SAT_SYNC_PAT || secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'synchronize federation transit surface' }}
        run: |
          set -euo pipefail
          echo "🚀 Executing deterministic direct synchronization for all changed targets..."
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1)
          python3 scripts/ci/federation_satellite_sync.py \
            --detect-changed \
            --commit-msg "${CLEAN_MSG:-synchronize federation transit surface}" \
            --prune-patches

      - name: Auto-Prune Ephemeral Transit Patches (#416)
        env:
          BRIDGE_PUSH_TOKEN: ${{ secrets.BRIDGE_PUSH_TOKEN || secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PATCH_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^patches/' || true)
          if [ -n "$PATCH_FILES" ]; then
            echo "Found transit patch files to auto-prune:"
            echo "$PATCH_FILES"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if [ -n "${BRIDGE_PUSH_TOKEN}" ]; then
              git remote set-url origin "https://x-access-token:${BRIDGE_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
            fi
            git rm -f $PATCH_FILES
            git commit -m "chore(bridge): auto-prune transit patch after satellite dispatch (Closes #416) [skip ci]" || true
            git push origin main || true
            echo "✅ Ephemeral transit patches successfully auto-pruned."
          fi

      - name: Ingest Knowledge to Supabase and Qdrant
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PR_NUM=$(echo "$COMMIT_MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -n "$PR_NUM" ]; then
            echo "Extracting structured knowledge for PR #${PR_NUM}..."
            python3 scripts/ci/ingest_pr_knowledge.py --pr-num "$PR_NUM" || echo "::warning::Knowledge ingestion encountered a non-fatal issue."
          fi

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.OPEN_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai-open/dispatches \
            -d "{\"event_type\": \"federation_ci_failed\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"workflow_name\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"html_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit_sha\": \"${{ github.sha }}\"}}" || true

  # ---------------------------------------------------------------------------
  # 🤖 Agent loop — cron reconciliation + event-driven intake (#69).
  # Runs ONLY on schedule/workflow_dispatch so a webhook-triggered dispatch
  # never burns matrix minutes. One cycle per tick; the concurrency group
  # serializes ticks and the next scheduled tick continues where this stopped.
  # ---------------------------------------------------------------------------
  agent-loop:
    name: Start continuous_agent_loop.py --pick-next (30-min cadence)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    concurrency:
      # AGENT_RULES.md §12 — single execution under the parent controller.
      # Never run two loop instances concurrently; queue instead of duplicating.
      group: continuous-agent-loop
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Dispatcher verification tier 3 ("YAML/OpenAPI Safe Load") requires
      # PyYAML; actions/setup-python provides a bare Python without it.
      # Without this, tier 3 is recorded skipped/failed in the run evidence.
      - name: Install PyYAML (dispatcher tier-3 verification dependency)
        run: python -m pip install --quiet pyyaml

      # 2-Stage Graduated Claim Lease Gate (Heartbeat Protocol §4 & Two-Tier Architecture):
      # Releases stale claims that produced no push or PR within the TTL lease.
      - name: Smart Stale Claim Expirer (Internal System Watchdog)
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.OPEN_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/agents/claim_ttl_expirer.py --ttl-hours 3 || true
          python scripts/ci/stale_claim_releaser.py --auto-release --claim-to-branch-min 10.0 --branch-to-pr-min 30.0 || true

      # Auto-Bridge PR Opener (Zero-Admin Submission):
      # Automatically converts submitted bridge branches into Pull Requests
      # so CI tests run and Landing Merge Gate can auto-merge them.
      - name: Auto-Bridge PR Opener (Zero-Admin Submission)
        run: |
          set -euo pipefail
          python scripts/ci/auto_bridge_pr_opener.py --auto-open

      # Autonomous Stale Remote Branch Cleaner:
      # Prunes orphan remote branches (closed/rejected PRs, merged PR remnants,
      # and abandoned bridge branches) that have no active open PR.
      - name: Prune Stale Remote Branches
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.OPEN_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ci/cleanup_stale_branches.py || true

      # Autonomous PR & Board Issue Lifecycle Guard:
      # 1. Freshness self-heal: auto-updates stale bot PRs.
      # 2. Re-opens wrongful closures for HOLD_AND_FIX PRs without merged twins.
      # 3. Clean board issues: auto-closes historical sentry passes, old receipts, and duplicate issues.
      - name: Autonomous Board & PR Lifecycle Guard (#janitor)
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.OPEN_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/agents/pr_lifecycle_guard.py --all --apply || true
          python scripts/ci/bridge_landing_watchdog.py --apply || true

      # AGENTS.md §10 — "A job that runs but produces no expected result
      # is actionable when evidence confirms it… No-actionable-finding must be
      # recorded explicitly without creating issue storms." An empty upstream
      # board is a recorded no-op, NOT a red run and NOT a silent skip.
      # #88 + #222: has_work reflects CLAIMABLE work only under the implicit
      # claimable lifecycle — every open issue minus the pick_next_issue()
      # exclusion set — so the cron no-ops when every open issue is claimed,
      # held, blocked or a private mirror. Gating on the legacy
      # status:unclaimed label starves the dispatcher once labels desync
      # (nothing applies that label since #222).
      - name: Board pre-check (explicit no-op on empty or fully-claimed board)
        id: board
        run: |
          set -euo pipefail
          BOARD=$(gh issue list --repo Supremeai-bd/supremeai-open --state open --limit 200 --json number,title,labels)
          # Mirror the pick_next_issue() EXCLUDED_LABELS set exactly (case-insensitive,
          # like the loop's .lower()): claimed, in-progress, seq-hold, blocked, private mirror, anchor-hub.
          CLAIMABLE=$(echo "$BOARD" | jq '[.[] | select((["status:claimed","status:in-progress","state:seq-hold","blocked-by-upstream","mirror:private","anchor-hub","admin-only","bridge:idempotent-noop","bridge:in-gates","bridge:pr-opened","bridge:queued","bridge:rejected"]) as $ex | ([.labels[].name] | map(ascii_downcase)) as $names | ($ex | any(. as $x | $names | index($x))) | not)]')
          echo "claimable-board snapshot: $CLAIMABLE"
          if [ "$CLAIMABLE" = "[]" ]; then
            echo "NO-ACTIONABLE-FINDING: upstream open-issue board is empty — explicit no-op recorded per AGENTS.md §10."
            echo "has_work=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Continuous Agent Loop (existing dispatcher, one cycle)
        if: steps.board.outputs.has_work == 'true'
        run: |
          set -euo pipefail
          ARGS="--pick-next"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto_pr }}" = "true" ]; then
            ARGS="$ARGS --auto-pr"
          fi
          python scripts/agents/continuous_agent_loop.py $ARGS

      # AGENTS.md §10 — scheduled jobs must never silently disappear.
      # #89: real verify-evidence artifact — the --verify-only transcript
      # (ends with the CONTRACT_VERSION parity marker per AGENT_LOOP_SPEC §4b)
      # is captured even when the loop step itself fails (replaces the dead
      # pre-#63 draft-file upload — that writer no longer exists).
      - name: Capture verification evidence (always)
        if: always()
        run: |
          set -o pipefail
          python scripts/agents/continuous_agent_loop.py --verify-only 2>&1 | tee agent-loop-verify-evidence.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-loop-verify-evidence-${{ github.run_id }}
          path: agent-loop-verify-evidence.log
          if-no-files-found: error
          retention-days: 14
