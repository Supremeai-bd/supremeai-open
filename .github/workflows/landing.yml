# =============================================================================
# SupremeAI Open — Unified Autonomous Landing & Bridge Dispatch (#155)
# =============================================================================
# Federation Workflow Diet — public boundary 5 -> 2 workflows.
# Replaces (do NOT re-introduce these files):
#   - merge-gate.yml             (autonomous auto-merge)
#   - auto-bridge-dispatcher.yml (public merge -> private bridge queue)
#
# Zero-Admin Doctrine: Admin manual effort budget <= 0.01%. When all
# constitutional gates and validation tests pass on a Pull Request, this
# workflow autonomously squash-merges it and — in the SAME run — streams the
# landed patch reference into the private monorepo's Bridge Intake.
#
# Why one workflow instead of merge-gate + a called dispatcher (history #113):
#   merges run with GITHUB_TOKEN, and GitHub suppresses the pull_request
#   event for token-driven actions (loop prevention) — so the old dispatcher
#   could not ride `pull_request:closed` for auto-merges, and merge-gate had
#   to fire a cross-workflow `gh workflow run` (workflow_dispatch is a
#   documented exception to the suppression) and then poll for the new run id.
#   Consolidating both phases into one run removes that detour entirely:
#   job ordering inside a run is deterministic, so "merge succeeded, THEN
#   dispatch" is structural (fail-honest: no LANDED comment and no dispatch
#   can happen unless `gh pr merge` actually completed). The backfill channel
#   for USER-token merges is preserved via pull_request:[closed].
#
# Trigger channels (one dispatcher, deterministic — never add a second one):
#   - workflow_run (CI — Open Unified Pipeline, success on pull_request)
#     -> evaluate + land + dispatch (skips on push to main to prevent runner churn)
#   - workflow_dispatch(pr_number)                        -> evaluate + land + dispatch
#     (also the reconciliation channel: an ALREADY-merged PR is dispatched
#      without re-merging — "bridge orders exist only for landed patches")
#   - pull_request:[closed]                               -> dispatch ONLY
#     (fires for merges made with a USER token; token-driven merges are
#      suppressed by GitHub, so no loop is possible)
#
# Patch-streaming design (by-reference, deterministic — preserved from #107):
#   - Public repo readable, তাই private intake শুধু
#     `git fetch https://github.com/Supremeai-bd/supremeai-open.git <bridge_branch>`
#     দিয়ে exact landed patch pull করতে পারে — payload ছোট থাকে, কোনো base64
#     blob সীমা ভাঙে না, আর head SHA সবসময় immutable।
#   - BRIDGE_DISPATCH_TOKEN না থাকলে dispatcher notify-only mode-এ নামে:
#     durable WO issue তবুও file হয় (durable record), শুধু low-latency signal
#     miss হয় — ::warning:: annotation দিয়ে দৃশ্যমাণভাবে লগ হয়, merge
#     automation fail করে না (degradation policy, fail-loud not fail-merge)।
#
# Branch-point doctrine (#113):
#   The patch branch is created from the MERGE COMMIT (merge_commit_sha),
#   never from the PR head SHA. The auto-merge merges with --delete-branch,
#   so by the time this workflow runs the head ref is gone and the head
#   commit object is no longer fetched — `git branch <name> <head_sha>`
#   failed with "not a valid branch point" on 100% of eligible merges
#   (zero sync branches / zero auto work orders ever produced). Both trigger
#   paths check out main AFTER landing, so the merge commit is an ancestor
#   of HEAD and its two parents are reachable through it.
#
# Work Order field list: keep the section names/order aligned with the
# canonical human template in .github/workflows/bridge-work-order.yml
# (Task ID / Patch Branch / Target Repo / Summary / Scope / Evidence /
# Rollback / Identity) — single field vocabulary, two producers.
# =============================================================================

name: Landing — Auto-Merge & Bridge Dispatch

on:
  workflow_run:
    workflows: ["CI — Open Unified Pipeline"]
    types: [completed]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to land (empty = derive from the triggering run / closed PR)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto_merge:
    name: "🛬 Autonomous Auto-Landing"
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # AGENT_RULES.md §12: one merge lock. Serialize landings; never cancel a
    # merge mid-flight (a half-landed state is worse than a queued one).
    concurrency:
      group: landing-merge-open
      cancel-in-progress: false
    outputs:
      pr_number: ${{ steps.target_pr.outputs.pr_number }}
      merged: ${{ steps.evaluate.outputs.merged }}
    steps:
      - name: Determine Target PR
        id: target_pr
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUM=""
          if [ -n "$DISPATCH_PR" ]; then
            PR_NUM="$DISPATCH_PR"
          else
            # Deterministic PR resolution by head commit SHA: works for fork
            # PRs and never confuses reused branch names (the old head-branch
            # match failed on both). The SHA comes from the signed event
            # payload, but validate its format before inlining it into the
            # jq program; ambiguity across multiple open PRs refuses to
            # merge (fail-closed). Ported from merge-gate.yml (#111).
            if ! echo "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Unexpected head SHA format (${HEAD_SHA:-empty}); refusing heuristic PR resolution (fail-closed)."
              echo "has_pr=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            MATCHES=$(gh pr list --repo "${{ github.repository }}" --state open --limit 200 \
              --json number,headRefOid \
              -q "[.[] | select(.headRefOid == \"$HEAD_SHA\") | .number]")
            COUNT=$(echo "$MATCHES" | jq 'length')
            if [ "$COUNT" -gt 1 ]; then
              echo "::error::Ambiguous target: ${COUNT} open PRs share head SHA ${HEAD_SHA}. Refusing to auto-merge (fail-closed)."
              echo "has_pr=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_NUM=$(echo "$MATCHES" | jq -r '.[0] // empty')
          fi

          if [ -z "$PR_NUM" ]; then
            echo "No open PR associated with this run (head SHA: ${HEAD_SHA:-n/a}). Skipping."
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found open PR #${PR_NUM}."
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "has_pr=true" >> "$GITHUB_OUTPUT"

      - name: Evaluate Constitutional Gates & Auto-Merge
        id: evaluate
        if: steps.target_pr.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target_pr.outputs.pr_number }}
        run: |
          echo "Evaluating PR #${PR_NUM} for autonomous auto-merge..."

          # Already-merged reconciliation channel (was the old dispatcher's
          # workflow_dispatch): bridge orders exist only for landed patches,
          # so an already-merged PR is dispatched, never re-merged. Release
          # the dispatch and stop before mergeability polling.
          STATE_NOW=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json state -q '.state')
          if [ "$STATE_NOW" != "OPEN" ]; then
            if [ "$STATE_NOW" = "MERGED" ]; then
              echo "PR #${PR_NUM} is already MERGED — dispatch-only reconciliation."
              echo "merged=dispatch-only" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "PR #${PR_NUM} is not open (state: $STATE_NOW). Skipping."
            exit 0
          fi

          # Mergeability is computed asynchronously by GitHub — UNKNOWN
          # (recompute in flight) must never pass the gate. Poll until a
          # decision exists; give up fail-closed if it never resolves.
          # Ported from merge-gate.yml (#111).
          MERGEABLE="UNKNOWN"
          for attempt in $(seq 1 24); do
            PR_JSON=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json isDraft,mergeable,state)
            if [ "$(echo "$PR_JSON" | jq -r '.state')" != "OPEN" ]; then
              echo "PR #${PR_NUM} is not open. Skipping."
              exit 0
            fi
            if [ "$(echo "$PR_JSON" | jq -r '.isDraft')" = "true" ]; then
              echo "PR #${PR_NUM} is marked as draft. Skipping."
              exit 0
            fi
            MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable')
            if [ "$MERGEABLE" != "UNKNOWN" ]; then break; fi
            sleep 5
          done

          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "::error::PR #${PR_NUM} has merge conflicts. Cannot auto-merge."
            gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "## 🚦 Merge Gate — **BLOCKED**\n\nMerge conflicts detected against \`main\`. Please rebase and resolve conflicts."
            exit 1
          fi
          if [ "$MERGEABLE" = "UNKNOWN" ]; then
            echo "::error::PR #${PR_NUM} mergeability stayed UNKNOWN after polling — refusing to merge on unknown state (fail-closed)."
            exit 1
          fi

          # The race fix: wait for EVERY check on the PR head to reach a
          # terminal state and fail on any failure. The triggering CI run is
          # already green at this point; this covers the separately-triggered
          # guard jobs that a snapshot could not see while pending.
          # Ported from merge-gate.yml (#111).
          if ! gh pr checks "$PR_NUM" --repo "${{ github.repository }}" --watch --fail-fast --interval 15; then
            echo "::error::PR #${PR_NUM} checks are failing or incomplete — landing held (fail-closed)."
            exit 1
          fi

          echo "✅ All checks green! Executing autonomous squash-merge..."

          # Fail-honest merge: the exit code gates everything downstream. A
          # "LANDED" comment plus a bridge dispatch fired after a failed
          # merge desynchronizes the bridge channel (the dispatcher then
          # hard-fails on state != MERGED). Hold both until the merge
          # actually completes.

          # Squash semantics that preserve issue auto-close (#220): repo
          # doctrine puts "Closes #N" in the PR title / PR description /
          # commit message, but GitHub only processes closing keywords from
          # the FINAL squash commit message — and the previously hardcoded
          # subject ("Auto-merged PR #N via Merge Gate") dropped them
          # (evidence: #161/#98/#214 stayed open after #207/#212/#215
          # landed). Derive GitHub-default squash fields from live PR data;
          # on any fetch failure fall back to the previous hardcoded subject
          # so a metadata outage can never block a landing (fail-safe).
          PR_SUBJECT="$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json title -q .title 2>/dev/null || true)"
          PR_BODY="$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)"
          [ -n "$PR_SUBJECT" ] || PR_SUBJECT="Auto-merged PR #${PR_NUM} via Merge Gate"

          MERGE_ARGS=(--squash --delete-branch --subject "${PR_SUBJECT} (#${PR_NUM})")
          if [ -n "$PR_BODY" ]; then MERGE_ARGS+=(--body "$PR_BODY"); fi

          if ! gh pr merge "$PR_NUM" \
            --repo "${{ github.repository }}" \
            "${MERGE_ARGS[@]}"; then
            echo "Standard gh pr merge failed — attempting with --admin fallback..."
            if ! gh pr merge "$PR_NUM" \
              --repo "${{ github.repository }}" \
              --admin \
              "${MERGE_ARGS[@]}"; then
              echo "::error::gh pr merge failed for PR #${PR_NUM} — landing comment and bridge dispatch held."
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

          # Post landing comment
          gh pr comment "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --body "## 🚦 Merge Gate — **LANDED** ✓\n\n- PR #${PR_NUM} met all constitutional gate contracts.\n- Auto-merged autonomously into \`main\` (Zero-Admin Policy, Admin Effort <= 0.01%).\n- Bridge dispatch continues in the same run (🌉 job)."

          echo "✅ PR #${PR_NUM} successfully auto-merged."

  bridge-dispatch:
    name: "🌉 Bridge Work Order — Public Merge → Private Bridge Queue"
    needs: auto_merge
    # Dispatch when: (a) this run merged the PR or is reconciling an
    # already-merged one, or (b) a USER-token merge closed the PR (the
    # suppressed pull_request event never fires for token-driven merges, so
    # there is no loop risk in either branch). Never dispatch for bridge/*
    # branches (loop prevention) — same rule as the old dispatcher.
    if: |
      needs.auto_merge.outputs.merged == 'true' ||
      needs.auto_merge.outputs.merged == 'dispatch-only' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'bridge/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # E4 dedup race (preserved from #169-era doctrine): serialize dispatches
    # for the same PR and never cancel mid-run — a cancelled run could push
    # the patch branch without writing the dedup marker, and the next run
    # would then false-reject as a duplicate.
    concurrency:
      group: landing-bridge-${{ needs.auto_merge.outputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect touched files
        id: check_scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Resolved for ALL trigger channels: this run's merged/reconciled PR
          # number (needs output) or the closed PR's number (event context).
          PR_NUM: ${{ needs.auto_merge.outputs.pr_number || github.event.pull_request.number }}
          # Inputs pass through env — never interpolated into the shell
          # (workflow_dispatch inputs are free text and fated for a shell).
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          # Untrusted event payload (PR title is attacker-controlled free
          # text) — pass through env, never interpolate into the shell body.
          # The old dispatcher carried this injection vector inline; the #155
          # consolidation fixes it rather than inheriting it.
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_PR_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUM="$DISPATCH_PR"
            case "$PR_NUM" in
              ''|*[!0-9]*)
                echo "::error::pr_number input is empty or non-numeric — refusing to resolve a PR."
                exit 1
                ;;
            esac
          fi

          # Channel resolution:
          #   pull_request (USER-token merge) -> the event payload is complete.
          #   workflow_dispatch / workflow_run (auto-merge and the dispatch-only
          #     reconciliation channel) -> resolve via the API: workflow_run
          #     carries NO pull_request payload, so the event-value path left
          #     PR_SHA empty and hard-failed "merge commit unavailable" on the
          #     first live reconciliation run (PR #184). Both API-path channels
          #     also re-check state != MERGED and bridge/ loop prevention.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Processing merged PR #${PR_NUM} (pull_request channel)..."
            PR_TITLE="$EVENT_PR_TITLE"
            PR_SHA="$EVENT_PR_SHA"
            PR_HEAD_SHA="$EVENT_PR_HEAD_SHA"
            BASE_SHA="$EVENT_PR_BASE_SHA"
          else
            echo "Processing landed PR #${PR_NUM} (API resolution)..."
            PR_JSON=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json title,mergeCommit,baseRefOid,headRefOid,headRefName,state)
            STATE=$(echo "$PR_JSON" | jq -r '.state')
            if [ "$STATE" != "MERGED" ]; then
              echo "::error::PR #${PR_NUM} is not merged (state: $STATE) — bridge orders exist only for landed patches."
              exit 1
            fi
            HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
            if [[ "$HEAD_REF" =~ ^bridge/ ]]; then
              echo "PR #${PR_NUM} came from a bridge branch ($HEAD_REF) — loop prevention, skipping."
              exit 0
            fi
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
            PR_SHA=$(echo "$PR_JSON" | jq -r '.mergeCommit.oid')
            PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
            BASE_SHA=$(echo "$PR_JSON" | jq -r '.baseRefOid')
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "null" ]; then
              # gh without baseRefOid: REST fallback (base.sha is a reachable
              # recorded base head — diff pair stays valid).
              BASE_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" -q '.base.sha')
            fi
          fi

          if [ -z "$PR_SHA" ] || [ "$PR_SHA" = "null" ]; then
            echo "::error::merge commit for PR #${PR_NUM} unavailable — cannot anchor the patch branch."
            exit 1
          fi

          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "pr_sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          # Get list of files touched in this PR
          FILES=$(git diff --name-only "$BASE_SHA" "$PR_SHA")
          echo "Touched files:"
          echo "$FILES"

          # Map touched files and PR labels to the 12 target federation repositories
          TARGET_REPOS=()

          # 1. Resolve target repository from PR labels if present
          PR_LABELS=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json labels -q '.labels[].name' 2>/dev/null || true)
          for lbl in $PR_LABELS; do
            case "$lbl" in
              repo:studio) TARGET_REPOS+=("Supremeai-bd/supremeai-studio") ;;
              repo:api) TARGET_REPOS+=("Supremeai-bd/supremeai-api") ;;
              repo:core) TARGET_REPOS+=("Supremeai-bd/supremeai-core") ;;
              repo:command) TARGET_REPOS+=("Supremeai-bd/supremeai-command") ;;
              repo:skills) TARGET_REPOS+=("Supremeai-bd/supremeai-skills") ;;
              repo:vscode) TARGET_REPOS+=("Supremeai-bd/supremeai-vscode") ;;
              repo:agents) TARGET_REPOS+=("Supremeai-bd/supremeai-agents") ;;
              repo:browser) TARGET_REPOS+=("Supremeai-bd/supremeai-browser") ;;
              repo:sdk) TARGET_REPOS+=("Supremeai-bd/supremeai-sdk") ;;
              repo:infra) TARGET_REPOS+=("Supremeai-bd/supremeai-infrastructure") ;;
              repo:mcp) TARGET_REPOS+=("Supremeai-bd/supremeai-mcp-control-plane") ;;
              repo:archive) TARGET_REPOS+=("Supremeai-bd/supremeai-archive") ;;
              repo:monorepo) TARGET_REPOS+=("Supremeai-bd/supremeai") ;;
            esac
          done

          # 2. Resolve target repository from files touched (Domain Routing)
          for f in $FILES; do
            case "$f" in
              studio/*|examples/dashboard-preview/*|api-schemas/dashboard.*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-studio")
                ;;
              api/*|gateway/*|api-schemas/gateway.*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-api")
                ;;
              core/*|api-schemas/task-router.*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-core")
                ;;
              command/*|handlers/telegram*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-command")
                ;;
              skills/*|examples/langchain-*|examples/vercel-*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-skills")
                ;;
              vscode/*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-vscode")
                ;;
              agents/*|runner/*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-agents")
                ;;
              browser/*|sandbox/*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-browser")
                ;;
              sdk/*|examples/sdk-*|api-schemas/telemetry-log.*|api-schemas/websocket-events.*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-sdk")
                ;;
              infrastructure/mcp-control-plane/*|api-schemas/heartbeat.*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-mcp-control-plane")
                ;;
              deployments/*|infra/*)
                TARGET_REPOS+=("Supremeai-bd/supremeai-infrastructure")
                ;;
              scripts/agents/*|docs/*|AGENTS.md|AGENT_RULES.md|ECOSYSTEM_MAP.md|api-schemas/*|patches/*)
                TARGET_REPOS+=("Supremeai-bd/supremeai")
                ;;
            esac
          done

          # Central monorepo Supremeai-bd/supremeai always receives synchronization
          TARGET_REPOS+=("Supremeai-bd/supremeai")

          # Deduplicate target repos
          UNIQUE_TARGETS=$(printf "%s\n" "${TARGET_REPOS[@]}" | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          echo "Resolved Target Repositories: $UNIQUE_TARGETS"
          echo "target_repos=$UNIQUE_TARGETS" >> "$GITHUB_OUTPUT"
          echo "should_bridge=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Preflight & Render Quota Verification (Step 2 & Step 3)
        if: steps.check_scope.outputs.should_bridge == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY_1 }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_API_KEY_5: ${{ secrets.RENDER_API_KEY_5 || secrets.RENDER_API_KEY_API }}
          BRIDGE_DISPATCH_TOKEN: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
        run: |
          echo "Running Step 2 (Secrets & Tokens Presence) and Step 3 (Render Account Quota <450m)..."
          python3 scripts/ci/deploy_preflight_guard.py --step2-secrets || true
          python3 scripts/ci/render_build_quota_guard.py --all --threshold 450 || true

      - name: Create Bridge Branch
        id: create_wo
        if: steps.check_scope.outputs.should_bridge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.check_scope.outputs.pr_num }}
          PR_TITLE: ${{ steps.check_scope.outputs.pr_title }}
          PR_SHA: ${{ steps.check_scope.outputs.pr_sha }}
          BASE_SHA: ${{ steps.check_scope.outputs.base_sha }}
          BRIDGE_PUSH_TOKEN: ${{ secrets.MERGE_PAT }}
        run: |
          DATE_STR=$(git show -s --format=%cd --date=format:%Y%m%d "${PR_SHA}" 2>/dev/null || true)
          if [ -z "$DATE_STR" ]; then
            DATE_STR=$(date +%Y%m%d)
          fi
          TASK_ID="bridge-${DATE_STR}-pr${PR_NUM}-sync"
          BRANCH_NAME="bridge/${TASK_ID}"

          echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          if ! git cat-file -e "${PR_SHA}^{commit}" 2>/dev/null; then
            echo "::error::merge commit ${PR_SHA} absent from checkout — dispatch likely raced the merge landing on main. Re-dispatch."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$BRIDGE_PUSH_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${BRIDGE_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          fi

          # Create and push bridge patch branch
          git branch -f "${BRANCH_NAME}" "${PR_SHA}"
          git push origin "${BRANCH_NAME}"
          echo "✅ Bridge branch ${BRANCH_NAME} pushed successfully. Streaming via Webhook/Dispatch (zero issue spam)."

      - name: Stream landed patch reference via Webhook / Bridge Intake (#107)
        if: steps.check_scope.outputs.should_bridge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIDGE_DISPATCH_TOKEN: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
          BRIDGE_WEBHOOK_URL: ${{ secrets.BRIDGE_WEBHOOK_URL }}
          PR_NUM: ${{ steps.check_scope.outputs.pr_num }}
          PR_TITLE: ${{ steps.check_scope.outputs.pr_title }}
          PR_SHA: ${{ steps.check_scope.outputs.pr_sha }}
          PR_HEAD_SHA: ${{ steps.check_scope.outputs.pr_head_sha }}
          BASE_SHA: ${{ steps.check_scope.outputs.base_sha }}
          TASK_ID: ${{ steps.create_wo.outputs.task_id }}
          BRANCH_NAME: ${{ steps.create_wo.outputs.branch_name }}
          TARGET_REPOS: ${{ steps.check_scope.outputs.target_repos }}
        run: |
          export FILES_RAW="$(git diff --name-only "${BASE_SHA}" "${PR_SHA}")"
          PAYLOAD=$(python3 - <<'PYEOF'
          import json, os
          files = [f for f in os.environ.get("FILES_RAW", "").splitlines() if f.strip()]
          payload = {
              "event_kind": "bridge.order.queued",
              "source_repo": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ["PR_NUM"]),
              "pr_title": os.environ["PR_TITLE"],
              "task_id": os.environ["TASK_ID"],
              "bridge_branch": os.environ["BRANCH_NAME"],
              "merge_sha": os.environ["PR_SHA"],
              "base_sha": os.environ["BASE_SHA"],
              "files": files[:100],
          }
          print(json.dumps({"event_type": "bridge_order_queued", "client_payload": payload}))
          PYEOF
          )

          if [ -z "$PAYLOAD" ]; then
            echo "::error::dispatch payload build failed — refusing to POST an empty body."
            exit 1
          fi

          # 1. Stream directly to Webhook (MCP Tower / Bridge Ingress)
          if [ -n "${BRIDGE_WEBHOOK_URL}" ]; then
            echo "Streaming patch event to Webhook: ${BRIDGE_WEBHOOK_URL}..."
            HTTP_WH=$(curl -s -o /tmp/webhook_resp.txt -w "%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              -H "User-Agent: SupremeAI-Bridge-Webhook/1.0" \
              -H "X-GitHub-Event: bridge_order_queued" \
              "${BRIDGE_WEBHOOK_URL}" \
              -d "${PAYLOAD}" || true)
            echo "Bridge Webhook returned HTTP ${HTTP_WH}"
          fi

          # 2. Durable Bridge Work Order issue (the missing link). Satellite repos do
          #    not ship a repository_dispatch receiver, so a bare HTTP 204 dispatch
          #    is silently dropped and never applies the patch. Instead, file a
          #    bridge:queued Work Order in this repo — the central bridge bot and
          #    the MCP tower (bridge_list_work_orders) consume that label and apply
          #    the landed patch to every resolved satellite. This is the reliable,
          #    durable trigger; the curl dispatch below is kept only as an optional
          #    low-latency signal.
          # 2. Durable Bridge Work Order issues (auto-split by target repo).
          #    Satellite repos do not ship a repository_dispatch receiver, so a
          #    bare HTTP 204 dispatch is silently dropped and never applies the
          #    patch. Instead, file one bridge:queued Work Order per resolved
          #    target repo, each carrying only that repo's file subset (bridge v2
          #    single-target rule: "one order per target"). The central bridge bot
          #    and the MCP tower (bridge_list_work_orders) consume the label and
          #    apply the landed patch to each satellite. This is the reliable,
          #    durable trigger; the curl dispatch below is kept only as an
          #    optional low-latency signal.
          python3 - "$TASK_ID" "$BRANCH_NAME" "$PR_NUM" "$PR_TITLE" "$FILES_RAW" "$TARGET_REPOS" <<'PYEOF'
          import os, subprocess, sys

          task_id, branch, pr_num, title = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          files = [f for f in sys.argv[5].splitlines() if f.strip()]
          targets = [t for t in sys.argv[6].split() if t.strip()]

          def route(f):
              out = set()
              if f.startswith("studio/") or f.startswith("examples/dashboard-preview/") or f.startswith("api-schemas/dashboard."):
                  out.add("Supremeai-bd/supremeai-studio")
              if f.startswith("api/") or f.startswith("gateway/") or f.startswith("api-schemas/gateway."):
                  out.add("Supremeai-bd/supremeai-api")
              if f.startswith("core/") or f.startswith("api-schemas/task-router."):
                  out.add("Supremeai-bd/supremeai-core")
              if f.startswith("command/") or f.startswith("handlers/telegram"):
                  out.add("Supremeai-bd/supremeai-command")
              if f.startswith("skills/") or f.startswith("examples/langchain-") or f.startswith("examples/vercel-"):
                  out.add("Supremeai-bd/supremeai-skills")
              if f.startswith("vscode/"):
                  out.add("Supremeai-bd/supremeai-vscode")
              if f.startswith("agents/") or f.startswith("runner/"):
                  out.add("Supremeai-bd/supremeai-agents")
              if f.startswith("browser/") or f.startswith("sandbox/"):
                  out.add("Supremeai-bd/supremeai-browser")
              if f.startswith("sdk/") or f.startswith("examples/sdk-") or f.startswith("api-schemas/telemetry-log.") or f.startswith("api-schemas/websocket-events."):
                  out.add("Supremeai-bd/supremeai-sdk")
              if f.startswith("infrastructure/mcp-control-plane/") or f.startswith("api-schemas/heartbeat."):
                  out.add("Supremeai-bd/supremeai-mcp-control-plane")
              if f.startswith("deployments/") or f.startswith("infra/"):
                  out.add("Supremeai-bd/supremeai-infrastructure")
              # central monorepo receives everything (umbrella)
              out.add("Supremeai-bd/supremeai")
              return out

          # group files by target
          groups = {t: [] for t in targets}
          for f in files:
              for t in route(f):
                  if t in groups:
                      groups[t].append(f)
          # central always gets the full file list
          if "Supremeai-bd/supremeai" in groups:
              groups["Supremeai-bd/supremeai"] = list(files)

          ANCHOR_MAP = {
              "Supremeai-bd/supremeai-studio": 749,
              "Supremeai-bd/supremeai-api": 750,
              "Supremeai-bd/supremeai-core": 751,
              "Supremeai-bd/supremeai-command": 752,
              "Supremeai-bd/supremeai-skills": 753,
              "Supremeai-bd/supremeai-vscode": 754,
              "Supremeai-bd/supremeai-agents": 755,
              "Supremeai-bd/supremeai-browser": 756,
              "Supremeai-bd/supremeai-sdk": 757,
              "Supremeai-bd/supremeai-infrastructure": 758,
              "Supremeai-bd/supremeai-mcp-control-plane": 759,
              "Supremeai-bd/supremeai-archive": 760,
              "Supremeai-bd/supremeai": 761,
              "Supremeai-bd/supremeai-open": 762,
          }

          for target in targets:
              tfiles = groups.get(target, [])
              if not tfiles:
                  continue
              slug = target.split("/")[-1]
              scope = "\n".join(f"- {f}" for f in tfiles)

              # Dedup check: skip if an order for this task and target already exists
              try:
                  check_dup = subprocess.run(
                      ["gh", "issue", "list", "--repo", os.environ["GITHUB_REPOSITORY"],
                       "--state", "all", "--search", f'"{task_id}" "{slug}" in:title', "--json", "number"],
                      capture_output=True, text=True, check=False,
                  )
                  if check_dup.returncode == 0 and check_dup.stdout.strip() not in ("", "[]"):
                      print("⏩ Bridge work order for " + slug + " (" + task_id + ") already exists. Skipping duplicate.")
                      continue
              except Exception:
                  pass

              # When multiple federation targets are touched, create an isolated slice branch
              # per satellite so that `git diff origin/main...origin/<branch>` only contains
              # changes belonging to this target (bridge v2 single-target routing rule).
              target_branch = branch
              if len(targets) > 1 and target != "Supremeai-bd/supremeai":
                  slice_branch = f"bridge/{task_id}-{slug}"
                  try:
                      base_sha = os.environ.get("BASE_SHA")
                      pr_sha = os.environ.get("PR_SHA")
                      subprocess.run(["git", "checkout", "-B", slice_branch, base_sha], check=True, capture_output=True)
                      subprocess.run(["git", "checkout", pr_sha, "--"] + tfiles, check=True, capture_output=True)
                      subprocess.run(["git", "commit", "--no-verify", "-m", f"bridge({task_id}-{slug}): slice for {slug}"], check=True, capture_output=True)
                      subprocess.run(["git", "push", "-f", "origin", slice_branch], check=True, capture_output=True)
                      subprocess.run(["git", "checkout", "main"], check=False, capture_output=True)
                      target_branch = slice_branch
                      print("✅ Pushed slice branch " + slice_branch + " for " + slug)
                  except Exception as exc:
                      print("::warning::slice branch creation failed for " + slug + ": " + str(exc))
                      target_branch = branch

              BRIDGE_HUB_ANCHOR = 760
              domain_anchor = ANCHOR_MAP.get(target)
              parent_section = f"\n\n### Parent Anchor Hub\nBridge Hub: #{BRIDGE_HUB_ANCHOR} | Domain Hub: #{domain_anchor}"

              body = (
                  "### Task ID\n" + task_id + "-" + slug + "\n\n"
                  "### Patch Branch\n" + target_branch + "\n\n"
                  "### Target Repository\n" + target + "\n\n"
                  "### Agent Identity\nlanding.yml (auto) — PR #" + pr_num + "\n\n"
                  "### Summary (what + why)\n" + title + " (satellite slice: " + slug + ")\n\n"
                  "### Scope Paths\n" + scope + "\n\n"
                  "### Test Evidence (3-tier contract)\n"
                  "Automated: landing.yml gates (CI — Open Unified Pipeline) green; merge squashed into main.\n\n"
                  "### Rollback Path\n- [x] git revert-safe (pure code change; zero migration/config side effects)"
                  + parent_section + "\n"
              )
              body_path = "/tmp/bridge_wo_" + slug + ".md"
              with open(body_path, "w", encoding="utf-8") as fh:
                  fh.write(body)
              issue_title = "Bridge Work Order — " + title + " (" + task_id + ") [target: " + slug + "]"
              header = "## 🌉 " + issue_title + "\n\n"
              with open(body_path, "w", encoding="utf-8") as fh:
                  fh.write(header + body)
              cmd = [
                  "gh", "issue", "comment", str(BRIDGE_HUB_ANCHOR),
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--body-file", body_path
              ]

              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, check=False)
                  if r.returncode == 0:
                      print("✅ " + slug + " -> Logged inside Bridge Hub #" + str(BRIDGE_HUB_ANCHOR))
                  else:
                      print("::warning::bridge order comment failed for " + slug + ": " + r.stderr.strip())
              except Exception as exc:  # noqa: BLE001
                  print("::warning::bridge order exception for " + slug + ": " + str(exc))
          PYEOF

          # 3. Optional low-latency signal (best-effort; satellites may ignore it)
          if [ -n "${BRIDGE_DISPATCH_TOKEN}" ]; then
            for TARGET in ${TARGET_REPOS}; do
              echo "Dispatching bridge_order_queued → ${TARGET} (best-effort)..."
              HTTP=$(curl -s -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${BRIDGE_DISPATCH_TOKEN}" \
                "https://api.github.com/repos/${TARGET}/dispatches" \
                -d "${PAYLOAD}" || true)
              echo "  ${TARGET} → HTTP ${HTTP:-n/a}"
            done
          fi

      - name: Direct Federation Satellite & Monorepo Synchronization
        if: steps.check_scope.outputs.should_bridge == 'true'
        env:
          BRIDGE_PUSH_TOKEN: ${{ secrets.BRIDGE_PUSH_TOKEN || secrets.SAT_SYNC_PAT || secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPOS: ${{ steps.check_scope.outputs.target_repos }}
          PR_TITLE: ${{ steps.check_scope.outputs.pr_title }}
          PR_NUM: ${{ steps.check_scope.outputs.pr_num }}
        run: |
          echo "🚀 Executing deterministic direct synchronization for: ${TARGET_REPOS}"
          python3 scripts/ci/federation_satellite_sync.py \
            --targets ${TARGET_REPOS} \
            --commit-msg "${PR_TITLE} (via PR #${PR_NUM})" \
            --prune-patches

