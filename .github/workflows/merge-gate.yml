# =============================================================================
# SupremeAI Open — Merge Gate (Autonomous Auto-Merge Doctrine)
# =============================================================================
# Zero-Admin Doctrine: Admin manual effort budget <= 0.01%.
# When all constitutional gates and validation tests pass on a Pull Request:
#   1. Open Guards (Branch Naming, Issue Reference, Anti-Duplicate Guard)
#   2. CI Multi-Platform Python Matrix (3.10 - 3.13)
#   3. Secret Scanning (Gitleaks)
# This workflow automatically executes squash-merge and deletes the branch.
#
# Race-free by construction (#111): the previous gate snapshotted check
# conclusions and merged whenever no FAIL/TIMED_OUT was visible — checks that
# were still queued/in_progress (the three pull_request guard jobs run on a
# separate trigger) were invisible to it, and a `mergeable: UNKNOWN` passed.
# This version (a) resolves the PR deterministically from the run's head SHA
# (fork-safe, no head-branch string matching), (b) polls mergeability until a
# decision exists (UNKNOWN never passes — fail-closed), and (c) waits for
# EVERY check on the PR head to reach a terminal state via
# `gh pr checks --watch --fail-fast` before merging.
#
# Because merges run with GITHUB_TOKEN, GitHub suppresses the pull_request
# event (loop prevention) — so immediately after landing, this workflow calls
# `gh workflow run auto-bridge-dispatcher.yml` (workflow_dispatch is a
# documented exception to the suppression) to sync the landed patch into the
# private monorepo. See #113.
# =============================================================================

name: 🚦 Merge Gate (Autonomous Auto-Merge)

on:
  workflow_run:
    workflows: ["CI — Open Multi-Platform Validation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate and auto-merge (optional)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: merge-gate-open
  cancel-in-progress: false

jobs:
  auto-merge:
    name: "🛬 Autonomous Auto-Landing"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    steps:
      - name: Determine Target PR
        id: target_pr
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUM=""
          if [ -n "$DISPATCH_PR" ]; then
            PR_NUM="$DISPATCH_PR"
          else
            # Deterministic PR resolution by head commit SHA: works for fork
            # PRs and never confuses reused branch names (the old head-branch
            # match failed on both). The SHA comes from the signed event
            # payload, but validate its format before inlining it into the
            # jq program; ambiguity across multiple open PRs refuses to
            # merge (fail-closed).
            if ! echo "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Unexpected head SHA format (${HEAD_SHA:-empty}); refusing heuristic PR resolution (fail-closed)."
              echo "has_pr=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            MATCHES=$(gh pr list --repo "${{ github.repository }}" --state open --limit 200 \
              --json number,headRefOid \
              -q "[.[] | select(.headRefOid == \"$HEAD_SHA\") | .number]")
            COUNT=$(echo "$MATCHES" | jq 'length')
            if [ "$COUNT" -gt 1 ]; then
              echo "::error::Ambiguous target: ${COUNT} open PRs share head SHA ${HEAD_SHA}. Refusing to auto-merge (fail-closed)."
              echo "has_pr=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_NUM=$(echo "$MATCHES" | jq -r '.[0] // empty')
          fi

          if [ -z "$PR_NUM" ]; then
            echo "No open PR associated with this run (head SHA: ${HEAD_SHA:-n/a}). Skipping."
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found open PR #${PR_NUM}."
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "has_pr=true" >> "$GITHUB_OUTPUT"

      - name: Evaluate Constitutional Gates & Auto-Merge
        id: evaluate
        if: steps.target_pr.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target_pr.outputs.pr_number }}
        run: |
          echo "Evaluating PR #${PR_NUM} for autonomous auto-merge..."

          # Mergeability is computed asynchronously by GitHub — UNKNOWN
          # (recompute in flight) must never pass the gate. Poll until a
          # decision exists; give up fail-closed if it never resolves.
          MERGEABLE="UNKNOWN"
          for attempt in $(seq 1 24); do
            PR_JSON=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json isDraft,mergeable,state)
            if [ "$(echo "$PR_JSON" | jq -r '.state')" != "OPEN" ]; then
              echo "PR #${PR_NUM} is not open. Skipping."
              exit 0
            fi
            if [ "$(echo "$PR_JSON" | jq -r '.isDraft')" = "true" ]; then
              echo "PR #${PR_NUM} is marked as draft. Skipping auto-merge."
              exit 0
            fi
            MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable')
            if [ "$MERGEABLE" != "UNKNOWN" ]; then break; fi
            sleep 5
          done

          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "::error::PR #${PR_NUM} has merge conflicts. Cannot auto-merge."
            gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "## 🚦 Merge Gate — **BLOCKED**\n\nMerge conflicts detected against \`main\`. Please rebase and resolve conflicts."
            exit 1
          fi
          if [ "$MERGEABLE" = "UNKNOWN" ]; then
            echo "::error::PR #${PR_NUM} mergeability stayed UNKNOWN after polling — refusing to merge on unknown state (fail-closed)."
            exit 1
          fi

          # The race fix: wait for EVERY check on the PR head to reach a
          # terminal state and fail on any failure. The triggering CI run is
          # already green at this point; this covers the separately-triggered
          # guard jobs that the old snapshot could not see while pending.
          if ! gh pr checks "$PR_NUM" --repo "${{ github.repository }}" --watch --fail-fast --interval 15; then
            echo "::error::PR #${PR_NUM} checks are failing or incomplete — landing held (fail-closed)."
            exit 1
          fi

          echo "✅ All checks green! Executing autonomous squash-merge..."

          # Fail-honest merge: the exit code gates everything downstream. A
          # "LANDED" comment plus a bridge dispatch fired after a failed
          # merge desynchronizes the bridge channel (the dispatcher then
          # hard-fails on state != MERGED). Hold both until the merge
          # actually completes.
          if ! gh pr merge "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch \
            --subject "Auto-merged PR #${PR_NUM} via Merge Gate"; then
            echo "::error::gh pr merge failed for PR #${PR_NUM} — landing comment and bridge dispatch held."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

          # Post landing comment
          gh pr comment "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --body "## 🚦 Merge Gate — **LANDED** ✓\n\n- PR #${PR_NUM} met all constitutional gate contracts.\n- Auto-merged autonomously into \`main\` (Zero-Admin Policy, Admin Effort <= 0.01%)."

          echo "✅ PR #${PR_NUM} successfully auto-merged."

      - name: Bridge Dispatch — trigger auto-bridge-dispatcher (#113)
        if: steps.evaluate.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target_pr.outputs.pr_number }}
        run: |
          # GitHub suppresses pull_request events for merges performed with
          # GITHUB_TOKEN (loop prevention) — the dispatcher can no longer
          # ride pull_request:closed. workflow_dispatch is a documented
          # exception, so we trigger the single dispatcher directly after
          # every landing merge, then verify the run was actually created:
          # a silently dropped trigger means zero patch branch and zero
          # work order (exactly the failure mode that froze the bridge).
          echo "🌉 PR #${PR_NUM} landed — triggering auto-bridge-dispatcher (Zero-Admin Policy)..."
          # Run ids are monotonically increasing per repo — compare ids, not
          # timestamps (runner clock vs GitHub API clock skew would make a
          # ts comparison false-negative on every dispatch).
          BEFORE_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/auto-bridge-dispatcher.yml/runs?per_page=1" \
            -q '.workflow_runs[0].id // 0' 2>/dev/null || echo 0)

          if ! gh workflow run auto-bridge-dispatcher.yml \
            --repo "${{ github.repository }}" \
            -f pr_number="$PR_NUM"; then
            echo "::warning::workflow_dispatch call failed for PR #${PR_NUM} — no bridge sync will occur automatically; re-dispatch manually."
            exit 0
          fi

          CONFIRMED="false"
          for attempt in $(seq 1 12); do
            sleep 5
            NEW_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/auto-bridge-dispatcher.yml/runs?event=workflow_dispatch&per_page=5" \
              -q "[.workflow_runs[] | select(.id > ${BEFORE_ID})] | .[0].id // empty" 2>/dev/null || true)
            if [ -n "$NEW_ID" ]; then
              CONFIRMED="true"
              echo "auto-bridge-dispatcher run ${NEW_ID} created."
              break
            fi
            echo "Waiting for dispatcher run to appear (attempt ${attempt}/12)..."
          done

          if [ "$CONFIRMED" = "true" ]; then
            echo "✅ auto-bridge-dispatcher run confirmed for PR #${PR_NUM} — patch branch + work order landing in the private queue."
          else
            echo "::warning::auto-bridge-dispatcher run not observed within 60s — trigger accepted but unverified; re-dispatch manually if no work order appears."
          fi
