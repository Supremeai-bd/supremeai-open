name: CI — Open Multi-Platform Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Python ${{ matrix.python-version }} Matrix Smoke & Contract Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run 3-Tier Verification Contract
        run: |
          python scripts/agents/continuous_agent_loop.py --verify-only

      - name: Run Task Contract & Fail-Closed Unit Tests
        run: |
          python -c "from scripts.agents.continuous_agent_loop import build_task_contract, run_cmd; assert run_cmd(['__missing_binary_test__'])[0] == 127; contract = build_task_contract('ci-test'); assert contract['task_contract']['version'] == 1"
          python -c "from scripts.agents.continuous_agent_loop import build_task_contract; 
          try:
              build_task_contract('fail-test', task_type='INVALID')
              raise AssertionError('Failed to reject invalid task_type')
          except ValueError:
              pass"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Secret Detection
        run: gitleaks detect --source=. --verbose --redact
