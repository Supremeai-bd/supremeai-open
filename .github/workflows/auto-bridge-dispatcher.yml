# =============================================================================
# SupremeAI Open — Autonomous Bridge Work Order Dispatcher (Zero-Admin Policy)
# =============================================================================
# Renamed from auto-bridge-order.yml by #107 (same single dispatcher, enriched
# dispatch payload — do NOT re-introduce a second merge-triggered bridge
# workflow: two dispatchers = double dispatch + duplicate work orders).
#
# বাংলা মন্তব্য:
# যখনই supremeai-open:main-এ কোনো পাবলিক PR সফলভাবে merge হবে, এই workflow
# স্বয়ংক্রিয়ভাবে:
#   ১. একটি bridge/<task-id> patch branch তৈরি ও push করবে।
#   ২. 'bridge:queued' label সহ একটি Bridge Work Order issue file করবে।
#   ৩. repository_dispatch (event_type=bridge_order_queued) + client_payload
#      এর মাধ্যমে private monorepo-র Bridge Intake (scripts/bridge/)-কে
#      landed patch-এর full reference stream করবে: PR number, merge/head/base
#      SHA, bridge branch ref এবং touched-file manifest।
#
# Patch-streaming design (by-reference, deterministic):
#   - Public repo readable, তাই private intake শুধু
#     `git fetch https://github.com/Supremeai-bd/supremeai-open.git <bridge_branch>`
#     দিয়ে exact landed patch pull করতে পারে — payload ছোট থাকে, কোনো base64
#     blob সীমা ভাঙে না, আর head SHA সবসময় immutable।
#   - event_type অপরিবর্তিত (bridge_order_queued) — existing private listener
#     backward compatible; নতুন client_payload শুধু extra signal।
#   - BRIDGE_DISPATCH_TOKEN না থাকলে dispatcher notify-only mode-এ নামে:
#     durable WO issue তবুও file হয় (durable record), শুধু low-latency signal
#     miss হয় — ::warning:: annotation দিয়ে দৃশ্যমানভাবে লগ হয়, merge
#     automation fail করে না (degradation policy, fail-loud not fail-merge)।
#
# Trigger paths (single dispatcher, two channels — #113):
#   - pull_request:[closed] — only fires for merges made with a USER token.
#     merge-gate.yml merges with GITHUB_TOKEN, and GitHub suppresses the
#     pull_request event for token-driven actions (loop prevention), so this
#     channel alone never fired for auto-merges (zero sync branches / zero
#     work orders ever produced).
#   - workflow_dispatch(pr_number) — merge-gate calls it immediately after
#     every landing merge (workflow_dispatch is a documented exception to the
#     suppression), and humans can use it for backfill/reconciliation.
#   NEVER add a second bridge workflow: two dispatchers = double dispatch +
#   duplicate work orders. Re-dispatch is idempotent instead: deterministic
#   task id, branch re-pointed to the immutable merge commit, duplicate WO
#   filing skipped.
#
# Branch-point doctrine (#113):
#   The patch branch is created from the MERGE COMMIT (merge_commit_sha),
#   never from the PR head SHA. The Merge Gate merges with --delete-branch,
#   so by the time this workflow runs the head ref is gone and the head
#   commit object is no longer fetched — `git branch <name> <head_sha>`
#   failed with "not a valid branch point" on 100% of eligible merges
#   (zero sync branches / zero auto work orders ever produced). Both trigger
#   paths check out main AFTER landing, so the merge commit is an ancestor
#   of HEAD and its two parents are reachable through it.
#
# Work Order field list: keep the section names/order aligned with the
# canonical human template in .github/workflows/bridge-work-order.yml
# (Task ID / Patch Branch / Target Repo / Summary / Scope / Evidence /
# Rollback / Identity) — single field vocabulary, two producers.
# =============================================================================

name: Auto-Bridge Work Order (Public Merge -> Private Bridge Queue)

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to bridge into private repo"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  # Serialize dispatches for the same PR (deterministic task id + merge
  # commit): a re-dispatch that overlaps the original would race on the
  # same patch branch and work order.
  group: auto-bridge-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-bridge:
    name: "🌉 Create Auto Bridge Work Order"
    # Only run on merged PRs, and never run on bridge branches (loop prevention)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'bridge/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect touched files
        id: check_scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inputs pass through env — never interpolated into the shell
          # (workflow_dispatch inputs are free text and fated for a shell).
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUM="$DISPATCH_PR"
            case "$PR_NUM" in
              ''|*[!0-9]*)
                echo "::error::pr_number input is empty or non-numeric — refusing to resolve a PR."
                exit 1
                ;;
            esac
            echo "Processing dispatch for PR #${PR_NUM}..."
            PR_JSON=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json title,mergeCommit,baseRefOid,headRefOid,headRefName,state)
            STATE=$(echo "$PR_JSON" | jq -r '.state')
            if [ "$STATE" != "MERGED" ]; then
              echo "::error::PR #${PR_NUM} is not merged (state: $STATE) — bridge orders exist only for landed patches."
              exit 1
            fi
            HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
            if [[ "$HEAD_REF" =~ ^bridge/ ]]; then
              echo "PR #${PR_NUM} came from a bridge branch ($HEAD_REF) — loop prevention, skipping."
              exit 0
            fi
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
            PR_SHA=$(echo "$PR_JSON" | jq -r '.mergeCommit.oid')
            PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
            BASE_SHA=$(echo "$PR_JSON" | jq -r '.baseRefOid')
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "null" ]; then
              # gh without baseRefOid: REST fallback (base.sha is a reachable
              # recorded base head — diff pair stays valid).
              BASE_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" -q '.base.sha')
            fi
          else
            PR_NUM="${{ github.event.pull_request.number }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_SHA="${{ github.event.pull_request.merge_commit_sha }}"
            PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            echo "Processing merged PR #${PR_NUM}..."
          fi

          if [ -z "$PR_SHA" ] || [ "$PR_SHA" = "null" ]; then
            echo "::error::merge commit for PR #${PR_NUM} unavailable — cannot anchor the patch branch."
            exit 1
          fi

          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "pr_sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          # Get list of files touched in this PR
          FILES=$(git diff --name-only "$BASE_SHA" "$PR_SHA")
          echo "Touched files:"
          echo "$FILES"
          
          # Check if any shared core/doc/script files are touched
          SHOULD_BRIDGE="false"
          for f in $FILES; do
            case "$f" in
              scripts/agents/*|docs/*|AGENTS.md|AGENT_RULES.md|infrastructure/*)
                SHOULD_BRIDGE="true"
                break
                ;;
            esac
          done
          
          echo "should_bridge=$SHOULD_BRIDGE" >> "$GITHUB_OUTPUT"

      - name: Create Bridge Branch & File Work Order
        id: create_wo
        if: steps.check_scope.outputs.should_bridge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.check_scope.outputs.pr_num }}
          PR_TITLE: ${{ steps.check_scope.outputs.pr_title }}
          PR_SHA: ${{ steps.check_scope.outputs.pr_sha }}
          BASE_SHA: ${{ steps.check_scope.outputs.base_sha }}
        run: |
          # Deterministic identity: the task id date is the MERGE COMMIT date,
          # not the run date — re-dispatching the same PR on a later UTC day
          # reproduces the identical task id, patch branch, and work order.
          # One PR = at most one bridge branch + one WO issue, forever.
          DATE_STR=$(git show -s --format=%cd --date=format:%Y%m%d "${PR_SHA}" 2>/dev/null || true)
          if [ -z "$DATE_STR" ]; then
            DATE_STR=$(date +%Y%m%d)
          fi
          TASK_ID="bridge-${DATE_STR}-pr${PR_NUM}-sync"
          BRANCH_NAME="bridge/${TASK_ID}"

          # Date-independent re-dispatch detection: a work order filed for
          # THIS PR on any earlier UTC day (older date-stamped task id) is
          # still the same sync — adopt its task id/branch instead of
          # creating a twin. PR number match is suffix-anchored ("pr<N>-sync")
          # so PR #12 can never collide with PR #128.
          EXISTING_WS=$(gh issue list --repo "${{ github.repository }}" --state open --label "bridge:queued" --limit 50 \
            --json number,title \
            -q ".[] | select(.title | contains(\"pr${PR_NUM}-sync\")) | \"\(.number) \(.title)\"" | head -n 1)
          EXISTING_WO_NUM=""
          if [ -n "$EXISTING_WS" ]; then
            EXISTING_WO_NUM=${EXISTING_WS%% *}
            REUSED_TASK=$(printf '%s\n' "${EXISTING_WS#* }" | sed -n 's/.*(\(bridge-[0-9]\{8\}-[a-z0-9-]*pr'"${PR_NUM}"'-sync\)).*/\1/p' | head -n 1)
            if [ -n "$REUSED_TASK" ]; then
              TASK_ID="$REUSED_TASK"
              BRANCH_NAME="bridge/${TASK_ID}"
            fi
          fi

          # Expose identity to the dispatch step (patch-stream payload)
          echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          # The merge commit must exist in this checkout. Both trigger paths
          # check out main AFTER landing, so it is an ancestor of HEAD; a
          # missing object means the dispatch raced the merge landing.
          if ! git cat-file -e "${PR_SHA}^{commit}" 2>/dev/null; then
            echo "::error::merge commit ${PR_SHA} absent from checkout — dispatch likely raced the merge landing on main. Re-dispatch."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push bridge patch branch.
          # #113: branch from the MERGE COMMIT — the head ref is deleted by
          # the Merge Gate's --delete-branch, and any git operation anchored
          # on PR_HEAD_SHA fatal-exits with "not a valid branch point".
          # Idempotent: TASK_ID is anchored to the PR's merge commit date, so
          # a re-dispatch re-points the same ref to the same immutable object
          # instead of crashing with "already exists".
          git branch -f "${BRANCH_NAME}" "${PR_SHA}"
          git push origin "${BRANCH_NAME}"

          # Prepare Work Order body. Field order mirrors the canonical human
          # template (.github/workflows/bridge-work-order.yml) — see header
          # note. The heredoc lines below sit at the SAME indentation as the
          # surrounding script: the YAML block scalar strips that common
          # prefix, so the shell sees a top-level heredoc (content and EOF
          # terminator flush-left) — no indentation-repair pass needed (#113).
          if [ -n "$EXISTING_WO_NUM" ]; then
            echo "Work order for PR #${PR_NUM} already filed (#${EXISTING_WO_NUM}, task ${TASK_ID}) — skipping duplicate creation, continuing to dispatch."
          else
            cat <<EOF > /tmp/bridge_wo.md
          ### Task ID
          ${TASK_ID}

          ### Patch Branch
          ${BRANCH_NAME}

          ### Target Repo
          Supremeai-bd/supremeai

          ### Summary (what + why)
          Auto-bridged from merged public PR #${PR_NUM} (${PR_TITLE}). Automated synchronization of shared ecosystem assets into private monorepo.

          ### Scope Paths (files touched)
          $(git diff --name-only "${BASE_SHA}" "${PR_SHA}" | sed 's/^/- /')

          ### Test Evidence (3-tier contract)
          1. **Reflection Check:** Automatically ported from public PR #${PR_NUM} (merge commit ${PR_SHA}).
          2. **Syntax/Boot:** Public CI passed all verification guards prior to merge.
          3. **Tests:** Full constitutional gate battery evaluates this patch upon intake.

          ### Rollback Path
          - [x] \`git revert\`-নিরাপদ (autonomous sync commit; zero breaking database migration).

          ### Agent Identity
          auto-bridge-workflow / github-actions[bot]
          EOF

            echo "Submitting Bridge Work Order issue..."
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "🌉 Auto-Bridge: Sync PR #${PR_NUM} to private codebase (${TASK_ID})" \
              --body-file /tmp/bridge_wo.md \
              --label "bridge:queued"
          fi

      - name: Stream landed patch reference to private Bridge Intake (#107)
        if: steps.check_scope.outputs.should_bridge == 'true'
        env:
          BRIDGE_DISPATCH_TOKEN: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
          PR_NUM: ${{ steps.check_scope.outputs.pr_num }}
          PR_TITLE: ${{ steps.check_scope.outputs.pr_title }}
          PR_SHA: ${{ steps.check_scope.outputs.pr_sha }}
          # #113: bound from the resolved context output for BOTH trigger
          # paths — was read by the python payload below but missing from
          # env (KeyError -> empty payload -> broken dispatch) ever since the
          # workflow_dispatch refactor. head_sha is metadata only: the private
          # intake fetches the patch by branch ref, never by head object.
          PR_HEAD_SHA: ${{ steps.check_scope.outputs.pr_head_sha }}
          BASE_SHA: ${{ steps.check_scope.outputs.base_sha }}
          TASK_ID: ${{ steps.create_wo.outputs.task_id }}
          BRANCH_NAME: ${{ steps.create_wo.outputs.branch_name }}
        run: |
          if [ -z "${BRIDGE_DISPATCH_TOKEN}" ]; then
            echo "::warning::BRIDGE_DISPATCH_TOKEN not configured — repository_dispatch skipped (notify-only mode)."
            echo "Durable Bridge Work Order issue was already filed; private intake will reconcile on its next poll."
            exit 0
          fi

          # Build the patch-stream payload deterministically (JSON-safe quoting via python3).
          # #113: file manifest diffs base..MERGE COMMIT — same reachable pair
          # the scope check uses; the head-object-anchored diff fatal-exited here.
          export FILES_RAW="$(git diff --name-only "${BASE_SHA}" "${PR_SHA}")"
          PAYLOAD=$(python3 - <<'PYEOF'
          import json, os
          files = [f for f in os.environ.get("FILES_RAW", "").splitlines() if f.strip()]
          payload = {
              "event_kind": "bridge.order.queued",
              "source_repo": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ["PR_NUM"]),
              "pr_title": os.environ["PR_TITLE"],
              "task_id": os.environ["TASK_ID"],
              "bridge_branch": os.environ["BRANCH_NAME"],
              "merge_sha": os.environ["PR_SHA"],
              # .get + fallback: a missing binding degrades to an empty
              # string instead of a KeyError that silently empties the whole
              # payload (head SHA is metadata only — see env note above).
              "head_sha": os.environ.get("PR_HEAD_SHA", ""),
              "base_sha": os.environ["BASE_SHA"],
              "file_count": len(files),
              "files_truncated": len(files) > 100,
              "files": files[:100],
          }
          print(json.dumps({"event_type": "bridge_order_queued", "client_payload": payload}))
          PYEOF
          )

          # A python KeyError/crash leaves PAYLOAD empty — curl would POST an
          # empty body (4xx) while the log still implies a dispatch attempt.
          # Fail-honest: no payload, no request.
          if [ -z "$PAYLOAD" ]; then
            echo "::error::dispatch payload build failed — refusing to POST an empty body. WO issue is filed; private poll still converges."
            exit 1
          fi

          echo "Dispatching bridge_order_queued → Supremeai-bd/supremeai (private Bridge Intake)..."
          echo "  task_id: ${TASK_ID} | bridge branch: ${BRANCH_NAME} | merge: ${PR_SHA} (head ${PR_HEAD_SHA} may be GC'd — metadata only)"
          HTTP=$(curl -s -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${BRIDGE_DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai/dispatches \
            -d "${PAYLOAD}")
          if [ "${HTTP}" = "204" ]; then
            echo "✅ Private Bridge Intake dispatched (HTTP 204) — landed patch reference streamed."
          else
            echo "::warning::Private dispatch returned HTTP ${HTTP} (response below). Durable WO issue already filed — degradation is visible, merge automation not failed."
            cat /tmp/dispatch_resp.txt || true
          fi
