name: ⚡ Autonomous Agent Task (New Work Request)
description: Create a task for autonomous agents (local or virtual web bots) to claim and solve.
title: "type(scope): brief description — e.g. feat(backend): new router, fix(ci): pipeline repair"
labels: ["P1-high", "handoff:coder"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🤖 SupremeAI Agent Task Contract
        This task is open to **all autonomous agents** (Local Antigravity, Claude, ChatGPT, Mistral, external contributors).
        
        **How to solve this task:**
        1. Fork `Supremeai-bd/supremeai-open` (zero credentials needed).
        2. Create a branch: `contributor/issue-<task-id>` (or `bridge/<task-id>` for collaborator bridge lane).
        3. Work strictly within the declared **Touching Files**.
        4. Run and satisfy the **3-Tier Verification Contract** via `python scripts/agents/continuous_agent_loop.py --verify-only` (the 3 tiers are the process phases; the automated evidence tiers are SSOT'd in `docs/AGENT_LOOP_SPEC.md` §4).
        5. Submit a Pull Request to `Supremeai-bd/supremeai-open:main` or open a **Bridge Work Order**. The internal Bridge automation ports and tests your change in the target repository.

  - type: dropdown
    id: target_repo
    attributes:
      label: Primary Group (Target Repository)
      description: Which repository in the SupremeAI Federation should receive this change?
      options:
        - Supremeai-bd/supremeai-open
        - Supremeai-bd/supremeai
        - Supremeai-bd/supremeai-command
        - Supremeai-bd/supremeai-skills
        - Supremeai-bd/supremeai-vscode
        - Supremeai-bd/supremeai-agents
        - Supremeai-bd/supremeai-browser
        - Supremeai-bd/supremeai-api
        - Supremeai-bd/supremeai-studio
        - Supremeai-bd/supremeai-infrastructure
        - Supremeai-bd/supremeai-core
        - Supremeai-bd/supremeai-sdk
        - Supremeai-bd/supremeai-mcp-control-plane
        - Supremeai-bd/supremeai-archive
    validations:
      required: true

  - type: dropdown
    id: sub_group
    attributes:
      label: Sub-Group / Functional Domain (Area)
      description: Cross-cutting functional domain for ownership, labeling, and routing.
      options:
        - "security (Authentication, key-plane, boundaries, vulnerability)"
        - "ci (Workflows, gates, lint, testing matrix)"
        - "gateway (API endpoints, routing, provider failover)"
        - "governance (Constitution, rules, templates, policies, ADRs)"
        - "agent-orchestration (Lifecycle, loop, roles, worker dispatch)"
        - "mcp-tower (MCP tools, JSON-RPC, SSE bridge, server endpoints)"
        - "core-engine (Intelligence models, state machine, planning)"
        - "frontend-ui (Studio, dashboard, visual UX, components)"
        - "telemetry (Heartbeats, logging, watcher, metrics)"
        - "memory (Archive, semantic memory, context history)"
        - "llm-routing (Dynamic router, provider fallback, model selection)"
        - "infra-ops (Docker, Terraform, actions runners, deployment configs)"
        - "docs (Documentation, ecosystem maps, contributor guides)"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority Tier
      description: Urgency of this task per SupremeAI constitution
      options:
        - "P0-critical (Production outage/security/fatal bug)"
        - "P1-high (Important fix/blocker/architecture)"
        - "P2-medium (Standard feature/refactor/test)"
        - "P3-low (Minor chore/doc/lint/polish)"
    validations:
      required: true

  - type: dropdown
    id: topological_layer
    attributes:
      label: Topological Layer (#2682)
      description: Layer level of the task
      options:
        - "Layer 1 (Schemas & Contracts)"
        - "Layer 2 (Tools / Workers / Sidecars)"
        - "Layer 3 (Core Engine & State Machine)"
        - "Layer 4 (API Endpoints & Routes)"
        - "Layer 5 (Frontend & Client UI)"
        - "N/A (docs/chore/tooling — no layer)"
    validations:
      required: true

  - type: dropdown
    id: task_group
    attributes:
      label: Task Group (VALID_GROUPS registry)
      description: >
        Canonical taxonomy (#63) — arbitrary/invented group names are rejected
        fail-closed by build_task_contract(). Keep aligned with VALID_GROUPS in
        scripts/agents/continuous_agent_loop.py.
      options:
        - agent-orchestration
        - mcp-tower
        - core-engine
        - schemas-contracts
        - infra-ops
    validations:
      required: true

  - type: textarea
    id: mission
    attributes:
      label: Mission & Problem Statement
      description: Detailed description of what needs to be solved, implemented, or refactored.
      placeholder: "Describe the goal, requirements, and acceptance criteria..."
    validations:
      required: true

  - type: textarea
    id: touching_files
    attributes:
      label: Touching Files (Scope Gate Boundary)
      description: The exact 1-5 files this task is authorized to touch (one per line).
      placeholder: |
        - core/config/registry.py
        - tests/test_config.py
    validations:
      required: true

  - type: textarea
    id: verification_contract
    attributes:
      label: 3-Tier Verification Contract
      description: Exact commands required to verify the implementation.
      value: |
        1. Reflection Check: `git grep -n "<symbol>"`
        2. Boot Smoke Test: `python -c "import backend.main; print('Boot smoke passed')"`
        3. Test Suite: `pytest <test_file_path> -v`
    validations:
      required: true
