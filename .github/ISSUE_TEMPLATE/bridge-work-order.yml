name: Bridge Work Order (external agents)
description: >
  Submit work to the private SupremeAI codebase WITHOUT private-repo access.
  The bridge validates fail-closed, applies inside the private repo, and your
  change lands only after the full constitutional gate battery.
labels: ["bridge:queued"]
body:
  - type: markdown
    attributes:
      value: |
        **Bridge contract v1 — agents work in public, code lands private.**

        1. Push your patch branch to THIS repo: `bridge/<task-id>` (diff base = `main` of this repo).
           **Eligibility:** the branch lane requires collaborator write access (proxy bots / org
           agents). Zero-credential agents without push access: submit via AGENTS.md §2.1
           Pathway 2 (fork + PR) instead — do not file a work order for a branch you cannot push.
        2. File this work order. The bridge (running inside the private codebase) does the rest.
        3. Track your issue labels: `bridge:queued → bridge:in-gates → bridge:landed | bridge:rejected | bridge:admin-review`

        Hard rules: never include secrets in diffs (pattern-scan is automatic);
        `.github/`, ledger and key-plane paths go to `bridge:admin-review`;
        no success claims without evidence (rule U2);
        cohesive task sizing: atomic domain slices only (rule P7, #522).
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Unique id — format bridge-YYYYMMDD-<slug> (lowercase, hyphens only)
      placeholder: bridge-20261009-fix-readme-typo
    validations:
      required: true
  - type: input
    id: patch_branch
    attributes:
      label: Patch Branch
      description: Branch on THIS repo that contains your change (diffed against main)
      placeholder: bridge/bridge-20261009-fix-readme-typo
    validations:
      required: true
  - type: dropdown
    id: target_repo
    attributes:
      label: Primary Group (Target Repo)
      options:
        - Supremeai-bd/supremeai-open
        - Supremeai-bd/supremeai
        - Supremeai-bd/supremeai-command
        - Supremeai-bd/supremeai-skills
        - Supremeai-bd/supremeai-vscode
        - Supremeai-bd/supremeai-agents
        - Supremeai-bd/supremeai-browser
        - Supremeai-bd/supremeai-api
        - Supremeai-bd/supremeai-studio
        - Supremeai-bd/supremeai-infrastructure
        - Supremeai-bd/supremeai-core
        - Supremeai-bd/supremeai-sdk
        - Supremeai-bd/supremeai-mcp-control-plane
        - Supremeai-bd/supremeai-archive
    validations:
      required: true

  - type: dropdown
    id: sub_group
    attributes:
      label: Sub-Group / Functional Domain (Area)
      options:
        - "security (Authentication, key-plane, boundaries, vulnerability)"
        - "ci (Workflows, gates, lint, testing matrix)"
        - "gateway (API endpoints, routing, provider failover)"
        - "governance (Constitution, rules, templates, policies, ADRs)"
        - "agent-orchestration (Lifecycle, loop, roles, worker dispatch)"
        - "mcp-tower (MCP tools, JSON-RPC, SSE bridge, server endpoints)"
        - "core-engine (Intelligence models, state machine, planning)"
        - "frontend-ui (Studio, dashboard, visual UX, components)"
        - "telemetry (Heartbeats, logging, watcher, metrics)"
        - "memory (Archive, semantic memory, context history)"
        - "llm-routing (Dynamic router, provider fallback, model selection)"
        - "infra-ops (Docker, Terraform, actions runners, deployment configs)"
        - "docs (Documentation, ecosystem maps, contributor guides)"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary (what + why)
      description: 1-3 lines. What changed and why it is useful.
    validations:
      required: true
  - type: textarea
    id: scope_paths
    attributes:
      label: Scope Paths (files touched)
      description: One path per line — the Scope Gate boundary for this task.
      placeholder: |
        - backend/api/...
        - docs/...
    validations:
      required: true
  - type: textarea
    id: tests_evidence
    attributes:
      label: Test Evidence (3-tier contract)
      description: Reflection check / syntax-boot smoke / test commands + outputs.
    validations:
      required: true
  - type: textarea
    id: rollback_path
    attributes:
      label: Rollback Path
      description: How to undo this change safely (git revert-safe unless migration involved).
    validations:
      required: true
  - type: input
    id: agent_identity
    attributes:
      label: Agent Identity
      description: Which agent + session did the work (attribution goes into the commit + ledger).
      placeholder: glm5.2-coder-1 / session web-03ac04df
    validations:
      required: true

  - type: dropdown
    id: probe_lifecycle
    attributes:
      label: ⏱️ Work Order Nature (Production Change vs Ephemeral Probe)
      description: Is this a permanent production fix/feature or an ephemeral test/probe?
      options:
        - "Production Change (Permanent — Must go through full landing)"
        - "Ephemeral Probe / Test (Auto-reap upon verification, TTL <= 15m)"
    validations:
      required: true

  - type: textarea
    id: recurrence_prevention
    attributes:
      label: 🛡️ Recurrence Prevention & Invariant Guarantee
      description: >
        How does this change prevent this bug or regression from happening again in the future?
        Cite the automated test, CI gate, or architectural assertion that guarantees prevention permanently.
      placeholder: "e.g., Added unit test in tests/test_*.py; enforced via CI preflight assertion."
    validations:
      required: true

  - type: textarea
    id: duplicate_audit_evidence
    attributes:
      label: 🔍 Existing Issue & Board Deduplication Verification
      description: >
        Confirm you searched the board and verified zero collisions with existing open issues or PRs.
      placeholder: "Searched `gh issue list` and `gh pr list`: verified no conflicting or duplicate PRs."
    validations:
      required: true

  - type: textarea
    id: issue_validity_check
    attributes:
      label: 🎯 Coder Preflight: Issue Live Validity (ইস্যুটি কি এখনও ভ্যালিড?)
      description: >
        Did you verify against current main? Confirm the issue is still reproducible and active,
        and not already resolved/rendered obsolete by recent landed commits.
      placeholder: "Verified against main@<commit>: reproduced error before applying patch."
    validations:
      required: true

  - type: textarea
    id: optimal_approach_evaluation
    attributes:
      label: 💡 Solution Optimality & Alternatives (সাজেশনের চেয়ে বেটার কোনো ওয়ে আছে কি?)
      description: >
        Is the approach suggested in the issue description truly the best way, or did you evaluate
        a simpler, safer, or more cohesive alternative? Explain why this implementation is optimal
        per SupremeAI core philosophy ("Simple + effective > clever + complex", AGENTS.md §6).
      placeholder: "Evaluated issue suggestion vs simpler alternative; chose <X> because <reasons>."
    validations:
      required: true

  - type: checkboxes
    id: sizing_confirmation
    attributes:
      label: Task Sizing & Anti-Thrashing Confirmation (#522)
      options:
        - label: "Cohesive Scope: This patch represents an atomic domain slice (≤ 30 files, ≤ 200 KB diff) and does not fragment a feature into racing micro-issues."
          required: true
