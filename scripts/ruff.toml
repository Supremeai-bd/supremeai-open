# scripts/ ruff config (#2469)
# =====================================================================================
# Issue #2469: scripts/ had ~2,317 ruff violations (483 blind-exception, 159
# named-but-unused) — confirmed partial-cleanup left ~1,625 still open. There was
# NO ruff.toml in scripts/, so CI couldn't gate against regression. This config:
#   1. Defines the rule set scripts/ must obey (a pragmatic subset — full strict
#      would block on the existing debt, so we start with the highest-signal rules).
#   2. Allows scripts/ci scripts to be migrated incrementally — `per-file-ignores`
#      exempts the noisiest legacy files with TODOs pointing back to #2469.
#   3. Is picked up automatically by `ruff check scripts/` and CI gates.
#
# Migration path: each new rule added here is a deliberate decision to enforce it.
# When the violation count for a rule hits zero, add it to `select` permanently.
# Until then, rules in `select` are enforced but `ignore` lists the known-unfixed
# codes so CI passes on the current tree (debt tracked separately).

target-version = "py311"
line-length = 120
extend-exclude = [
    # Generated / vendored — never lint
    "__pycache__",
    ".venv",
    "node_modules",
    # Audit baseline JSON files (data, not code)
    "**/*baseline*.json",
]

[lint]
# Tier 1 — enforce immediately (debt already at zero or near-zero per #2469 recount):
#   E722  bare `except:` (was 483 → 0 now)
#   F821  undefined name (required to prevent fail-silent dead paths)
#   F841  named-but-unused local var (was 159 → 27 now, target zero)
#   F401  unused-import (was 186 → 0 after the #2469 F401 sweep — 2026-09-30;
#         availability-probes migrated to importlib.util.find_spec, dead probes removed)
select = ["E722", "F821", "F841", "F401"]

# Tier 2 — debt still high; ignore for now but track in #2469 follow-up:
#   BLE001 blind `except Exception:` (517 violations — sweep needed)
#   DTZ005 datetime without tz (159 — affects audit scripts, low risk)
#   SIM102 nested if (87)
#   PLW1510 open without encoding (76)
#   UP035/UP006 deprecated typing (57 each)
#   LOG015  root logger call (46)
ignore = [
    "BLE001",  # TODO #2469: blind except Exception — sweep pending (517 sites)
    "DTZ005",
    "SIM102",
    "PLW1510",
    "UP035",
    "UP006",
    "LOG015",
]

[lint.per-file-ignores]
# Legacy audit/devops scripts with heavy fire-and-forget patterns — scheduled for
# incremental migration in #2469 follow-up PRs. Each entry has a TODO + issue ref.
# NOTE: paths are relative to THIS config file (scripts/ruff.toml), so "ci/*.py"
# resolves to scripts/ci/*.py when ruff runs against scripts/.
"devops/*.py" = ["E402", "C901"]  # complex legacy functions
"audit/*.py" = ["E402"]            # late imports for optional deps
"advanced_analysis/*.py" = ["C901", "F841"]  # TODO #2469: 6 files with F841
# TODO #2469: the following dirs/files still carry 27 F841 (named-but-unused) violations
# in aggregate. Until the unused-var sweep removes them, we exempt them here so CI
# passes on the current tree. DO NOT add NEW F841 violations to any of these —
# they are tracked for incremental cleanup.
"agents/*.py" = ["F841"]
"audit_underutilized_capabilities.py" = ["F841"]
"ci/*.py" = ["F841"]
"governance/*.py" = ["F841"]
"lib/*.py" = ["F841"]
"merge_and_consolidate_docs.py" = ["F841"]
"security/*.py" = ["F841"]
"supremeai_toolkit/*.py" = ["F841"]
"testing/*.py" = ["F841"]

[format]
# Don't auto-format — we're only gating on lint, not reformatting the tree.
# Reformatting would create massive churn PRs unrelated to #2469.
quote-style = "preserve"
indent-style = "space"
