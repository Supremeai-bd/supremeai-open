name: 🩺 Dependency Health Check

on:
  # শুধুমাত্র dependency ফাইল পরিবর্তন হলেই এই workflow চলবে
  push:
    branches:
      - main
      - develop
    paths:
      - '**/pnpm-lock.yaml'
      - '**/package.json'
      - '**/pyproject.toml'
      - '**/poetry.lock'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/pnpm-lock.yaml'
      - '**/package.json'
      - '**/pyproject.toml'
      - '**/poetry.lock'
  # ম্যানুয়ালি চালানোর জন্য
  workflow_dispatch:

jobs:
  dependency-scan:
    name: 🩺 Dependency Health Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Node.js/pnpm এনভায়রনমেন্ট সেটআপ ---
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # package.json থেকে পাওয়া
          cache: 'pnpm'

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      # --- Python/Poetry এনভায়রনমেন্ট সেটআপ ---
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # --- হেলথ চেক স্ক্রিপ্ট চালানো ---
      - name: Run Dependency Health Checker
        run: python scripts/quality/check_dependencies.py
