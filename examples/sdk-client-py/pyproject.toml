[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supremeai-sdk-client-py"
version = "0.1.0"
description = "Zero-dependency async Python SDK client for the SupremeAI MCP Tower: SSE streaming, tool calling, task dispatch, honest error taxonomy. Mock-MCP-server harness embedded (--self-test)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SupremeAI Federation" }]
keywords = ["supremeai", "mcp", "sdk", "asyncio", "sse"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Framework :: AsyncIO",
  "Operating System :: OS Independent",
]
# Zero runtime dependencies by contract (house style: stdlib only).
dependencies = []

[project.urls]
Repository = "https://github.com/Supremeai-bd/supremeai-open"
ConnectionGuide = "https://github.com/Supremeai-bd/supremeai-open/blob/main/docs/MCP_CONNECT.md"

[tool.setuptools]
py-modules = ["client"]
