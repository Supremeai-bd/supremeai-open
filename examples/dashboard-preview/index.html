<!DOCTYPE html>
<!--
  SupremeAI Studio — Dashboard Preview (issue #24)
  Zero-dependency vanilla HTML/CSS/JS glassmorphism reference renderer for
  api-schemas/dashboard.schema.json (DashboardSnapshot).

  DESIGN GUIDELINES (normative, mirrored in the schema description):
  - Fast: no third-party network requests; system font stacks; CSS-only animation.
  - Accessible: skip link; landmarks (header/nav/main/footer); aria-pressed filters;
    :focus-visible rings; body contrast >= 4.5:1; interactive targets >= 44px;
    prefers-reduced-motion disables all non-essential animation.
  - Responsive: mobile-first fluid grid — 1 column < 640px, 2 columns >= 640px,
    3 columns >= 1024px; clamp() fluid type.
  - Fail-closed: index.js validates the embedded snapshot against the schema's
    core constraints at boot; on violation it renders an error banner instead of
    untrustworthy data.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>SupremeAI Studio — Federation Dashboard</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to dashboard</a>

  <header class="topbar" role="banner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <div>
        <p class="brand-name">SupremeAI <span>Studio</span></p>
        <p class="brand-sub">Federation Command Surface</p>
      </div>
    </div>
    <div class="topbar-status">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="status-pill" class="pill" role="status">LIVE</span>
      <time id="clock" class="clock" aria-label="UTC clock">--:--:--</time>
    </div>
  </header>

  <nav class="filters" role="navigation" aria-label="Agent filters">
    <button class="filter is-active" data-filter="all" aria-pressed="true">All agents</button>
    <button class="filter" data-filter="working" aria-pressed="false">Working</button>
    <button class="filter" data-filter="blocked" aria-pressed="false">Blocked</button>
    <button class="filter" data-filter="done" aria-pressed="false">Done</button>
  </nav>

  <main id="main" class="layout" role="main">
    <div id="error-banner" class="error-banner" hidden role="alert"></div>

    <section aria-labelledby="federation-heading">
      <h2 id="federation-heading" class="section-title">
        Federation status <span id="repo-count" class="count"></span>
      </h2>
      <div id="repos" class="grid" aria-live="polite"></div>
    </section>

    <section aria-labelledby="agents-heading">
      <h2 id="agents-heading" class="section-title">
        Live agent telemetry <span id="agent-count" class="count"></span>
      </h2>
      <div id="agents" class="grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <p>
      Snapshot <span id="snapshot-id" class="mono">—</span> ·
      generated <time id="generated-at">—</time> ·
      contract <a href="../../api-schemas/dashboard.schema.json">dashboard.schema.json</a>
    </p>
    <p class="footer-dim">Zero dependencies · system fonts · token-driven dark glass · issue #24</p>
  </footer>

  <script src="index.js" defer></script>
</body>
</html>
