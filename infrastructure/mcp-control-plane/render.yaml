services:
  - type: web
    name: supremeai-mcp-tower
    env: node
    # R55 option B (#2249): health-check gating. The deploy-lane RCA
    # (docs/bridge/bridge-20261028-deploy-lane-rca.md) documented healthCheckPath
    # empty => boot failures surface only as the generic swap failure with no
    # health signal; P1 #2211's silent rollback was exactly that class. /health
    # verified live 200/82ms (zero-credential probe 2026-10-29 ~19:45Z; body is
    # the tower's own subsystem JSON and Render's gate is transport-level 2xx,
    # body ignored — boot discrimination is the goal, subsystem view is not).
    healthCheckPath: /health
    # INF-03/INF-04 (issues #506/#507): without rootDir, Render ran every
    # command from the repo root: 'npm run start' hit the root package.json
    # (no 'start' script -> instant crash) and 'npm run build' invoked turbo,
    # which never compiled mcp-control-plane/src -> dist (node dist/index.js
    # ENOENT). With rootDir set, npm install (uses this package's own
    # package-lock.json), tsc build and 'npm run start' all resolve here.
    # The Infisical bootstrap is vendored under scripts/runtime/ inside this
    # package so the start command works without repo-root files.
    rootDir: infrastructure/mcp-control-plane
    # Issue #707: uv pinned (unpinned `pip install uv` = supply-chain risk on
    # every build); current stable at the time of the fix. The tower's
    # Dockerfile installs uv via the astral.sh installer for runtime use.
    # Issue #1441: buildCommand-installed uv does NOT persist to the runtime
    # service -> 'spawn uv ENOENT' (verified live via memory_status, 2026-09-26).
    # Instead provision backend/.venv at build time -- the repo checkout IS
    # persisted, and backend/.venv/bin/python is the MemorySubAdapter's
    # preferred launcher. Only the `mcp` package is needed: the sidecar's
    # core.* imports are stdlib-light and memory stores degrade gracefully.
    buildCommand: pip install uv && rm -rf ../../backend/.venv && uv venv ../../backend/.venv && uv pip install --python ../../backend/.venv/bin/python "mcp>=1.28.1" && npm install && npm run build && npm ci --prefix ../../.agents/skills/devtools-audit
    startCommand: python scripts/runtime/infisical_bootstrap.py npm run start
    envVars:
      - key: MCP_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: RENDER_API_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENV
        value: prod
      - key: INFISICAL_SECRET_PATH
        value: /
      - key: INFISICAL_TOKEN
        sync: false
      - key: SUPREMEAI_ADMIN_PASSWORD_HASH
        sync: false
      - key: SUPREMEAI_JWT_SECRET
        sync: false
      - key: MCP_ADMIN_KEY
        sync: false
      - key: TOWER_AUTH_TOKEN
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SUPREMEAI_BACKEND_DIR
        value: ../../backend