name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pydantic fastapi httpx beautifulsoup4 loguru
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Lint with ruff
        run: |
          ruff check . --select=E9,F63,F7,F82

      - name: Run pytest
        run: |
          pytest -v

      - name: Secret scan (fail-closed)
        run: |
          set -euo pipefail
          HIT=0
          check() {
            if grep -rInE "$1" --exclude-dir=.git . 2>/dev/null; then
              echo "::error::secret-pattern hit: $2"; HIT=1
            fi
          }
          check 'sk-[A-Za-z0-9]{20,}' 'OpenAI-style sk- key'
          check 'gh[pousr]_[A-Za-z0-9]{36,}' 'GitHub token'
          check 'AKIA[0-9A-Z]{16}' 'AWS access key'
          check 'AIza[0-9A-Za-z_-]{35}' 'Google API key'
          if [ "$HIT" -eq 1 ]; then
            echo "Security violation: secret detected in repository"
            exit 1
          fi
          echo "Secret scan clean"

      - name: Trigger Federation CI Watchdog on Failure
        if: failure()
        env:
          DISPATCH_TOKEN: ${{ secrets.OPEN_SYNC_PAT || secrets.MERGE_PAT || secrets.OPEN_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai-open/dispatches \
            -d "{\"event_type\": \"federation_ci_failed\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"workflow_name\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"html_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit_sha\": \"${{ github.sha }}\"}}" || true
