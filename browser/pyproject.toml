[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supremeai-browser"
version = "0.1.0"
description = "Stealth Automation Sandbox & Anti-Detect Headless Runtime (SupremeAI federation satellite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "SupremeAI Federation" }]
dependencies = [
    "playwright>=1.40",
    "lxml>=4.9",
    "cryptography>=41.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
runtime = ["playwright>=1.40", "lxml>=4.9"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["runtime*", "ghost_tower*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Lint config lives under [tool.ruff.lint] (current ruff layout).

[tool.ruff.lint]
# Pin ruff's classic stable rule set (E4/E7/E9/F = the long-standing defaults).
# Root cause of the 2026-10-23/24 CI red: ruff 0.17 expanded its *default*
# select (BLE001, S110, TRY004, EXE002, RUF012, PYI034, PIE810 now fire with
# zero config), flipping this previously-green satellite red with no code
# change. This is a stealth-automation harness: broad `except Exception`
# guards at task/loop boundaries are by design (the automation must never
# crash on arbitrary browser/network faults) - narrowing ~43 handlers or
# sprinkling noqa would be churn, not safety. Targeted hardening of the
# silent-except sites is tracked under the #756 anchor.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Star-import facade (consolidated auth module). It has zero in-repo
# consumers and none of the re-exported modules define __all__, so an
# explicit re-export enumeration would silently change the exported surface.
"ghost_tower/browser_auth.py" = ["F403"]
