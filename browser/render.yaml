services:
  - type: web
    name: supremeai-browser
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GEMINI_PROFILE_DIR
        value: /tmp/profile
      # R56 option A agent-slice (#2262): the ghost-tower vault regenerates its
      # Fernet master key on every boot (VAULT_DIR ~/.supremeai_vault is
      # ephemeral — outside the /data/profile disk), so anything encrypted
      # under a previous key becomes unreadable after every redeploy
      # (successful ones included); the #2225 deploy-storm fired it repeatedly.
      # credential_vault.py:32-36 resolves this env var FIRST — declaring it
      # here (value synced from dashboard/Infisical once the platform lane
      # stores the secret; runbook in
      # docs/bridge/bridge-20261029-ghost-vault-key-brief.md) is a no-op until
      # then and makes the next key generation the last one. Unset = rollback.
      - key: CREDENTIAL_MASTER_KEY
        sync: false
    