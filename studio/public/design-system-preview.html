<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupremeAI Design System - Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --supreme-bg: #0a0e1a;
            --supreme-bg-elevated: #111827;
            --supreme-bg-overlay: #1a2236;
            --supreme-surface: #111827;
            --supreme-border: #1f2937;
            --supreme-text-primary: #f9fafb;
            --supreme-text-secondary: #e5e7eb;
            --supreme-text-muted: #9ca3af;
            --supreme-primary: #6366f1;
            --supreme-gradient-primary: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        }

        body {
            background-color: var(--supreme-bg);
            color: var(--supreme-text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .preview-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .preview-section {
            margin-bottom: 48px;
        }

        .preview-section h2 {
            font-size: 1.5rem;
            margin-bottom: 24px;
            color: var(--supreme-text-primary);
            border-bottom: 1px solid var(--supreme-border);
            padding-bottom: 12px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .component-showcase {
            background: var(--supreme-bg-elevated);
            border: 1px solid var(--supreme-border);
            border-radius: 14px;
            padding: 24px;
        }

        .gradient-text {
            background: var(--supreme-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <div class="preview-container">
        <div style="text-align: center; margin-bottom: 48px;">
            <h1 class="gradient-text" style="font-size: 2.5rem; margin-bottom: 16px;">SupremeAI Design System 2.0 Showcase</h1>
            <p style="color: var(--supreme-text-muted); font-size: 1.1rem;">Unified Design System Preview for Web & Admin Dashboard</p>
        </div>

        <div class="preview-section">
            <h2>✨ Glassmorphism & Bento Grid Preview</h2>
            <div class="preview-grid">
                <div class="glass" style="padding: 24px; border-radius: 16px;">
                    <h3 style="color: white; margin-bottom: 8px;">Bento Glass Card</h3>
                    <p style="color: var(--supreme-text-secondary); font-size: 0.9rem;">Modern frosted glass visual design with realtime blur and subtle borders.</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
