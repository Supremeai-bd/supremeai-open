server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # FINAL-TEST HARDENING: response-level security headers. The in-page meta CSP
    # cannot express frame-ancestors, so clickjacking protection lives here.
    # X-Frame-Options is intentionally omitted for /embed paths if those are ever
    # added; today everything is served with SAMEORIGIN.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # FE-05 (Issue #522): the in-page meta CSP was removed from index.html —
    # the enforcing policy now ships as a response header (mirrors the
    # vercel.json CSP). connect-src drops http://localhost:* and
    # http://127.0.0.1:* (no loopback pivot from a prod page) and adds
    # frame-ancestors, which a meta CSP cannot express. frame-ancestors 'self'
    # matches the SAMEORIGIN X-Frame-Options choice above. script-src keeps
    # 'unsafe-eval': @monaco-editor/react loads Monaco via the jsDelivr AMD
    # loader (which evals) — removing it needs the sandboxed-iframe refactor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net https://www.gstatic.com https://www.googletagmanager.com https://cdn.firebase.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' wss: https: https://*.firebaseapp.com https://*.web.app https://api.openai.com https://generativelanguage.googleapis.com https://*.supremeai.dev https://*.firebaseio.com; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # ERR-A04 FIX (2026-09-16): @webcontainer/api (AgentWorkspace / IDE code
    # execution) requires cross-origin isolation — COOP same-origin + COEP
    # require-corp — otherwise window.crossOriginIsolated stays false and the
    # sandbox prints "Sandbox unavailable in this preview". Mirrors the Vite
    # dev-server headers (vite.config.ts server.headers). Note: COEP require-corp
    # means every cross-origin subresource must send CORP/CORS headers.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /admin-api/ {
        proxy_pass http://backend:8080/admin-api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # FINAL-TEST FIX: auth routes (/auth/refresh etc.) were proxied by the Vite
    # dev server but missing here, so every /auth/* call 404'd in the Docker
    # deployment and clients could never renew their sessions.
    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
