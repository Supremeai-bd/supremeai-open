name: Upstream Sync (Satellite → SupremeAI Monorepo)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-upstream:
    name: "🌉 Dispatch Upstream Sync to SupremeAI"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch bridge event to Supremeai-bd/supremeai
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.BRIDGE_DISPATCH_TOKEN || secrets.MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "bridge_satellite_sync",
            "client_payload": {
              "source_repo": "${{ github.repository }}",
              "satellite_repo": "${{ github.repository }}",
              "commit_sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}",
              "event_kind": "bridge.satellite.sync"
            }
          }
          EOF
          )
          echo "Dispatching bridge_satellite_sync to Supremeai-bd/supremeai..."
          HTTP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/Supremeai-bd/supremeai/dispatches \
            -d "${PAYLOAD}")
          if [ "$HTTP" = "204" ]; then
            echo "✅ Successfully dispatched upstream sync to Supremeai-bd/supremeai (HTTP 204)."
          else
            echo "::warning::Upstream dispatch returned HTTP ${HTTP}: $(cat /tmp/resp.txt)"
          fi
